<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>GOO BLASTER</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0618">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GOO BLASTER">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
     user-select:none;-webkit-user-select:none;touch-action:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0618;
     font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
     touch-action:pan-y;}   /* v0.9.8：見下方 #galaxyWrap 註解 */
  #wrap{position:fixed;inset:0;touch-action:pan-y;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .ui{position:absolute;inset:0;pointer-events:none;touch-action:pan-y;}
  .panel{position:absolute;inset:0;display:flex;flex-direction:column;
     align-items:center;justify-content:center;gap:14px;pointer-events:auto;touch-action:pan-y;
     background:rgba(10,6,24,.86);backdrop-filter:blur(8px);padding:22px;text-align:center;}
  /* 過關時不要遮住花火：背景半透明、不模糊，並淡入 */
  .panel.win{background:linear-gradient(180deg,rgba(10,6,24,.12) 0%,rgba(10,6,24,.62) 38%,
                                        rgba(10,6,24,.72) 100%);backdrop-filter:none;
             animation:fadein .8s ease both;}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .hide{display:none!important;}
  h1{font-size:clamp(34px,11vw,64px);font-weight:900;letter-spacing:-2px;line-height:.92;
     background:linear-gradient(95deg,#ff4fd8,#ffd84f 45%,#4ff0ff);-webkit-background-clip:text;
     background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4));}
  .sub{color:#9d92c4;font-size:13px;max-width:330px;line-height:1.65;}
  .btn{pointer-events:auto;border:0;border-radius:16px;padding:15px 34px;font-size:17px;
     font-weight:800;color:#150a26;cursor:pointer;font-family:inherit;
     background:linear-gradient(180deg,#7ef7c0,#2fd39a);
     box-shadow:0 5px 0 #128f68, 0 10px 22px rgba(47,211,154,.35);transition:transform .06s;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #128f68;}
  .btn.alt{background:linear-gradient(180deg,#b79dff,#8257ff);color:#fff;
     box-shadow:0 5px 0 #5a34c4, 0 10px 22px rgba(130,87,255,.35);}
  .btn.alt:active{box-shadow:0 2px 0 #5a34c4;}
  .btn.small{padding:9px 20px;font-size:13px;background:linear-gradient(180deg,#4b3c78,#33265a);
     color:#e4dcff;box-shadow:0 4px 0 #241a44;}
  .btn.small:active{box-shadow:0 1px 0 #241a44;}
  .btn.danger{background:linear-gradient(180deg,#ff8fa8,#ff4f74);color:#fff;
     box-shadow:0 4px 0 #b3243f;}
  .btn.danger:active{box-shadow:0 1px 0 #b3243f;}
  /* v0.9.9：通用彈窗樣式（先給「從第1關重來」二次確認用，v0.9.10 暫停畫面也共用這組） */
  .overlayBox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
     padding:22px;pointer-events:auto;background:rgba(8,4,20,.6);backdrop-filter:blur(3px);z-index:5;}
  .overlayBox .box{max-width:290px;background:linear-gradient(170deg,#241547,#150c2e);
     border:2px solid #3d2a6e;border-radius:20px;padding:24px 20px 20px;text-align:center;
     box-shadow:0 8px 0 rgba(0,0,0,.35);}
  .overlayBox .ic{font-size:34px;line-height:1;margin-bottom:6px;}
  .overlayBox .msg{font-size:15px;font-weight:800;color:#fff;margin-bottom:6px;}
  .overlayBox .sub2{font-size:12px;color:#a99ad0;line-height:1.6;margin-bottom:16px;}
  /* 遊戲中的暫停鍵，疊在 canvas 右上角、靜音鍵正上方。
     v0.9.12：原本是「深色底+一圈細灰線」，使用者反應看起來不可愛，
     改成跟其餘按鈕同一套「糖果色漸層 + 立體投影」語言（跟 .btn.alt 同色系），
     圓形描白邊、按下去有 Q 彈的位移感，不再是一顆孤零零的灰框圈。 */
  #btnPause{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;
     width:38px;height:38px;border-radius:50%;pointer-events:auto;cursor:pointer;
     background:linear-gradient(180deg,#c9b3ff,#8257ff);
     border:2.5px solid #fff3ff;color:#fff;font-size:15px;
     display:flex;align-items:center;justify-content:center;
     font-family:inherit;padding:0;z-index:4;
     box-shadow:0 3px 0 #5a34c4,0 5px 12px rgba(130,87,255,.45);
     transition:transform .07s;}
  #btnPause:active{transform:translateY(2px) scale(.94);box-shadow:0 1px 0 #5a34c4;}
  /* v0.9.10：核彈按鈕，疊在左下角、加速鍵正上方；用發光+脈動強調「這是稀有道具」 */
  #btnNuke{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 122px);
     width:52px;height:52px;border-radius:50%;pointer-events:auto;cursor:pointer;
     background:radial-gradient(circle at 35% 30%,#fff6b0,#ffb23f 55%,#ff5b3f);
     border:2.5px solid #fff3c4;color:#3a1600;font-size:24px;
     display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0;
     box-shadow:0 0 0 4px rgba(255,150,50,.25),0 4px 14px rgba(255,120,30,.55);
     animation:nukePulse 1.4s ease-in-out infinite;z-index:4;}
  #btnNuke:active{transform:scale(.9);}
  @keyframes nukePulse{0%,100%{box-shadow:0 0 0 4px rgba(255,150,50,.25),0 4px 14px rgba(255,120,30,.55);}
     50%{box-shadow:0 0 0 9px rgba(255,150,50,.12),0 4px 22px rgba(255,120,30,.75);}}
  /* 銀河挑戰路線：關卡選擇畫面（v0.9.5 取代原本的一排小圓點） */
  #galaxyWrap{position:relative;width:100%;max-width:330px;height:230px;
     overflow-y:auto;overflow-x:hidden;border-radius:16px;border:2px solid #402c78;
     background:radial-gradient(ellipse at 50% 0%,#2a1a52 0%,#160c30 55%,#0a0618 100%);
     -webkit-overflow-scrolling:touch;
     touch-action:pan-y;}
  /* v0.9.8：瀏覽器判斷「這根手指能不能拿來滑動捲軸」，看的是被摸到的那個元素
     本身、以及它所有祖先的 touch-action 交集——只要鏈上任何一層是 none 就整條斷掉。
     最上層 *{touch-action:none} 把 html/body/#wrap/.ui/.panel 全部鎖死了，
     光改 #galaxyWrap 沒用（手指實際摸到的是它裡面的 #galaxyInner／.gnode 節點，
     這兩層一樣被 * 鎖住）。所以連同 html、body、#wrap、.ui、.panel 都要開放 pan-y，
     這裡再用 #galaxyWrap * 把裡面所有子元素（節點、SVG、星星）一次蓋掉，
     不用每加一個新元素就要記得補一次。canvas 本身維持 none，搖桿拖曳的行為不受影響。*/
  #galaxyWrap *{touch-action:pan-y;}
  /* v0.9.9：捲軸拉把換成糖果配色的圓角版本，跟遊戲整體風格搭。
     只有支援 ::-webkit-scrollbar 的瀏覽器（Android Chrome 等）看得到這個樣式；
     iOS Safari 一律用系統自己的半透明拉把、不接受自訂，這點沒辦法用網頁技術解決。 */
  #galaxyWrap{scrollbar-width:thin;scrollbar-color:#c98bff rgba(255,255,255,.08);}
  #galaxyWrap::-webkit-scrollbar{width:9px;}
  #galaxyWrap::-webkit-scrollbar-track{background:rgba(255,255,255,.06);border-radius:99px;margin:8px 2px;}
  #galaxyWrap::-webkit-scrollbar-thumb{border-radius:99px;border:2px solid transparent;background-clip:padding-box;
     background-image:linear-gradient(180deg,#ff9ad5,#c98bff 55%,#8257ff);}
  #galaxyWrap::-webkit-scrollbar-thumb:hover{background-image:linear-gradient(180deg,#ffb3e0,#d7a4ff 55%,#9a72ff);}
  #galaxyInner{position:relative;width:100%;}
  #galaxyInner svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  #galaxyInner .star{position:absolute;border-radius:50%;background:#fff;opacity:.5;}
  .gnode{position:absolute;width:48px;height:48px;margin-left:-24px;margin-top:-24px;
     border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
     font-weight:900;font-size:15px;cursor:pointer;border:3px solid transparent;
     background:#241a44;color:#5c4f88;transition:transform .08s;}
  .gnode:active{transform:scale(.92);}
  .gnode.done{color:#0d2430;}
  .gnode.cur{border-color:#fff;animation:gpulse 1.5s ease-in-out infinite;}
  .gnode.locked{background:#1c1636;color:#453a68;cursor:default;}
  .gnode.sel{outline:3px solid #fff;outline-offset:2px;}
  .gnode .gnum{font-size:15px;line-height:1;}
  .gnode .gic{font-size:16px;line-height:1;}
  @keyframes gpulse{0%,100%{box-shadow:0 0 8px 1px rgba(255,255,255,.55);}
     50%{box-shadow:0 0 18px 4px rgba(255,255,255,.85);}}
  /* v0.9.14：大 Boss 關節點 —— 邊框加粗、圖示字級放大，跟一般數字關卡有明顯區別 */
  .gnode.boss{border-color:rgba(255,255,255,.65);}
  .gnode.boss .gic{font-size:22px;}
  /* 第100關（全遊戲最終大魔王）：紅色脈動光暈，蓋掉原本 .cur 的白色光暈，
     一眼看出「這關超恐怖」，跟前面99關的大Boss關再拉開一層視覺區隔 */
  .gnode.mega{animation:gpulseMega 1.1s ease-in-out infinite;border-color:#ff3355;}
  .gnode.mega .gic{font-size:26px;}
  @keyframes gpulseMega{0%,100%{box-shadow:0 0 10px 2px rgba(255,40,70,.65);}
     50%{box-shadow:0 0 26px 8px rgba(255,40,70,.95);}}
  #stageInfo{max-width:330px;background:linear-gradient(160deg,#2a1a52,#1b1138);
     border:2px solid #402c78;border-radius:16px;padding:13px 15px;text-align:left;}
  #stageInfo .st{font-size:11px;font-weight:900;letter-spacing:1px;}
  #stageInfo .nm{font-size:19px;font-weight:900;color:#fff;margin:3px 0 4px;}
  #stageInfo .ds{font-size:12px;color:#a294cc;line-height:1.6;}
  #stageInfo .mt{font-size:11px;color:#7e70ab;margin-top:6px;}
  #diag{font-size:10px;color:#5f5388;line-height:1.6;text-align:center;max-width:330px;
     word-break:break-all;pointer-events:auto;}
  #diag b{color:#ff8fae}
  .lvbtn{display:flex;align-items:center;gap:10px;text-align:left;border:0;cursor:pointer;
     border-radius:14px;padding:11px 13px;font-family:inherit;width:100%;
     background:linear-gradient(100deg,#2a1a52,#1b1138);border:2px solid #402c78;
     box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .07s;}
  .lvbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35);}
  .lvbtn.locked{opacity:.42;filter:grayscale(.7);cursor:default;}
  .lvbtn .num{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:flex;
     align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#150a26;}
  .lvbtn .txt{flex:1;min-width:0}
  .lvbtn .t1{font-size:14px;font-weight:800;color:#fff}
  .lvbtn .t2{font-size:10.5px;color:#a294cc;line-height:1.45;margin-top:1px}
  .lvbtn .dif{font-size:10px;font-weight:900;border-radius:99px;padding:2px 8px;color:#150a26}
  /* upgrade cards */
  #cards{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
     gap:10px;padding:14px;pointer-events:auto;background:rgba(8,4,20,.55);backdrop-filter:blur(3px);}
  .card{flex:1;max-width:180px;min-height:206px;border-radius:20px;padding:16px 12px;
     display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
     background:linear-gradient(170deg,#241547,#150c2e);border:2px solid #3d2a6e;cursor:pointer;
     box-shadow:0 8px 0 rgba(0,0,0,.35);transition:transform .08s;}
  .card:active{transform:scale(.96)translateY(3px);}
  .card .ic{font-size:40px;line-height:1;}
  .card .nm{font-size:15px;font-weight:800;color:#fff;}
  .card .ds{font-size:11.5px;color:#a99ad0;line-height:1.5;}
  .card .lv{font-size:10px;font-weight:700;color:#0d0720;background:#ffd84f;
     border-radius:99px;padding:2px 9px;}
  .card.evo{border-color:#ffd84f;background:linear-gradient(170deg,#5a2a12,#2a1030);}
  .lvtitle{position:absolute;top:8%;width:100%;text-align:center;font-size:19px;
     font-weight:900;color:#ffd84f;letter-spacing:1px;}
  #shot{max-width:min(88vw,340px);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.6);}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .stat{color:#cfc4ee;font-size:14px;line-height:1.9}
  .stat b{color:#ffd84f;font-size:17px}
  .tag{display:inline-block;font-size:11px;color:#8d7fb8;border:1px solid #3a2c63;
     border-radius:99px;padding:3px 10px;margin:2px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="ui">
    <div id="cards" class="hide"><div class="lvtitle">升級！選一張</div></div>

    <div id="menu" class="panel">
      <h1>GOO<br>BLASTER</h1>
      <div id="stageInfo"></div>
      <div id="galaxyWrap"><div id="galaxyInner"></div></div>
      <button class="btn" id="btnPlay">開始遊戲</button>
      <div class="row">
        <button class="btn small hide" id="btnReset">從第 1 關重來</button>
      </div>
      <div id="diag"></div>
      <div id="confirmBox" class="overlayBox hide">
        <div class="box">
          <div class="ic">⚠️</div>
          <div class="msg">確定要從第 1 關重來嗎？</div>
          <div class="sub2">目前的破關進度會被清除，這個動作沒辦法復原。</div>
          <div class="row">
            <button class="btn small" id="btnResetCancel">取消</button>
            <button class="btn small danger" id="btnResetConfirm">確定重來</button>
          </div>
        </div>
      </div>
    </div>

    <div id="over" class="panel hide">
      <h1 id="overTitle">GAME OVER</h1>
      <img id="shot" alt="戰報">
      <div class="row">
        <button class="btn hide" id="btnNext">下一關 ▶</button>
        <button class="btn" id="btnAgain">再玩一次</button>
        <button class="btn alt" id="btnSave">存戰報</button>
        <button class="btn small" id="btnMenu">回主畫面</button>
      </div>
    </div>

    <button id="btnPause" class="hide" title="暫停">⏸</button>
    <button id="btnNuke" class="hide" title="使用核彈">☢️</button>
    <div id="pauseOverlay" class="overlayBox hide">
      <div class="box">
        <div class="ic">⏸️</div>
        <div class="msg">遊戲已暫停</div>
        <div class="row">
          <button class="btn small" id="btnResume">▶ 繼續遊戲</button>
          <button class="btn small danger" id="btnQuitToMenu">回主畫面</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
const BUILD='v0.9.14';          // 每次交付都會變，手機上可在主畫面右下角確認
//====================== 診斷（真機問題回報用）======================
// 手機上沒有 console 可以看，所以把致命錯誤與輸入事件計數直接顯示在畫面上。
const DIAG={touch:0,tmove:0,tend:0,pointer:0,pmove:0,mouse:0,err:'',warn:''};
addEventListener('error',e=>{ if(!DIAG.err) DIAG.err=(e.message||'err')+' @'+((e.filename||'').split('/').pop())+':'+e.lineno; });
addEventListener('unhandledrejection',e=>{ if(!DIAG.err) DIAG.err='promise: '+(e.reason&&e.reason.message||e.reason); });

//====================== 基礎 ======================
const cv=document.getElementById('cv'), ctx=cv.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,SAFE_TOP=0,SAFE_BOT=0;
const safeProbe=document.createElement('div');
safeProbe.style.cssText='position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);pointer-events:none;';
const safeProbeB=document.createElement('div');
safeProbeB.style.cssText='position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-bottom,0px);pointer-events:none;';
document.body.appendChild(safeProbe); document.body.appendChild(safeProbeB);
const BTN={x:0,y:0,r:44};                     // 加速鍵（左下拇指區）
const MUTE={x:0,y:0,r:17};                    // 靜音鍵
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  SAFE_TOP=Math.max(0,safeProbe.getBoundingClientRect().height);
  SAFE_BOT=Math.max(0,safeProbeB.getBoundingClientRect().height);
  BTN.r=Math.max(40,Math.min(52,W*0.12));
  BTN.x=BTN.r+20; BTN.y=H-BTN.r-24-SAFE_BOT;   // 左下拇指區
  MUTE.x=W-MUTE.r-14; MUTE.y=SAFE_TOP+78;
}
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,120)); resize();

//====================== 音效與音樂（純程序合成，無外部檔案）======================
// 設計原則：每次發聲都疊 2–3 層並帶隨機微變（音高/濾波/音量），
// 避免「同一顆取樣重複播放」的機械感。
const SFX=(()=>{
  let ac=null,master=null,sfxBus=null,musBus=null,muted=false,initFailed=null;
  const last={}; let noiseBuf=null;
  const R=(a,b)=>a+Math.random()*(b-a);

  function init(){
    if(ac||initFailed)return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC){ initFailed='no AudioContext'; return; }
    try{
    ac=new AC();
    // 之前整條訊號（含音樂）都吃同一顆 compressor → 一開火就把音樂壓下去，
    // 放開又彈回來，聽起來就是「忽大忽小」。改成只壓音效，音樂完全繞過。
    const comp=ac.createDynamicsCompressor();
    comp.threshold.value=-8; comp.knee.value=32; comp.ratio.value=3.2;
    comp.attack.value=0.010; comp.release.value=0.35;
    master=ac.createGain(); master.gain.value=0.85;
    sfxBus=ac.createGain(); sfxBus.gain.value=0.30;
    musBus=ac.createGain(); musBus.gain.value=0.0;      // 淡入用
    sfxBus.connect(comp); comp.connect(master);         // 音效 → 壓縮 → 主輸出
    musBus.connect(master);                             // 音樂直接進主輸出，不被壓
    master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*1.2,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }catch(e){ initFailed=String(e&&e.message||e); ac=null; }
  }
  // 音訊出任何問題都只能讓遊戲「沒聲音」，絕對不能讓操作失效
  function unlock(){ try{ init(); if(ac&&ac.state==='suspended') ac.resume(); }catch(e){ initFailed=String(e&&e.message||e); } }
  function ok(key,gap){
    if(!ac||muted)return false;
    if(gap){ const n=ac.currentTime; if(last[key]&&n-last[key]<gap)return false; last[key]=n; }
    return true;
  }
  // 一顆振盪器 + 可選濾波 + 可選聲相
  function osc(o){
    const t=ac.currentTime+(o.delay||0), dest=o.dest||sfxBus;
    const g=ac.createGain(), s=ac.createOscillator();
    s.type=o.type||'sine';
    s.frequency.setValueAtTime(o.f0,t);
    if(o.f1) (o.lin?s.frequency.linearRampToValueAtTime:s.frequency.exponentialRampToValueAtTime)
             .call(s.frequency,Math.max(1,o.f1),t+o.dur);
    if(o.detune) s.detune.setValueAtTime(o.detune,t);
    const atk=o.atk!==undefined?o.atk:0.005;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(o.vol,t+atk);
    g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
    let node=s;
    if(o.filter){
      const f=ac.createBiquadFilter(); f.type=o.filter;

      const p=ac.createStereoPanner(); p.pan.value=Math.max(-1,Math.min(1,o.pan));

  // 一段噪音 + 帶通/低通掃頻
  function nz(o){
    const t=ac.currentTime+(o.delay||0), dest=o.dest||sfxBus;
    const s=ac.createBufferSource(); s.buffer=noiseBuf;
    s.playbackRate.value=o.rate||1;
    const f=ac.createBiquadFilter(); f.type=o.filter||'bandpass';
    f.frequency.setValueAtTime(o.f0||1200,t);
    if(o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(60,o.f1),t+o.dur);

  //---------------- 背景音樂：走 lookahead 排程，不用 setTimeout 對拍 ----------------
  // v0.9.8：改成兩套完全不同的主題（不是同一旋律變快變亮而已），
  // 由 musicIntensity() 切換——平常是「可愛版」，遇到 Boss 立刻換成「緊張版」。
  const NOTE=n=>440*Math.pow(2,(n-69)/12);     // MIDI → Hz
  // 可愛主題：C大調亮色俏皮進行：C - G - Am - F（每小節一個和弦）
  const PROG_CUTE=[
    {root:36, tones:[60,64,67,72]},   // C
    {root:31, tones:[59,62,67,71]},   // G
    {root:33, tones:[57,60,64,69]},   // Am
    {root:29, tones:[57,60,65,69]}    // F

  // 跟可愛主題完全不共用和弦，聽感上是「換了一首歌」而不是同一首歌加速
  const PROG_BOSS=[
    {root:33, tones:[57,60,64,69]},   // Am（i）
    {root:40, tones:[64,68,71,76]},   // E （V，大三度導音，緊張感的來源）
    {root:33, tones:[57,60,64,69]},   // Am（i）
    {root:38, tones:[62,65,69,74]}    // Dm（iv）

  const ARP=[0,1,2,3,2,1,3,2,0,1,2,3,1,2,3,1];   // 每小節 16 個十六分音符的和弦音索引
  const M={on:false,step:0,next:0,timer:null,bpm:112,intensity:0,theme:'cute'};
  function stepDur(){ return 60/M.bpm/4; }
  function playStep(i,t){
    const boss=M.theme==='boss';
    const PROG = boss?PROG_BOSS:PROG_CUTE;
    const bar=Math.floor(i/16)%4, k=i%16, ch=PROG[bar];
    const dt0=t-ac.currentTime;

    if(boss){

      if(k%4===0)
        osc({f0:NOTE(ch.root),f1:NOTE(ch.root)*0.985,dur:0.20,vol:0.24,type:'sawtooth',
             filter:'lowpass',ff0:1100,ff1:260,delay:dt0,dest:musBus});
      // 琶音：鋸齒波、更快更硬，每兩拍疊一次高八度製造衝突感
      const nt=ch.tones[ARP[k]] + (k%8===0?12:0);
      osc({f0:NOTE(nt),dur:0.13,vol:0.085,type:'sawtooth',
           filter:'lowpass',ff0:3200,ff1:900,q:5,
           pan:(k%4-1.5)*0.24,delay:dt0,dest:musBus});
      // 鼓組：每拍都有大鼓（比可愛版密集兩倍）、2/4拍小鼓、高帽更密
      if(k%4===0) osc({f0:140,f1:38,dur:0.15,vol:0.30,type:'sine',delay:dt0,dest:musBus});
      if(k===4||k===12) nz({dur:0.12,vol:0.16,f0:2400,f1:1000,q:1.0,delay:dt0,dest:musBus});
      if(k%2===1) nz({dur:0.03,vol:0.06,f0:9000,q:2,pan:k%4===1?-0.3:0.3,delay:dt0,dest:musBus});

    if(k===0||k===8)

           delay:dt0,dest:musBus});

    if(k===0)
      osc({f0:NOTE(ch.tones[0]-12),dur:1.9,vol:0.045,type:'sawtooth',atk:0.25,
           filter:'lowpass',ff0:520,ff1:260,delay:dt0,dest:musBus});

    if(k===4||k===12) nz({dur:0.11,vol:0.10,f0:2100,f1:900,q:1.1,delay:dt0,dest:musBus});
    if(k%2===1) nz({dur:0.035,vol:0.038,f0:8200,q:2,pan:k%4===1?-0.3:0.3,delay:dt0,dest:musBus});

// 用 Page Visibility API：分頁/App 一旦不可見就 suspend AudioContext，回來再恢復。
// 不用 pause 個別音效——AudioContext.suspend() 直接讓整個音訊時鐘停住，
// 已經排定但還沒播完的音樂/音效會全部立刻靜音，這是唯一做得到「立即停止」的方法。
function onVisChange(){ if(document.hidden) SFX.suspend(); else SFX.unlock(); }
document.addEventListener('visibilitychange',onVisChange);
addEventListener('pagehide',()=>SFX.suspend());   // iOS Safari 有時只觸發這個、不觸發 visibilitychange
addEventListener('pageshow',onVisChange);
// v0.9.10：首頁音樂。瀏覽器規定 AudioContext 一定要有使用者手勢才能真的發聲，
// 頁面剛載入時沒辦法自動播放，所以在第一次觸控/點擊時（跟 SFX.unlock() 同一時機）
// 順便啟動；如果玩家還在選單畫面就一直點，也不會每次都重新起音樂（isMusicOn 擋掉）。
function ensureMenuMusic(){
  if((!G||!G.running) && menuEl && !menuEl.classList.contains('hide') && !SFX.isMusicOn())
    SFX.musicStart();
}
// 選單畫面上的按鈕、銀河路線節點都是獨立的 DOM 元素（蓋在 canvas 上面），
// 點下去不會經過 canvas 的 touchstart/mousedown/pointerdown 監聽器，
// 所以另外在 document 這層攔一次，確保「點任何一個選單按鈕」都能觸發音樂/解鎖。
document.addEventListener('pointerdown',()=>{ SFX.unlock(); ensureMenuMusic(); },{capture:true});
document.addEventListener('touchstart',()=>{ SFX.unlock(); ensureMenuMusic(); },{capture:true,passive:true});

const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
// v0.9.11：點到「射線段」的最短距離，給超級大 Boss 的雷射鎖定攻擊判定命中用。
// (x0,y0)=起點、ang=方向、len=長度上限，(px,py)=要測試的點（通常是玩家座標）。
function raySegDist(x0,y0,ang,len,px,py){
  const dx=Math.cos(ang), dy=Math.sin(ang);
  let t=(px-x0)*dx+(py-y0)*dy;
  t=clamp(t,0,len);
  const cx=x0+dx*t, cy=y0+dy*t;
  return Math.hypot(px-cx,py-cy);
}

//====================== 輸入 ======================
const IN={active:false,id:null,ox:0,oy:0,x:0,y:0,dx:0,dy:0,mag:0,hist:[]};
let BTNPRESS=0, touchSeen=false, lastTouchAt=0;
function inBtn(x,y){ return dist2(x,y,BTN.x,BTN.y) < (BTN.r*1.12)**2; }
function inMute(x,y){ return dist2(x,y,MUTE.x,MUTE.y) < (MUTE.r*1.7)**2; }
function startJoy(id,x,y){
  IN.active=true; IN.id=id; IN.ox=IN.x=x; IN.oy=IN.y=y;
  IN.dx=IN.dy=0; IN.mag=0; IN.hist.length=0;
  IN.hist.push({x,y,t:performance.now()});
}
function endJoy(){ IN.active=false; IN.id=null; IN.mag=0; IN.hist.length=0; }
// 按下加速鍵：往目前移動方向衝刺（沒在移動就用最後一次方向）
function pressBoost(){
  if(!G||!G.running||G.paused) return;
  BTNPRESS=0.16;
  const P=G.P;
  let dx=P.mvx||0, dy=P.mvy||0;
  if(!dx&&!dy){ dx=IN.dx; dy=IN.dy; }
  if(!dx&&!dy){ dx=P.dashDX||1; dy=P.dashDY||0; }
  tryDash(dx,dy);
}
function moveJoy(x,y){
  IN.x=x; IN.y=y;
  const now=performance.now();
  IN.hist.push({x:IN.x,y:IN.y,t:now});
  while(IN.hist.length>2 && now-IN.hist[0].t>110) IN.hist.shift();
  // 虛擬搖桿：以起點為圓心，最大半徑 R
  const R=62; let dx=IN.x-IN.ox, dy=IN.y-IN.oy;
  const d=Math.hypot(dx,dy);
  if(d>R){ // 拖太遠時錨點跟著走，手感更順
    IN.ox+=dx*(1-R/d); IN.oy+=dy*(1-R/d);
    dx=IN.x-IN.ox; dy=IN.y-IN.oy;
  }
  const m=Math.hypot(dx,dy);
  IN.mag=clamp(m/R,0,1);
  if(m>0.001){ IN.dx=dx/m; IN.dy=dy/m; }
  // v0.9.4：移除「甩動自動衝刺」。它是第二個非預期加速來源 ——
  // 轉向轉得快一點就會自己衝出去，玩家無法預測。加速一律只由加速鍵觸發。
}
// 多點觸控。
// 之前的版本靠 Touch.identifier 去比對「哪一根是搖桿」，只要有一個 touchend/touchcancel
// 被瀏覽器吞掉，IN.id 就會卡在一個永遠不會再出現的舊 id，之後所有 touchmove 都比對不到 →
// 手指在動但角色不動。改成每次事件都直接從 e.touches 重新挑一根「不在按鈕上」的手指當搖桿，
// 完全無狀態，漏事件也能自己恢復。
// ⚠ TouchList 一律用索引存取：iOS Safari 與部分 Android WebView 沒有 Symbol.iterator。
// ⚠ v0.9.4 修正「手機上無法移動」的真正成因：
// 舊版規則是「落在按鈕上的手指一律不能當搖桿」。加速鍵在右下角、判定半徑 BTN.r*1.3
// （390px 寬的手機上是 60.8px，但只畫出 46.8px），右手拇指自然放的位置正好在裡面 →
// 拇指停在該區內時搖桿永遠不啟動，mag 恆為 0，拖再多都不會動。
// 已用 CDP 真實觸控重現：區內小幅繞圈 60 次 touchmove，mag 六次取樣全是 0。
// 新規則：優先挑不在按鈕上的手指；如果所有手指都在按鈕上，還是拿第一根來當搖桿。
// 死區徹底消失，而且維持無狀態 —— 不會回到「漏一個 touchend 就永久卡死」的老問題。
function pickJoyTouch(tl){
  if(!tl||!tl.length) return null;
  for(let i=0;i<tl.length;i++){
    const t=tl[i];
    if(inBtn(t.clientX,t.clientY)||inMute(t.clientX,t.clientY)) continue;
    return t;
  }
  return tl[0];                                  // 後援：寧可誤判成搖桿，也不要不能動
}
// allowChanged 只在 touchmove 開啟：touchend 的 changedTouches 裝的是「剛離開的手指」，
// 拿來當後援會讓搖桿永遠放不掉。
function syncJoy(e,allowChanged){
  let t=pickJoyTouch(e.touches);
  if(!t && allowChanged && e.changedTouches && e.changedTouches.length) t=pickJoyTouch(e.changedTouches);
  if(!t){ if(IN.active) endJoy(); return; }
  if(!IN.active) startJoy(t.identifier,t.clientX,t.clientY);
  else moveJoy(t.clientX,t.clientY);
}
// v0.9.4：加速鍵改成「放開才觸發」。
// 按下時只登記候選（id / 起點 / 時間），手指移動超過 TAP_SLOP 或超過 TAP_MS 就作廢。
// 這樣「按住加速鍵那一區當搖桿拖曳」不會誤觸衝刺，真正的點擊才會。
// 候選會自己過期，漏掉任何一個 touchend 最壞情況只是少放一次衝刺，不會卡住操作。
const TAP_SLOP=16, TAP_MS=400;
let btnTap=null;
function tapAlive(){ return btnTap && (performance.now()-btnTap.t)<TAP_MS; }
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  DIAG.touch++;
  const ct=e.changedTouches;                       // 按鈕只看這次新按下的手指
  for(let i=0;i<ct.length;i++){
    const t=ct[i];
    if(inMute(t.clientX,t.clientY)) SFX.toggle();
    else if(inBtn(t.clientX,t.clientY)) btnTap={id:t.identifier,x:t.clientX,y:t.clientY,t:performance.now()};
  }
  syncJoy(e,false);
  touchSeen=true; lastTouchAt=performance.now();
  SFX.unlock(); ensureMenuMusic();                  // 放最後：音訊出事也不能影響操作
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  DIAG.tmove++; lastTouchAt=performance.now();
  if(btnTap){                                      // 拖出去就不算點擊了
    const ct=e.changedTouches;
    for(let i=0;i<ct.length;i++){
      const t=ct[i];
      if(t.identifier===btnTap.id &&
         dist2(t.clientX,t.clientY,btnTap.x,btnTap.y) > TAP_SLOP*TAP_SLOP){ btnTap=null; break; }
    }
  }
  syncJoy(e,true);
},{passive:false});
function onTouchEnd(e){
  if(e.cancelable) e.preventDefault();
  DIAG.tend++;
  if(tapAlive()){
    const ct=e.changedTouches;
    for(let i=0;i<ct.length;i++){
      const t=ct[i];
      if(t.identifier===btnTap.id){
        if(dist2(t.clientX,t.clientY,btnTap.x,btnTap.y) <= TAP_SLOP*TAP_SLOP &&
           inBtn(t.clientX,t.clientY)) pressBoost();
        btnTap=null; break;
      }
    }
  }else btnTap=null;
  syncJoy(e,false);
}
cv.addEventListener('touchend',onTouchEnd,{passive:false});
cv.addEventListener('touchcancel',onTouchEnd,{passive:false});
// 滑鼠（桌機）
cv.addEventListener('mousedown',e=>{
  DIAG.mouse++; SFX.unlock(); ensureMenuMusic();
  if(inMute(e.clientX,e.clientY)) SFX.toggle();
  else if(inBtn(e.clientX,e.clientY)) pressBoost();
  else startJoy(-1,e.clientX,e.clientY);
});
addEventListener('mousemove',e=>{ if(IN.active&&IN.id===-1) moveJoy(e.clientX,e.clientY); });
addEventListener('mouseup',()=>{ if(IN.id===-1) endJoy(); });
// Pointer Events 後援：部分 WebView / 內嵌框架會吞掉 touch 事件
const touchAlive=()=>touchSeen && (performance.now()-lastTouchAt)<2000;
if(window.PointerEvent){
  cv.addEventListener('pointerdown',e=>{ if(touchAlive()||e.pointerType!=='touch')return;
    DIAG.pointer++; SFX.unlock(); ensureMenuMusic();
    if(inMute(e.clientX,e.clientY)) SFX.toggle();
    else if(inBtn(e.clientX,e.clientY)) pressBoost();
    else if(!IN.active) startJoy(e.pointerId,e.clientX,e.clientY); });
  cv.addEventListener('pointermove',e=>{ if(touchAlive()||e.pointerType!=='touch')return;
    DIAG.pmove++; if(IN.active) moveJoy(e.clientX,e.clientY); });
  cv.addEventListener('pointerup',e=>{ if(touchAlive()||e.pointerType!=='touch')return;
    endJoy(); });
}

//====================== 果凍地形（核心差異化）======================
// 敵人死亡留下果凍窪；玩家踩過加速，敵人踩過減速；爆炸可引爆連鎖
const GOO_MAX=64, GOO_LIFE=7.5, GOO_RMAX=54;
function addGoo(x,y,r,hue){
  // 就近合併，避免無限增長
  for(let i=0;i<G.GOO.length;i++){
    const g=G.GOO[i];
    if(dist2(x,y,g.x,g.y) < (g.r*0.8)**2){
      g.r=Math.min(g.r+r*0.22, GOO_RMAX); g.life=Math.max(g.life,GOO_LIFE*.8); return;
    }
  }
  if(G.GOO.length>=GOO_MAX) G.GOO.shift();
  G.GOO.push({x,y,r:Math.min(r,GOO_RMAX),hue,life:GOO_LIFE,max:GOO_LIFE,burn:0,wob:rnd(0,6.28)});
}
function igniteGoo(x,y,rad,depth){
  if(depth>3)return;
  // v0.9.13 修正：跟 damageArea() 同一類問題的邊角案例——這裡呼叫的 damageArea()
  // 打死怪物時經過 killEnemy() 會呼叫 addGoo()，如果 G.GOO 這時候剛好滿了
  // （GOO_MAX=64 顆果凍同時存在），addGoo() 會 shift() 掉最舊的一顆，一樣是
  // 邊迭代邊刪同一個陣列。雖然要「果凍剛好疊到 64 顆」才會踩到，比較少見，
  // 但既然是同一種模式就一起改成倒著跑的索引迴圈，不留這個地雷。
  for(let i=G.GOO.length-1;i>=0;i--){
    const g=G.GOO[i]; if(!g) continue;
    if(g.burn>0) continue;
    if(dist2(x,y,g.x,g.y) < (rad+g.r)**2){
      g.burn=.55;
      damageArea(g.x,g.y,g.r*1.15, 14*G.P.dmgEff, false);
      burst(g.x,g.y,10,g.hue,3);
      setTimeout(()=>{ if(G&&G.running) igniteGoo(g.x,g.y,g.r*1.1,depth+1); },70);
    }
  }
}

// v0.9.5：4 種怪全部改成能發射遠程攻擊（原本只有無人機會）。
// cdMin/cdMax 是「兩次開火間隔」的秒數範圍，數字越大＝打越慢。
// 軟泥（初階怪）刻意設成全遊戲最慢：同一個等級層級（tier）下，
// 軟泥的 cdMin 都比其他三種的 cdMin 大，乘上共用的 atkSlow／tier 倍率後順序不會變。
// kite=true 才會在近距離後退保持距離（目前只有無人機維持原本的風箏打法）；
// 其餘三種維持原本「衝向玩家」的路徑，只是路上會順便打一發。
// rangedFromTier：這隻怪從第幾個 tier 開始會射擊（0=一開始就會）。
// ⚠ 踩過兩次同一種坑，記錄一下：
//  1) 一開始設 tier=1（第3關）：笨bot 直接陣亡掉滿心。第3-4關「上手層」的兔子
//     敘述只提速度，完全沒提子彈 —— 這層是刻意留白的純速度測試。
//  2) 改成 tier=2（第5關）想說對齊無人機原本的登場點，結果 3 次測試全滅（0/5）。
//     問題是第5關本來就是「無人機第一次登場、單獨教你閃子彈」的關卡
//    （docs 原話：「無人機登場：會從遠處射擊，學會用加速鍵的無敵幀穿過子彈」），
//     這次改動讓軟泥+兔子在同一關一起加入開火，等於三種怪同時射擊，
//     直接打穿「一次只教一個新機制」的鋸齒設計原則。
//  現在改成 tier=3（第7關，挑戰層）：這一層原始設計本來就是「不再引入新機制，
//  純粹考驗操作」（第8關敘述：「四種敵人全開，沒有新東西了」），疊加更多遠程
//  壓力跟這層的設計意圖一致，不會踩到中段任何一個刻意留白的教學關卡。
// 軟泥（初階怪）在射擊解鎖後仍是全遊戲最慢的射手（見下方 cdMin 排序）。
const ETYPE={
  slime  :{r:15,hp:11 ,spd:62 ,dmg:8 ,hue:140,xp:1,name:'軟泥',
           ranged:true,rangedFromTier:3,kite:false,cdMin:3.4,cdMax:4.4,shootRange:360},
  bunny  :{r:14,hp:20 ,spd:124,dmg:10,hue:330,xp:2,name:'兔子',
           ranged:true,rangedFromTier:3,kite:false,cdMin:2.4,cdMax:3.2,shootRange:400},
  drone  :{r:15,hp:28 ,spd:78 ,dmg:9 ,hue:195,xp:3,name:'無人機',
           ranged:true,rangedFromTier:0,kite:true, cdMin:1.9,cdMax:3.0,shootRange:520},
  bomber :{r:19,hp:38 ,spd:96 ,dmg:22,hue:30 ,xp:4,name:'自爆',boom:true,
           ranged:true,rangedFromTier:0,kite:false,cdMin:2.6,cdMax:3.6,shootRange:340}
};
// 怪物等級（tier）：對應現有 5 個難度層級（新手/上手/熟練/挑戰/地獄，每層 2 關）。
// 血量/攻速隨 tier 提高；移速也會提高，但在 spawnEnemy 裡硬性夾在「主角速度 60%」以內。
const TIER_HP =[1.00,1.18,1.38,1.62,1.90];
const TIER_SPD=[1.00,1.06,1.12,1.18,1.24];
const TIER_CD =[1.00,0.90,0.82,0.75,0.68];   // 越小＝攻速越快
function enemyTier(){ return Math.min(4, Math.floor((G.lvIdx||0)/2)); }
function spawnEnemy(type,mult){
  const T=ETYPE[type];
  const a=rnd(0,6.283), d=rnd(330,430);
  const P=G.P;
  const tier=enemyTier();
  const hpT=TIER_HP[tier], spT=TIER_SPD[tier], cdT=TIER_CD[tier];
  const rawSpd=T.spd*rnd(.9,1.12)*CUR().espd*spT;
  const spd=Math.min(rawSpd, P.spd*0.6);      // 移速上限：主角速度的 60%
  const cdMin=T.cdMin*cdT, cdMax=T.cdMax*cdT;
  const ranged = !!T.ranged && tier>=(T.rangedFromTier||0);
  G.E.push({x:P.x+Math.cos(a)*d, y:P.y+Math.sin(a)*d, vx:0,vy:0,
    r:T.r, hp:T.hp*mult*hpT, maxhp:T.hp*mult*hpT, spd,
    dmg:T.dmg, hue:T.hue, xp:T.xp, type, flash:0, kb:0,kbx:0,kby:0,
    shootCD:rnd(cdMin,cdMax), wob:rnd(0,6.28), boom:!!T.boom,
    ranged, kite:!!T.kite, cdMin, cdMax, shootRange:T.shootRange,
    tier, boss:false});
}
function spawnBoss(cfg){

// 目標選擇：Boss 的「有效距離」打 0.4 折，所以只要 Boss 在合理範圍內就優先集火，
// 但貼臉的雜兵仍然會被打掉。原規格的「最近優先」在 Boss 戰會讓輸出全部餵給雜兵。
// 攻擊距離限制：只能鎖定畫面上實際看得到的敵人（用攝影機座標換算螢幕座標），
// maxd 仍保留當作距離上限的安全閥（例如超寬螢幕時不要打到太遠）。
function onScreen(x,y,margin){
  margin=margin||0;
  const sx=x-G.cam.x+W/2, sy=y-G.cam.y+H/2;
  return sx>-margin && sx<W+margin && sy>-margin && sy<H+margin;
}
function nearest(x,y,maxd){
  let best=null,bd=maxd*maxd;
  const SCREEN_MARGIN=44;              // 讓貼在邊緣、還露出一部分的敵人也能被鎖定，不要卡在像素邊界
  for(const e of G.E){
    if(!onScreen(e.x,e.y,SCREEN_MARGIN)) continue;
    let d=dist2(x,y,e.x,e.y);
    if(e.boss) d*=0.16;                 // 距離平方 → 0.4² = 0.16
    if(d<bd){bd=d;best=e;}
  }
  return best;
}
function shoot(x,y,a,sp,dmg,r,hue,o){
  o=o||{};
  G.B.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dmg,r,hue,
    life:o.life||1.25, pierce:o.pierce||0, goo:!!o.goo, hit:new Set(),
    boomerang:!!o.boomerang, age:0, ox:x, oy:y});
}
// 敵彈一律紅色菱形，不隨敵人變色 —— 顏色與形狀都要能單獨辨識出「這會傷到我」
function shootE(x,y,a,sp,dmg,r){
  G.EB.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dmg,r,life:4.2,rot:a,spin:rnd(3,6)});
}

function burst(x,y,n,hue,spd){
  spd=spd||1;
  for(let i=0;i<n;i++){
    const a=rnd(0,6.283), s=rnd(60,290)*spd;
    G.PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(2,6.5),
      hue:hue+rnd(-22,22),life:rnd(.25,.7),max:.7});
  }
  if(G.PT.length>340) G.PT.splice(0,G.PT.length-340);   // 400+ 粒子肉眼分辨不出來，但吃掉不少軟體渲染時間
}
function toast(txt,color){ G.TXT.push({txt,color:color||'#fff',t:0,life:1.5,big:true}); }
function pop(x,y,txt,color,sz){
  G.TXT.push({x,y,txt,color:color||'#fff',t:0,life:.65,vy:-56,sz:sz||16});
}
// 舊版是每一幀重新取隨機位移 → 高頻抖動，長時間看很傷眼。
// 改成：一次衝擊給一個固定方向 + 阻尼正弦，讀起來是「撞了一下」而不是「畫面在震」。
// v0.9.8：拿掉「畫面晃動：關/低/標準」的使用者選項（使用者要求），固定用原本
// 「低」的強度當統一基準，維持舒適一致。但 Boss 在場時額外加成，加強戰鬥的刺激感。
const SHAKE=0.5;                     // 固定值，不再讓玩家調整
function shake(v,ang){
  if(SHAKE<=0){ G.cam.shake=0; return; }
  const c=G.cam;
  const bossMul = (G.boss ? 1.4 : 1);      // Boss 戰時晃動加強 40%
  const amp=v*SHAKE*0.55*bossMul;
  if(amp<=c.shake*0.6) return;       // 已經在震且更強時不打斷，避免疊加成亂流
  c.shake=Math.min(c.shake+amp, (9*SHAKE+1)*bossMul);
  c.shAng= ang!==undefined?ang:rnd(0,6.283);
  c.shPhase=0;
}
function hitstop(v){ G.hitstop=Math.max(G.hitstop,v); }

// v0.9.13 修正：原本用 for(const e of G.E)，但 hurtEnemy() 打死怪物時會呼叫
// killEnemy() 對 G.E 做 splice()，邊迭代邊刪除同一個陣列會讓「剛好排在被刪除
// 那格後面」的敵人整個被跳過（陣列往前遞補一格，for...of 的內部游標會直接
// 錯過它）。實測過：10 隻怪疊在一起，一次 AoE 打過去，只有 5 隻真的受傷/死亡，
// 另外 5 隻完全沒事——影響到自爆怪的爆炸、進化版泡泡槍的果凍暴雨、連鎖引爆。
// 改成從陣列尾端往前跑的索引迴圈：splice 只會影響「更前面」的索引，不會讓
// 迴圈游標跳過任何一個還沒檢查的元素。
function damageArea(x,y,r,dmg,doKb){
  for(let i=G.E.length-1;i>=0;i--){
    const e=G.E[i]; if(!e) continue;
    if(dist2(x,y,e.x,e.y)<(r+e.r)**2){
      hurtEnemy(e,dmg);
      if(doKb){ const a=Math.atan2(e.y-y,e.x-x); e.kb=.18; e.kbx=Math.cos(a)*380; e.kby=Math.sin(a)*380; }
    }
  }
}
function hurtEnemy(e,dmg,fromBullet){
  const P=G.P;
  const crit=Math.random()<P.crit;
  const d=crit?dmg*2:dmg;
  e.hp-=d; e.flash=.09;
  if(fromBullet&&P.sticky){                    // 黏性糖漿
    e.slowT=Math.max(e.slowT||0, P.sticky>=2?3.5:2.0);
    if(P.sticky>=2){                            // 二階：傳染給旁邊的敵人
      for(const o of G.E) if(o!==e&&!o.boss&&dist2(o.x,o.y,e.x,e.y)<70*70)
        o.slowT=Math.max(o.slowT||0,2.0);
    }
  }
  const pan=clamp((e.x-P.x)/420,-1,1);
  if(crit){ pop(e.x,e.y-e.r,Math.round(d),'#ffd84f',20); hitstop(.045); SFX.crit(pan); }
  else SFX.hit(pan);
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  const i=G.E.indexOf(e); if(i<0)return;
  const P=G.P;
  G.E.splice(i,1); G.kills++;
  burst(e.x,e.y,e.boss?60:9,e.hue,e.boss?2.4:1);
  addGoo(e.x,e.y,e.boss?70:e.r*1.5,e.hue);
  const gxp=(e.boss?4:e.xp)+(P.greed|0);
  for(let k=0;k<(e.boss?18:1);k++)
    G.GEM.push({x:e.x+rnd(-14,14),y:e.y+rnd(-14,14),vx:rnd(-70,70),vy:rnd(-70,70),
                xp:gxp,hue:e.hue,r:5,wob:rnd(0,6.28)});
  if(!e.boss){
    if(P.chain && Math.random()<(P.chain>=2?0.6:0.3))    // 連鎖引爆
      igniteGoo(e.x,e.y,P.chain>=2?58:40,0);
    if(P.split && Math.random()<(P.split>=2?0.5:0.25)){  // 分裂軟糖
      const n=P.split>=2?5:3;
      for(let k=0;k<n;k++)
        shoot(e.x,e.y,k*6.283/n+rnd(0,1),380,10*P.dmgEff,5,300,{life:.5});
    }
    if(P.frenzy){                                        // 暴走糖
      P.frenzyKills++;
      const need=P.frenzy>=2?15:25;
      if(P.frenzyKills>=need){ P.frenzyKills=0;
        P.frenzyT=P.frenzy>=2?5:4; toast('暴走糖！攻速翻倍','#ff9ad5'); SFX.evo(); }
    }
  }
  if(e.boom){ igniteGoo(e.x,e.y,72,0); damageArea(e.x,e.y,78,26*P.dmgEff,true); shake(4); }
  SFX.kill(clamp((e.x-P.x)/420,-1,1));
  if(e.boss){
    shake(12); hitstop(.3); SFX.bossDie();
    if(!G.E.some(o=>o.boss&&o!==e)) SFX.musicIntensity(0);
    if(G.boss===e) G.boss=G.E.find(o=>o.boss)||null;   // 仍有其他 Boss 就接手血條
    if(e.kind==='final'){ G.win=true; endGame(true); }
    else{                                   // 中期 Boss：補一顆愛心 + 直接送一張卡（節奏喘息點）
      if(G.P.hearts<G.P.maxHearts) G.P.hearts++;
      toast('黃金超載寶箱！回復一顆愛心','#ffd84f');
      // v0.9.13：改走跟 gainXP() 一樣的 pendingCards 佇列，而不是直接呼叫
      // showCards()——如果這時候玩家剛好也因為撿晶核同時跨等級、已經有卡片
      // 視窗開著，直接呼叫會把正在選的那組蓋掉，害玩家漏選一張。排進佇列
      // 就不會互相蓋掉，最多就是「多欠一張」，選完前面的自然會接著跳出來。
      setTimeout(()=>{
        if(!G||!G.running) return;
        G.pendingCards=(G.pendingCards||0)+1;
        if(cardsEl.classList.contains('hide')) showCards();
      },420);
    }
  }
}

function tryDash(dx,dy){
  const P=G.P;
  if(P.dashCD>0||P.dashT>0||!G.running||G.paused) return;
  const m=Math.hypot(dx,dy)||1;
  P.dashDX=dx/m; P.dashDY=dy/m;
  P.dashT=.32; P.iframe=.42; P.dashCD=P.dashCDmax;
  burst(P.x,P.y,16,180,1.4); SFX.dash();
  IN.hist.length=0;
}

// 三心制：任何一次受擊都是扣一顆，靠慈悲無敵時間與衝刺來閃，而不是靠血厚
function hurtPlayer(){
  const P=G.P;
  if(P.iframe>0||!G.running) return false;
  if(P.shieldN>0){                              // 甜甜圈護盾先擋
    P.shieldN--; P.iframe=0.9; P.flash=.25; G.hurt=.55;
    shake(4); burst(P.x,P.y,18,195,1.3);
    pop(P.x,P.y-30,'護盾擋下！','#8fd8ff',18); SFX.dash();
    return false;
  }
  P.hearts--; P.iframe=P.panic?2.1:1.45; P.flash=.3; G.hurt=1;
  if(P.panic) P.panicT=3.0;
  shake(8); hitstop(.07); SFX.hurt();
  burst(P.x,P.y,20,350,1.5);
  pop(P.x,P.y-30,'-♥','#ff5b7f',24);
  if(P.hearts<=0){ P.hearts=0; endGame(false); return true; }
  return false;
}

function rollCards(){
  const P=G.P, pool=[];
  for(const u of UPGRADES){
    if(u.w){
      const lv=P.wep[u.w];
      // 3 分鐘的局長度下，Lv.5 才能進化太慢 → Lv.4 就開放進化卡
      if(lv>=4 && !P.evo[u.w])
        pool.push({...u,evo:true,ic:EVOS[u.w].ic,n:EVOS[u.w].name,d:EVOS[u.w].desc});
      if(lv<5) pool.push({...u, lvl:lv});
    }else{
      const st=P[u.id]|0;                       // 目前層數
      if(st>=(u.max||1)) continue;              // 疊滿就不再出現
      pool.push({...u, stack:st, d: st>0&&u.d2 ? u.d2 : u.d});
    }
  }
  const out=[]; const cp=pool.slice();
  while(out.length<3&&cp.length){ out.push(cp.splice(Math.floor(Math.random()*cp.length),1)[0]); }
  return out;
}
const cardsEl=document.getElementById('cards');
function showCards(){
  G.paused=true;   // btnPause/btnNuke 的顯示都跟著 G.paused 走（見 drawHUD()），這裡不用另外管
  const list=rollCards();
  cardsEl.innerHTML='<div class="lvtitle">LV.'+G.P.lv+' 升級！選一張</div>';
  for(const u of list){
    const el=document.createElement('div');
    el.className='card'+(u.evo?' evo':'');
    const lvTag = u.w ? (u.evo?'<div class="lv">超載進化</div>'
                        :'<div class="lv">'+(G.P.wep[u.w]===0?'新武器':'Lv.'+(G.P.wep[u.w]+1))+'</div>')
                      : (u.stack>0?'<div class="lv">強化</div>':'');
    el.innerHTML='<div class="ic">'+u.ic+'</div><div class="nm">'+u.n+'</div>'+lvTag+
                 '<div class="ds">'+u.d+'</div>';
    el.onclick=()=>applyCard(u);
    cardsEl.appendChild(el);
  }
  cardsEl.classList.remove('hide');
}
// v0.9.13 修正：原本選完一張卡就直接 G.paused=false 恢復遊戲，但 gainXP() 一次
// 跨好幾級的時候（例如一口氣撿到很多晶核、或磁力吸過來一堆），會在同一幀內連續
// 呼叫好幾次 showCards()，後面呼叫的每次都會整個蓋掉前一次的卡片內容——實測過：
// gainXP(500) 從 Lv.1 衝到 Lv.10（跨9級），showCards() 真的被呼叫了9次，但畫面
// 上永遠只看得到最後一次、只能選1張卡，前面8次的升級選擇整個消失，玩家完全
// 沒感覺到自己其實錯過了8張卡。改成用 G.pendingCards 記錄「還欠幾張卡」，選完
// 一張之後如果還有欠，馬上接著跳下一組選項，直到選滿為止才真的恢復遊戲。
function applyCard(u){
  const P=G.P;
  if(u.evo){ P.evo[u.w]=true; toast(u.n+'！','#ffd84f'); SFX.evo(); }
  else if(u.w){ P.wep[u.w]=Math.min(5,P.wep[u.w]+1); SFX.level(); }
  else { u.f(P); SFX.level(); }
  if(G.pendingCards>0) G.pendingCards--;
  if(G.pendingCards>0) showCards();               // 還欠卡：直接接著跳下一組，不恢復遊戲
  else { cardsEl.classList.add('hide'); G.paused=false; }
}
function gainXP(n){
  const P=G.P; P.xp+=n;
  let leveled=false;
  while(P.xp>=P.xpNext){
    P.xp-=P.xpNext; P.lv++;
    P.xpNext=Math.round(6+P.lv*5.5+P.lv*P.lv*0.5);   // 放慢升級速度（原本 3 分鐘會衝到 Lv.20+）
    G.pendingCards=(G.pendingCards||0)+1;
    leveled=true;
  }
  // gainXP() 常常在同一幀被連續呼叫很多次（一顆晶核一次），所以不能在 while 迴圈
  // 裡面就直接開卡片視窗——只有「目前沒有卡片視窗開著」時才觸發一次，實際要選
  // 幾張卡完全交給 G.pendingCards／applyCard() 那條鏈路自己跑完。
  if(leveled && cardsEl.classList.contains('hide')) showCards();
}

// 依關卡縮放出波次表：時間軸按關卡長度壓縮，敵種只留該關解鎖的
function buildWaves(L){
  const k=L.dur/180;
  return WAVES.map(w=>{
    const mix={}; let sum=0;
    for(const t in w.mix) if(L.types.includes(t)){ mix[t]=w.mix[t]; sum+=w.mix[t]; }
    if(sum<=0){ mix[L.types[0]]=1; sum=1; }
    for(const t in mix) mix[t]/=sum;
    // 敵種少的關卡，後段容易變成清一色某一種怪 → 保留一定比例的軟泥當底
    if(L.types.length<=2 && L.types.includes('slime')){
      for(const t in mix) mix[t]*=0.7;
      mix.slime=(mix.slime||0)+0.3;
    }
    return {t:Math.round(w.t*k), mix, rate:w.rate*L.rate, mult:w.mult*L.hp};
  });
}

function buildBosses(L){
  const at = L.nboss===1?[0.62] : L.nboss===2?[0.40,0.80] : [0.22,0.53,0.84];
  const bosses = at.map((f,i)=>{
    const b=BOSS_POOL[L.nboss===1?0:i];
    return {...b,
      t: Math.round(L.dur*f),
      hp: Math.round(b.hp*L.bossHp),
      spd: b.spd*L.espd,
      bspd: b.bspd*L.bspd,
      atkT: b.atkT*L.atkSlow,
      kind: (!L.superBoss && i===at.length-1) ? 'final' : ('b'+(i+1))
    };
  });
  if(L.superBoss){
    const b=BOSS_CHAPTER[L.bossChapter||0];
    bosses.push({...b,
      t: Math.round(L.dur*0.93),
      hp: Math.round(b.hp*L.bossHp*1.6),
      spd: b.spd*L.espd,
      bspd: b.bspd*L.bspd,
      atkT: b.atkT*L.atkSlow,
      kind:'final', superBoss:true
    });
  }
  return bosses;
}

// ── v0.9.14：第 11~100 關產生器 ─────────────────────────────────────────
// 前 10 關（第 1 章）維持手動調校、跑過大量笨bot測試的數值不動。第 2~10 章
// （第 11~100 關，共 90 關）改用公式生成：90 關全部手打數字風險太高（容易
// 手滑打錯、難度曲線不連續），改成以「第10關」的數值當基準往上疊倍率。
// 章節內採用跟原本 10 關版一樣的鋸齒節奏：章節開頭比上一章頂點回落 7%，
// 章節內線性爬升到章節末（第10/20/.../100關）的大 Boss 關，粒度從
// docs/02 原設計的「2關一層」放大成「10關一章」，精神不變。
// espd（敵人移動速度）跟 bspd（子彈速度）刻意設上限：速度只要能閃、後面
// 再快也只是變成「看不到、躲不掉」，不是有意義的難度；真正的難度加壓
// 交給 hp／bossHp（打更久、Boss 更肉）跟 rate／dur（出怪更密、關卡更長）、
// atkSlow（Boss攻擊冷卻更短）。
(function genExtraLevels(){
  const CH_NAMES=['深淵','噩夢','煉獄','虛無','修羅','冥界','天啟','神魔','終焉'];
  const base=LEVELS[9];              // 第10關（chapter 0 頂點）當基準
  const peakMul=c=>1+c*0.30+c*c*0.028; // 章節 c 結尾（大Boss關）的倍率頂點
  for(let c=1;c<=9;c++){
    const pk=peakMul(c), st=peakMul(c-1)*0.93;   // st：本章開頭＝上一章頂點回落7%
    const bossName=BOSS_CHAPTER[c].name;
    for(let p=0;p<10;p++){
      const lvlNum=c*10+p+1;         // 第幾關（1-based）
      const f=p/9;                   // 章節內進度 0~1，線性內插 st→pk
      const mul=st+(pk-st)*f;
      const isBoss=p===9, isOpener=p===0;
      LEVELS.push({
        tier: CH_NAMES[c-1],
        n: isBoss ? (CH_NAMES[c-1]+'首領：'+bossName) : (CH_NAMES[c-1]+' 第'+(p+1)+'關'),
        dur: Math.min(323, Math.round(215+Math.log2(lvlNum/10)*42)),
        hearts:3,
        rate: Math.min(6.0, +(base.rate*mul).toFixed(3)),
        hp: +(base.hp*mul).toFixed(3),
        espd: Math.min(1.85, +(base.espd*mul).toFixed(3)),
        bossHp: +(base.bossHp*mul).toFixed(3),
        nboss: 3,
        types: ['slime','bunny','drone','bomber'],
        bspd: Math.min(2.3, +(base.bspd*mul).toFixed(3)),
        atkSlow: Math.max(0.35, +(base.atkSlow/mul).toFixed(3)),
        chest: Math.min(32, 17+Math.floor((lvlNum-10)/3)),
        maxE: Math.min(260, 130+Math.floor((lvlNum-10)*1.45)),
        d: isBoss ? ('★ 第'+(c+1)+'章壓軸：超級大 Boss「'+bossName+'」坐鎮，血量與強度全面超越前一章。')
           : isOpener ? ('進入「'+CH_NAMES[c-1]+'」章節，難度較上一章末暫時回落，準備重新爬升。')
           : ('「'+CH_NAMES[c-1]+'」章節持續加壓，敵人血量與出怪密度持續上修。'),
        superBoss: isBoss,
        ...(isBoss?{bossChapter:c}:{})
      });
    }
  }
})();

function updateSpawn(dt){
  const L=CUR();
  let w=G.waves[0];
  for(const x of G.waves) if(G.t>=x.t) w=x;
  // Boss 出場預告：出場前 5 秒開始閃紅倒數。每幀重算、不存狀態，
  // 跟搖桿判定一樣的無狀態哲學——漏一幀不會卡死，下一幀自己就對了。
  const prevWarnT=G.bossWarnT;
  G.bossWarnT=-1; G.bossWarnName='';
  for(let i=0;i<G.bosses.length;i++){
    if(G.bossDone[i]) continue;
    const rem=G.bosses[i].t-G.t;
    if(rem>0 && rem<=5){ G.bossWarnT=rem; G.bossWarnName=G.bosses[i].name; break; }
  }
  // v0.9.12：畫面上原本就有「⚠ BOSS即將出現」的倒數數字，但完全沒有配聲音。
  // 倒數視窗剛開始的那一幀響一聲警報，之後倒數數字每跳一次整數秒（5,4,3,2,1）
  // 補一聲短「嗶」，讓玩家不用一直盯著畫面看數字也能感覺到「快來了」。
  // bossWarnT 本身是無狀態、每幀重算的（見上），所以判斷「剛進入警示視窗」
  // 只能用「上一幀 vs 這一幀」的邊界比對，不能存一個「有沒有響過」的旗標，
  // 否則同一隻 Boss 的警示視窗結束後，旗標忘記重置的話下次就永遠不會再響。
  if(G.bossWarnT>=0 && prevWarnT<0){ SFX.bossWarn(); G._bwSec=Math.ceil(G.bossWarnT); }
  else if(G.bossWarnT>=0){
    const sec=Math.ceil(G.bossWarnT);
    if(sec<G._bwSec){ G._bwSec=sec; SFX.bossWarnTick(); }
  }
  for(let i=0;i<G.bosses.length;i++)
    if(!G.bossDone[i] && G.t>=G.bosses[i].t){ G.bossDone[i]=true; spawnBoss(G.bosses[i]); }
  const rate = G.boss ? w.rate*0.35 : w.rate;
  G.spawnAcc+=dt*rate;
  while(G.spawnAcc>=1){
    G.spawnAcc-=1;
    if(G.E.length>L.maxE) break;
    const r=Math.random(); let acc=0,t='slime';
    for(const k in w.mix){ acc+=w.mix[k]; if(r<=acc){t=k;break;} }
    spawnEnemy(t,w.mult);
  }
}
