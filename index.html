<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>GOO BLASTER</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0618">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GOO BLASTER">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
     user-select:none;-webkit-user-select:none;touch-action:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0618;
     font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
     touch-action:pan-y;}   /* v0.9.8：見下方 #galaxyWrap 註解 */
  #wrap{position:fixed;inset:0;touch-action:pan-y;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .ui{position:absolute;inset:0;pointer-events:none;touch-action:pan-y;}
  .panel{position:absolute;inset:0;display:flex;flex-direction:column;
     align-items:center;justify-content:center;gap:14px;pointer-events:auto;touch-action:pan-y;
     background:rgba(10,6,24,.86);backdrop-filter:blur(8px);padding:22px;text-align:center;}
  /* 過關時不要遮住花火：背景半透明、不模糊，並淡入 */
  .panel.win{background:linear-gradient(180deg,rgba(10,6,24,.12) 0%,rgba(10,6,24,.62) 38%,
                                        rgba(10,6,24,.72) 100%);backdrop-filter:none;
             animation:fadein .8s ease both;}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .hide{display:none!important;}
  h1{font-size:clamp(34px,11vw,64px);font-weight:900;letter-spacing:-2px;line-height:.92;
     background:linear-gradient(95deg,#ff4fd8,#ffd84f 45%,#4ff0ff);-webkit-background-clip:text;
     background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4));}
  .sub{color:#9d92c4;font-size:13px;max-width:330px;line-height:1.65;}
  .btn{pointer-events:auto;border:0;border-radius:16px;padding:15px 34px;font-size:17px;
     font-weight:800;color:#150a26;cursor:pointer;font-family:inherit;
     background:linear-gradient(180deg,#7ef7c0,#2fd39a);
     box-shadow:0 5px 0 #128f68, 0 10px 22px rgba(47,211,154,.35);transition:transform .06s;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #128f68;}
  .btn.alt{background:linear-gradient(180deg,#b79dff,#8257ff);color:#fff;
     box-shadow:0 5px 0 #5a34c4, 0 10px 22px rgba(130,87,255,.35);}
  .btn.alt:active{box-shadow:0 2px 0 #5a34c4;}
  .btn.small{padding:9px 20px;font-size:13px;background:linear-gradient(180deg,#4b3c78,#33265a);
     color:#e4dcff;box-shadow:0 4px 0 #241a44;}
  .btn.small:active{box-shadow:0 1px 0 #241a44;}
  .btn.danger{background:linear-gradient(180deg,#ff8fa8,#ff4f74);color:#fff;
     box-shadow:0 4px 0 #b3243f;}
  .btn.danger:active{box-shadow:0 1px 0 #b3243f;}
  /* v0.9.9：通用彈窗樣式（先給「從第1關重來」二次確認用，v0.9.10 暫停畫面也共用這組） */
  .overlayBox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
     padding:22px;pointer-events:auto;background:rgba(8,4,20,.6);backdrop-filter:blur(3px);z-index:5;}
  .overlayBox .box{max-width:290px;background:linear-gradient(170deg,#241547,#150c2e);
     border:2px solid #3d2a6e;border-radius:20px;padding:24px 20px 20px;text-align:center;
     box-shadow:0 8px 0 rgba(0,0,0,.35);}
  .overlayBox .ic{font-size:34px;line-height:1;margin-bottom:6px;}
  .overlayBox .msg{font-size:15px;font-weight:800;color:#fff;margin-bottom:6px;}
  .overlayBox .sub2{font-size:12px;color:#a99ad0;line-height:1.6;margin-bottom:16px;}
  /* 遊戲中的暫停鍵，疊在 canvas 右上角、靜音鍵正上方。
     v0.9.12：原本是「深色底+一圈細灰線」，使用者反應看起來不可愛，
     改成跟其餘按鈕同一套「糖果色漸層 + 立體投影」語言（跟 .btn.alt 同色系），
     圓形描白邊、按下去有 Q 彈的位移感，不再是一顆孤零零的灰框圈。 */
  #btnPause{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;
     width:38px;height:38px;border-radius:50%;pointer-events:auto;cursor:pointer;
     background:linear-gradient(180deg,#c9b3ff,#8257ff);
     border:2.5px solid #fff3ff;color:#fff;font-size:15px;
     display:flex;align-items:center;justify-content:center;
     font-family:inherit;padding:0;z-index:4;
     box-shadow:0 3px 0 #5a34c4,0 5px 12px rgba(130,87,255,.45);
     transition:transform .07s;}
  #btnPause:active{transform:translateY(2px) scale(.94);box-shadow:0 1px 0 #5a34c4;}
  /* v0.9.10：核彈按鈕，疊在左下角、加速鍵正上方；用發光+脈動強調「這是稀有道具」 */
  #btnNuke{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 122px);
     width:52px;height:52px;border-radius:50%;pointer-events:auto;cursor:pointer;
     background:radial-gradient(circle at 35% 30%,#fff6b0,#ffb23f 55%,#ff5b3f);
     border:2.5px solid #fff3c4;color:#3a1600;font-size:24px;
     display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0;
     box-shadow:0 0 0 4px rgba(255,150,50,.25),0 4px 14px rgba(255,120,30,.55);
     animation:nukePulse 1.4s ease-in-out infinite;z-index:4;}
  #btnNuke:active{transform:scale(.9);}
  @keyframes nukePulse{0%,100%{box-shadow:0 0 0 4px rgba(255,150,50,.25),0 4px 14px rgba(255,120,30,.55);}
     50%{box-shadow:0 0 0 9px rgba(255,150,50,.12),0 4px 22px rgba(255,120,30,.75);}}
  /* 銀河挑戰路線：關卡選擇畫面（v0.9.5 取代原本的一排小圓點） */
  #galaxyWrap{position:relative;width:100%;max-width:330px;height:230px;
     overflow-y:auto;overflow-x:hidden;border-radius:16px;border:2px solid #402c78;
     background:radial-gradient(ellipse at 50% 0%,#2a1a52 0%,#160c30 55%,#0a0618 100%);
     -webkit-overflow-scrolling:touch;
     touch-action:pan-y;}
  /* v0.9.8：瀏覽器判斷「這根手指能不能拿來滑動捲軸」，看的是被摸到的那個元素
     本身、以及它所有祖先的 touch-action 交集——只要鏈上任何一層是 none 就整條斷掉。
     最上層 *{touch-action:none} 把 html/body/#wrap/.ui/.panel 全部鎖死了，
     光改 #galaxyWrap 沒用（手指實際摸到的是它裡面的 #galaxyInner／.gnode 節點，
     這兩層一樣被 * 鎖住）。所以連同 html、body、#wrap、.ui、.panel 都要開放 pan-y，
     這裡再用 #galaxyWrap * 把裡面所有子元素（節點、SVG、星星）一次蓋掉，
     不用每加一個新元素就要記得補一次。canvas 本身維持 none，搖桿拖曳的行為不受影響。*/
  #galaxyWrap *{touch-action:pan-y;}
  /* v0.9.9：捲軸拉把換成糖果配色的圓角版本，跟遊戲整體風格搭。
     只有支援 ::-webkit-scrollbar 的瀏覽器（Android Chrome 等）看得到這個樣式；
     iOS Safari 一律用系統自己的半透明拉把、不接受自訂，這點沒辦法用網頁技術解決。 */
  #galaxyWrap{scrollbar-width:thin;scrollbar-color:#c98bff rgba(255,255,255,.08);}
  #galaxyWrap::-webkit-scrollbar{width:9px;}
  #galaxyWrap::-webkit-scrollbar-track{background:rgba(255,255,255,.06);border-radius:99px;margin:8px 2px;}
  #galaxyWrap::-webkit-scrollbar-thumb{border-radius:99px;border:2px solid transparent;background-clip:padding-box;
     background-image:linear-gradient(180deg,#ff9ad5,#c98bff 55%,#8257ff);}
  #galaxyWrap::-webkit-scrollbar-thumb:hover{background-image:linear-gradient(180deg,#ffb3e0,#d7a4ff 55%,#9a72ff);}
  #galaxyInner{position:relative;width:100%;}
  #galaxyInner svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  #galaxyInner .star{position:absolute;border-radius:50%;background:#fff;opacity:.5;}
  /* v0.9.18：每 5 關一個背景色帶 + 交界處的發光銜接線 */
  #galaxyInner .gband{position:absolute;left:0;right:0;pointer-events:none;}
  #galaxyInner .gbandline{position:absolute;left:0;right:0;height:2px;pointer-events:none;
     filter:blur(0.5px);opacity:.75;}
  .gnode{position:absolute;width:48px;height:48px;margin-left:-24px;margin-top:-24px;
     border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
     font-weight:900;font-size:15px;cursor:pointer;border:3px solid transparent;
     background:#241a44;color:#5c4f88;transition:transform .08s;}
  .gnode:active{transform:scale(.92);}
  .gnode.done{color:#0d2430;}
  .gnode.cur{border-color:#fff;animation:gpulse 1.5s ease-in-out infinite;}
  .gnode.locked{background:#1c1636;color:#453a68;cursor:default;}
  .gnode.sel{outline:3px solid #fff;outline-offset:2px;}
  .gnode .gnum{font-size:15px;line-height:1;}
  .gnode .gic{font-size:16px;line-height:1;}
  @keyframes gpulse{0%,100%{box-shadow:0 0 8px 1px rgba(255,255,255,.55);}
     50%{box-shadow:0 0 18px 4px rgba(255,255,255,.85);}}
  /* v0.9.14：大 Boss 關節點 —— 邊框加粗、圖示字級放大，跟一般數字關卡有明顯區別 */
  .gnode.boss{border-color:rgba(255,255,255,.65);}
  .gnode.boss .gic{font-size:22px;}
  /* 第100關（全遊戲最終大魔王）：紅色脈動光暈，蓋掉原本 .cur 的白色光暈，
     一眼看出「這關超恐怖」，跟前面99關的大Boss關再拉開一層視覺區隔 */
  .gnode.mega{animation:gpulseMega 1.1s ease-in-out infinite;border-color:#ff3355;}
  .gnode.mega .gic{font-size:26px;}
  @keyframes gpulseMega{0%,100%{box-shadow:0 0 10px 2px rgba(255,40,70,.65);}
     50%{box-shadow:0 0 26px 8px rgba(255,40,70,.95);}}
  #stageInfo{max-width:330px;background:linear-gradient(160deg,#2a1a52,#1b1138);
     border:2px solid #402c78;border-radius:16px;padding:13px 15px;text-align:left;}
  #stageInfo .st{font-size:11px;font-weight:900;letter-spacing:1px;}
  #stageInfo .nm{font-size:19px;font-weight:900;color:#fff;margin:3px 0 4px;}
  #stageInfo .ds{font-size:12px;color:#a294cc;line-height:1.6;}
  #stageInfo .mt{font-size:11px;color:#7e70ab;margin-top:6px;}
  /* v0.9.19：語言選單 */
  #btnLang{padding:10px 12px;font-size:17px;}
  #langList{display:flex;flex-direction:column;gap:6px;max-height:56vh;overflow-y:auto;
     touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:2px;}
  #langList *{touch-action:pan-y;}
  .lrow{border:2px solid #402c78;background:linear-gradient(160deg,#2a1a52,#1b1138);
     border-radius:12px;padding:9px 14px;font-family:inherit;font-weight:900;font-size:14px;
     color:#fff;cursor:pointer;}
  .lrow.on{border-color:#7ef7c0;color:#7ef7c0;}
  /* v0.9.17：結算畫面的近失回饋與糖果幣 */
  #overSub{max-width:330px;margin:2px 0 8px;}
  #overSub .nearmiss{font-size:14px;font-weight:900;color:#ffd84f;margin-bottom:4px;}
  #overSub .coingain{font-size:15px;font-weight:900;color:#ff9ad5;}
  #overSub .coingain .tot{font-size:12px;color:#a294cc;font-weight:700;}
  /* v0.9.17：糖果屋（永久強化商店） */
  #shop{gap:8px;}
  #shopCoins{font-size:20px;font-weight:900;color:#ffd84f;}
  #shopHint{font-size:11px;color:#a294cc;max-width:330px;line-height:1.6;text-align:center;}
  /* ⚠ v0.9.18 修正「糖果屋無法滑動」：原本只寫了 #shopList *（子元素），漏掉容器
     本身。最上層的 *{touch-action:none} 會把 #shopList 自己鎖死，而瀏覽器判斷
     「這根手指能不能捲動」看的是「被摸到的元素 + 它所有祖先」的交集——只要鏈上
     任何一層是 none 就整條斷掉。#galaxyWrap 當初就踩過同一個坑（見上方註解），
     它是容器本身跟 * 兩條都寫了才會動，這裡漏了容器那條所以完全捲不動。 */
  #shopList{width:100%;max-width:340px;max-height:52vh;overflow-y:auto;
     display:flex;flex-direction:column;gap:7px;padding:2px;
     -webkit-overflow-scrolling:touch;touch-action:pan-y;
     scrollbar-width:thin;scrollbar-color:#c98bff rgba(255,255,255,.08);}
  #shopList *{touch-action:pan-y;}
  #shopList::-webkit-scrollbar{width:9px;}
  #shopList::-webkit-scrollbar-track{background:rgba(255,255,255,.06);border-radius:99px;margin:4px 2px;}
  #shopList::-webkit-scrollbar-thumb{border-radius:99px;border:2px solid transparent;background-clip:padding-box;
     background-image:linear-gradient(180deg,#ff9ad5,#c98bff 55%,#8257ff);}
  .mrow{display:flex;align-items:center;gap:9px;text-align:left;
     background:linear-gradient(160deg,#2a1a52,#1b1138);border:2px solid #402c78;
     border-radius:14px;padding:8px 10px;}
  .mrow .mic{font-size:24px;line-height:1;flex:0 0 auto;}
  .mrow .mmid{flex:1 1 auto;min-width:0;}
  .mrow .mn{font-size:14px;font-weight:900;color:#fff;}
  .mrow .md{font-size:11px;color:#a294cc;line-height:1.5;margin-top:2px;}
  .mrow .mpip{display:flex;gap:3px;margin-top:4px;}
  .mrow .mpip i{width:14px;height:5px;border-radius:99px;background:#3b2c68;}
  .mrow .mpip i.on{background:linear-gradient(90deg,#ffd84f,#ff9ad5);}
  .mbuy{flex:0 0 auto;border:0;border-radius:12px;padding:8px 10px;cursor:pointer;
     font-family:inherit;font-weight:900;font-size:12px;color:#2a1250;
     background:linear-gradient(180deg,#ffe58f,#ffb43f);box-shadow:0 3px 0 #c07a12;}
  .mbuy:active{transform:translateY(2px);box-shadow:0 1px 0 #c07a12;}
  .mbuy.cant{background:#3b2c68;color:#6d5fa0;box-shadow:0 3px 0 #2a1f4d;}
  .mbuy.maxed{background:linear-gradient(180deg,#9ef7c0,#4fd0a0);color:#0d3a2a;box-shadow:0 3px 0 #2a8a68;}
  #diag{font-size:10px;color:#5f5388;line-height:1.6;text-align:center;max-width:330px;
     word-break:break-all;pointer-events:auto;}
  #diag b{color:#ff8fae}
  /* v0.9.20 移除死碼：.lvbtn 及其子類別（.num/.txt/.t1/.t2/.dif）是 v0.9.5
     被銀河圖取代掉的舊「一排關卡按鈕」選單留下來的，之後 14 個版本都沒有任何
     HTML/JS 用到，純粹是誤導未來維護的殘留。同批移除的還有 .stat / .tag。 */
  /* upgrade cards */
  #cards{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
     gap:10px;padding:14px;pointer-events:auto;background:rgba(8,4,20,.55);backdrop-filter:blur(3px);}
  .card{flex:1;max-width:180px;min-height:206px;border-radius:20px;padding:16px 12px;
     display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
     background:linear-gradient(170deg,#241547,#150c2e);border:2px solid #3d2a6e;cursor:pointer;
     box-shadow:0 8px 0 rgba(0,0,0,.35);transition:transform .08s;}
  .card:active{transform:scale(.96)translateY(3px);}
  .card .ic{font-size:40px;line-height:1;}
  .card .nm{font-size:15px;font-weight:800;color:#fff;}
  .card .ds{font-size:11.5px;color:#a99ad0;line-height:1.5;}
  .card .lv{font-size:10px;font-weight:700;color:#0d0720;background:#ffd84f;
     border-radius:99px;padding:2px 9px;}
  .card.evo{border-color:#ffd84f;background:linear-gradient(170deg,#5a2a12,#2a1030);}
  .lvtitle{position:absolute;top:8%;width:100%;text-align:center;font-size:19px;
     font-weight:900;color:#ffd84f;letter-spacing:1px;}
  #shot{max-width:min(88vw,340px);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.6);}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="ui">
    <div id="cards" class="hide"><div class="lvtitle">升級！選一張</div></div>

    <div id="menu" class="panel">
      <h1>GOO<br>BLASTER</h1>
      <div id="stageInfo"></div>
      <div id="galaxyWrap"><div id="galaxyInner"></div></div>
      <button class="btn" id="btnPlay">開始遊戲</button>
      <div class="row">
        <button class="btn alt" id="btnShop">🍬 <span id="coinTag">0</span></button>
        <button class="btn small" id="btnLang" title="Language">🌐</button>
        <button class="btn small hide" id="btnReset">從第 1 關重來</button>
      </div>
      <div id="diag"></div>
      <div id="langBox" class="overlayBox hide">
        <div class="box">
          <div class="ic">🌐</div>
          <div class="msg">Language</div>
          <div id="langList"></div>
        </div>
      </div>
      <div id="confirmBox" class="overlayBox hide">
        <div class="box">
          <div class="ic">⚠️</div>
          <div class="msg">確定要從第 1 關重來嗎？</div>
          <div class="sub2">目前的破關進度會被清除，這個動作沒辦法復原。</div>
          <div class="row">
            <button class="btn small" id="btnResetCancel">取消</button>
            <button class="btn small danger" id="btnResetConfirm">確定重來</button>
          </div>
        </div>
      </div>
    </div>

    <!-- v0.9.17：局外成長商店。用糖果幣買永久強化，效果套用到之後每一局的起始狀態。 -->
    <div id="shop" class="panel hide">
      <h1>糖果屋</h1>
      <div id="shopCoins">🍬 0 糖果幣</div>
      <div id="shopHint">永久強化，每一局開始就生效。打不過的關卡，可以先回頭刷幣變強再挑戰。</div>
      <div id="shopList"></div>
      <button class="btn" id="btnShopBack">◀ 回主畫面</button>
    </div>

    <div id="over" class="panel hide">
      <h1 id="overTitle">GAME OVER</h1>
      <div id="overSub"></div>
      <img id="shot" alt="">
      <div class="row">
        <button class="btn hide" id="btnNext">下一關 ▶</button>
        <button class="btn" id="btnAgain">再玩一次</button>
        <button class="btn alt" id="btnSave">存戰報</button>
        <button class="btn small" id="btnMenu">回主畫面</button>
      </div>
    </div>

    <button id="btnPause" class="hide" title="Pause">⏸</button>
    <button id="btnNuke" class="hide" title="Nuke">☢️</button>
    <div id="pauseOverlay" class="overlayBox hide">
      <div class="box">
        <div class="ic">⏸️</div>
        <div class="msg">遊戲已暫停</div>
        <div class="row">
          <button class="btn small" id="btnResume">▶ 繼續遊戲</button>
          <button class="btn small danger" id="btnQuitToMenu">回主畫面</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
const BUILD='v0.9.21';
//====================== 多語系（v0.9.19）======================
// 預設英文。原本 289 條中文字串全部抽成 key，翻譯放在 L10N 表裡。
// 設計重點：
//  ① 資料表（武器/升級卡/關卡/Boss/寶箱…）的顯示欄位在 applyLanguage() 時「就地改寫」，
//     所有既有的顯示程式碼（讀 .name / .n / .d）完全不用改，風險最低。
//  ② 難度層級 L.tier 從中文字串改成「數字索引」，因為它同時是 TIER_COLOR 的查表鍵——

// 瀏覽器語言 → 我們支援的語言代碼。zh 要細分繁簡（TW/HK/MO/Hant 走繁體，其餘走簡體）。
function detectLang(){
  const list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'];
  for(const raw of list){
    if(!raw) continue;
    const t=String(raw); const low=t.toLowerCase();
    if(low.startsWith('zh')){
      if(/hant|tw|hk|mo/.test(low)) return 'zh-Hant';
      return 'zh-Hans';
    }
    if(low.startsWith('pt')) return 'pt-BR';
    const base=low.split('-')[0];
    const hit=LANGS.find(l=>l.c.toLowerCase()===low)||LANGS.find(l=>l.c.toLowerCase().split('-')[0]===base);
    if(hit) return hit.c;
  }
  return 'en';
}

  W=innerWidth; H=innerHeight;

    master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*1.2,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }catch(e){ initFailed=String(e&&e.message||e); ac=null; }
  }
  // 音訊出任何問題都只能讓遊戲「沒聲音」，絕對不能讓操作失效
  function unlock(){ try{ init(); if(ac&&ac.state==='suspended') ac.resume(); }catch(e){ initFailed=String(e&&e.message||e); } }
  function ok(key,gap){
    if(!ac||muted)return false;
    if(gap){ const n=ac.currentTime; if(last[key]&&n-last[key]<gap)return false; last[key]=n; }
    return true;
  }
  // 一顆振盪器 + 可選濾波 + 可選聲相
  function osc(o){
    const t=ac.currentTime+(o.delay||0), dest=o.dest||sfxBus;
    const g=ac.createGain(), s=ac.createOscillator();
    s.type=o.type||'sine';
    s.frequency.setValueAtTime(o.f0,t);
    if(o.f1) (o.lin?s.frequency.linearRampToValueAtTime:s.frequency.exponentialRampToValueAtTime)
             .call(s.frequency,Math.max(1,o.f1),t+o.dur);
    if(o.detune) s.detune.setValueAtTime(o.detune,t);
    const atk=o.atk!==undefined?o.atk:0.005;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(o.vol,t+atk);
    g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
    let node=s;
    if(o.filter){
      const f=ac.createBiquadFilter(); f.type=o.filter;
      f.frequency.setValueAtTime(o.ff0||1200,t);
      if(o.ff1) f.frequency.exponentialRampToValueAtTime(Math.max(60,o.ff1),t+o.dur);
      f.Q.value=o.q||1; node.connect(f); node=f;
    }
    if(o.pan!==undefined&&ac.createStereoPanner){
      const p=ac.createStereoPanner(); p.pan.value=Math.max(-1,Math.min(1,o.pan));
      node.connect(p); node=p;
    }
    node.connect(g); g.connect(dest);
    s.start(t); s.stop(t+o.dur+0.03);
  }
  // 一段噪音 + 帶通/低通掃頻
  function nz(o){
    const t=ac.currentTime+(o.delay||0), dest=o.dest||sfxBus;
    const s=ac.createBufferSource(); s.buffer=noiseBuf;
    s.playbackRate.value=o.rate||1;
    const f=ac.createBiquadFilter(); f.type=o.filter||'bandpass';
    f.frequency.setValueAtTime(o.f0||1200,t);
    if(o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(60,o.f1),t+o.dur);
    f.Q.value=o.q||1;
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(o.vol,t+(o.atk!==undefined?o.atk:0.004));
    g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
    let node=f;
    if(o.pan!==undefined&&ac.createStereoPanner){
      const p=ac.createStereoPanner(); p.pan.value=Math.max(-1,Math.min(1,o.pan));
      f.connect(p); node=p;
    }
    s.connect(f); node.connect(g); g.connect(dest);
    s.start(t); s.stop(t+o.dur+0.03);
  }

  //---------------- 背景音樂：走 lookahead 排程，不用 setTimeout 對拍 ----------------
  // v0.9.8：改成兩套完全不同的主題（不是同一旋律變快變亮而已），
  // 由 musicIntensity() 切換——平常是「可愛版」，遇到 Boss 立刻換成「緊張版」。
  // v0.9.15：每一關要聽起來不一樣。做法不是真的作100首曲子（不切實際、維護成本
  // 也太高），而是在同一套「和弦進行＋琶音引擎」上疊兩層變化：①移調（M.keyOffset，
  // 靠 NOTE() 這個唯一的 MIDI→Hz 轉換點統一加總，不用改每個呼叫點）②換一套琶音
  // 節奏型（M.arp，從 ARP_VARIANTS 選一套）。兩層乘起來，前 60 關（12種調 × 5種
  // 節奏型的最小公倍數）每關的組合都不重複，60 關之後才會開始循環——不是「每關
  // 都獨一無二」的完美謊言，是誠實地在同一套引擎上做出「聽起來像換了一首歌」的
  // 效果，跟音樂系統一直以來零外部音檔、純程式合成的設計精神一致。
  const NOTE=n=>440*Math.pow(2,(n-69+(M.keyOffset||0))/12);     // MIDI → Hz，統一在這裡加上移調
  // 可愛主題：C大調亮色俏皮進行：C - G - Am - F（每小節一個和弦）
  const PROG_CUTE=[
    {root:36, tones:[60,64,67,72]},   // C
    {root:31, tones:[59,62,67,71]},   // G
    {root:33, tones:[57,60,64,69]},   // Am
    {root:29, tones:[57,60,65,69]}    // F
  ];
  // Boss主題：a小調 + 借用大三度屬和弦(E)製造導音張力：Am - E - Am - Dm（i-V-i-iv）
  // 跟可愛主題完全不共用和弦，聽感上是「換了一首歌」而不是同一首歌加速
  const PROG_BOSS=[
    {root:33, tones:[57,60,64,69]},   // Am（i）
    {root:40, tones:[64,68,71,76]},   // E （V，大三度導音，緊張感的來源）
    {root:33, tones:[57,60,64,69]},   // Am（i）
    {root:38, tones:[62,65,69,74]}    // Dm（iv）
  ];
  // 每小節 16 個十六分音符的和弦音索引（0~3，對應 tones 陣列）。
  // v0.9.15：原本只有一套，現在有 5 套不同節奏型，每關按 lvIdx%5 選一套。
  const ARP_VARIANTS=[
    [0,1,2,3,2,1,3,2,0,1,2,3,1,2,3,1],   // 原版
    [0,2,1,3,2,0,3,1,0,2,1,3,2,1,3,0],
    [0,1,0,2,3,2,1,3,0,1,0,2,3,1,2,3],
    [3,2,1,0,1,2,3,0,3,2,1,0,2,3,0,1],   // 下行感
    [0,3,1,2,0,3,2,1,0,3,1,2,1,0,2,3]
  ];
  // 移調表：用五度圈間隔（每步±7半音，取 mod12 落在 -5~6 半音內）排出12個調，
  // 相鄰調聽起來自然相關（不是隨機半音亂跳），但排列順序又不是單純半音爬升。
  const KEY_OFFSETS=(()=>{ const out=[]; for(let i=0;i<12;i++){ let v=(i*7)%12; if(v>6) v-=12; out.push(v); } return out; })();
  const M={on:false,step:0,next:0,timer:null,bpm:112,intensity:0,theme:'cute',keyOffset:0,arp:null,arpIdx:0};
  function stepDur(){ return 60/M.bpm/4; }
  function playStep(i,t){
    const boss=M.theme==='boss';
    const PROG = boss?PROG_BOSS:PROG_CUTE;
    const bar=Math.floor(i/16)%4, k=i%16, ch=PROG[bar];
    const dt0=t-ac.currentTime;

    if(boss){
      // Boss戰：驅動型八分音符貝斯（鋸齒波，比可愛版密集一倍），營造壓迫感
      if(k%4===0)
        osc({f0:NOTE(ch.root),f1:NOTE(ch.root)*0.985,dur:0.20,vol:0.24,type:'sawtooth',
             filter:'lowpass',ff0:1100,ff1:260,delay:dt0,dest:musBus});
      // 琶音：鋸齒波、更快更硬，每兩拍疊一次高八度製造衝突感
      const nt=ch.tones[(M.arp||ARP_VARIANTS[0])[k]] + (k%8===0?12:0);
      osc({f0:NOTE(nt),dur:0.13,vol:0.085,type:'sawtooth',
           filter:'lowpass',ff0:3200,ff1:900,q:5,
           pan:(k%4-1.5)*0.24,delay:dt0,dest:musBus});
      // 鼓組：每拍都有大鼓（比可愛版密集兩倍）、2/4拍小鼓、高帽更密
      if(k%4===0) osc({f0:140,f1:38,dur:0.15,vol:0.30,type:'sine',delay:dt0,dest:musBus});
      if(k===4||k===12) nz({dur:0.12,vol:0.16,f0:2400,f1:1000,q:1.0,delay:dt0,dest:musBus});
      if(k%2===1) nz({dur:0.03,vol:0.06,f0:9000,q:2,pan:k%4===1?-0.3:0.3,delay:dt0,dest:musBus});
      // 每輪結尾加一顆不和諧的緊張墊音，強化「快出事了」的感覺
      if(k===14&&bar===3)
        osc({f0:NOTE(ch.tones[1]+1),dur:0.5,vol:0.05,type:'square',atk:0.02,
             filter:'bandpass',ff0:1400,q:6,delay:dt0,dest:musBus});
      return;
    }

    // 可愛主題：三角波+鐘鈴亮片，比原本更甜、更彈跳
    // 低音：小節第 1、3 拍，短促而有彈性
    if(k===0||k===8)
      osc({f0:NOTE(ch.root),f1:NOTE(ch.root)*0.995,dur:0.30,vol:0.18,type:'triangle',
           filter:'lowpass',ff0:900,ff1:340,delay:dt0,dest:musBus});
    // 琶音：三角波，比原本的方波更柔更甜
    const nt=ch.tones[(M.arp||ARP_VARIANTS[0])[k]];
    osc({f0:NOTE(nt),dur:0.14,vol:0.058,type:'triangle',
         filter:'lowpass',ff0:2000,ff1:750,q:2.4,
         pan:(k%4-1.5)*0.28,delay:dt0,dest:musBus});
    // 亮片層：固定節奏（非隨機，音訊要可重現）在弱拍加一顆高八度鐘鈴聲，增加可愛的閃爍感
    if((k===2||k===6||k===10||k===14) && bar%2===0)
      osc({f0:NOTE(nt+12),dur:0.22,vol:0.035,type:'sine',atk:0.002,
           delay:dt0,dest:musBus});
    // 墊音：每小節開頭一顆長音，很輕
    if(k===0)
      osc({f0:NOTE(ch.tones[0]-12),dur:1.9,vol:0.045,type:'sawtooth',atk:0.25,
           filter:'lowpass',ff0:520,ff1:260,delay:dt0,dest:musBus});
    // 鼓組：輕巧
    if(k===0||k===8) osc({f0:132,f1:44,dur:0.16,vol:0.24,type:'sine',delay:dt0,dest:musBus});
    if(k===4||k===12) nz({dur:0.11,vol:0.10,f0:2100,f1:900,q:1.1,delay:dt0,dest:musBus});
    if(k%2===1) nz({dur:0.035,vol:0.038,f0:8200,q:2,pan:k%4===1?-0.3:0.3,delay:dt0,dest:musBus});
  }
  function pump(){
    if(!M.on||!ac)return;
    const sd=stepDur();
    while(M.next < ac.currentTime+0.14){
      if(M.next>ac.currentTime-0.05) playStep(M.step,M.next);
      M.next+=sd; M.step++;
    }
  }
  return {
    unlock, isMuted:()=>muted, isMusicOn:()=>M.on, status:()=>ac?('ok/'+ac.state):('silent:'+(initFailed||'not started')),
    toggle(){
      muted=!muted; if(!muted)unlock();
      if(ac) musBus.gain.setTargetAtTime(muted?0:(M.on?1:0),ac.currentTime,0.1);
      if(!muted) osc({f0:660,f1:990,dur:.10,vol:.16,type:'triangle'});

    },
    musicStart(){
      unlock(); if(!ac)return;
      M.on=true; M.step=0; M.next=ac.currentTime+0.1; M.intensity=0; M.theme='cute';
      M.bpm=112;
      // v0.9.15：每次啟動音樂先重置回預設調（C大調、原版琶音）——選單音樂沒有
      // 「關卡」概念，靠這行確保選單一律是熟悉的原版主題曲，不會殘留上一關的移調。
      // 真正要玩關卡時，start() 會緊接著呼叫 musicSetLevel() 蓋成該關卡專屬的調。
      M.keyOffset=0; M.arp=null; M.arpIdx=0;

      if(!muted) musBus.gain.setTargetAtTime(1,ac.currentTime,0.9);   // 慢慢淡入

    },
    // v0.9.15：每一關配一個專屬的（調性,琶音節奏型）組合，讓100關不會聽起來
    // 全部都是同一首歌——lvIdx 直接決定組合，同一關每次進去都聽到一樣的版本
    // （不是隨機），12種調 × 5種節奏型要到第61關才會開始重複第1關的組合。
    musicSetLevel(lvIdx){
      const i=((lvIdx%12)+12)%12, j=((lvIdx%ARP_VARIANTS.length)+ARP_VARIANTS.length)%ARP_VARIANTS.length;
      M.keyOffset=KEY_OFFSETS[i]; M.arp=ARP_VARIANTS[j]; M.arpIdx=j;
    },
    // v0.9.20：測試用掛鉤，回傳目前的調性偏移與琶音節奏型編號。
    // 為什麼要加這個：驗證「每關的音樂組合正確」原本只能靠攔截 Web Audio 排程出來的
    // 音符頻率反推，但 Web Audio 是「提前排程」的——音符會在 musicStop() 之後還繼續
    // 播、也會在取樣視窗開始前就排好，導致測試抓到序列中段而不是開頭。
    // 這個問題在 v0.9.18/19/20 連續三個版本、用三種不同的等待策略都還是會偶發失敗
    // （多個測試平行搶 CPU 時特別容易）。與其繼續補等待時間，不如直接把「要驗的狀態」
    // 暴露出來：兩個數字、無副作用，測試從此不依賴任何時序。
    musicDebug(){ return {keyOffset:M.keyOffset|0, arpIdx:M.arpIdx|0, theme:M.theme, on:M.on}; },
    musicStop(fade){
      if(!ac||!M.on)return;
      musBus.gain.setTargetAtTime(0.0001,ac.currentTime,fade===false?0.05:0.5);
      setTimeout(()=>{ M.on=false; clearInterval(M.timer); }, fade===false?120:1400);
    },
    musicIntensity(n){ M.intensity=n; M.bpm= n>0?158:112; },
    // v0.9.10：切到背景（切別的App、鎖螢幕、滑掉）時立刻讓所有聲音停住。
    // 音樂用 lookahead 排程，note 一旦排進 Web Audio 的音訊執行緒，就算主執行緒被瀏覽器
    // 節流（分頁不可見時 rAF 幾乎都會被瀏覽器暫停，但 Web Audio 播放走獨立執行緒，
    // 不受影響），已經排定的聲音還是會照樣出聲——這就是使用者回報「切出去音效還在跑」
    // 的真正原因。AudioContext.suspend() 是唯一能讓「已經排定但還沒播完」的聲音立刻
    // 靜掉的做法，而不是只擋住「之後」要排的聲音。
    suspend(){ if(ac&&ac.state==='running'){ try{ ac.suspend(); }catch(e){} } },

    // ---- 音效：每一發都有隨機微變，且分層 ----
    shoot(w,pan){
      if(!ok('s',0.045))return;
      const p=(pan||0)*0.5;
      if(w==='graffiti'){                                  // 噴槍：噴霧感
        nz({dur:R(.07,.10),vol:R(.045,.065),f0:R(2600,3600),f1:R(900,1400),q:.8,pan:p});
        osc({f0:R(400,520),f1:R(190,240),dur:.06,vol:.035,type:'square',
             filter:'lowpass',ff0:2600,ff1:900,pan:p});
      }else if(w==='yoyo'){                                // 溜溜球：轉動呼嘯
        osc({f0:R(240,300),f1:R(620,760),dur:.16,vol:.055,type:'sine',pan:p});
        osc({f0:R(480,600),f1:R(1240,1520),dur:.16,vol:.022,type:'triangle',detune:8,pan:p});
        nz({dur:.10,vol:.022,f0:1600,f1:3400,q:2.5,pan:p});
      }else{                                               // 水槍：水感雙層 + 氣音
        const f=R(680,820);
        osc({f0:f,f1:f*0.33,dur:.075,vol:.048,type:'triangle',
             filter:'lowpass',ff0:3200,ff1:1100,pan:p});
        osc({f0:f*1.995,f1:f*0.7,dur:.055,vol:.022,type:'sine',detune:R(-14,14),pan:p});
        nz({dur:.045,vol:.026,f0:R(3200,4200),f1:1500,q:1.2,pan:p});
      }
    },
    hit(pan){
      if(!ok('h',0.028))return;
      const p=(pan||0)*0.6;
      nz({dur:R(.035,.055),vol:R(.045,.062),f0:R(2100,3200),f1:R(700,1100),q:1.4,pan:p});
      osc({f0:R(340,460),f1:R(140,190),dur:.05,vol:.030,type:'triangle',pan:p});
    },
    crit(pan){
      if(!ok('c',0.05))return;
      const p=(pan||0)*0.6, f=R(1000,1250);
      osc({f0:f,f1:f*0.42,dur:.11,vol:.070,type:'square',filter:'lowpass',ff0:5200,ff1:1400,pan:p});
      osc({f0:f*1.5,f1:f*0.6,dur:.09,vol:.030,type:'triangle',detune:12,pan:p});
      nz({dur:.07,vol:.045,f0:5200,f1:1800,q:1,pan:p});
    },
    kill(pan){
      if(!ok('k',0.026))return;
      const p=(pan||0)*0.6, f=R(300,400);
      osc({f0:f,f1:f*0.32,dur:R(.09,.13),vol:.060,type:'triangle',pan:p});   // 果凍破掉的「啵」
      nz({dur:R(.05,.08),vol:.034,f0:R(700,1100),f1:R(260,380),q:.9,pan:p});
    },
    pickup(){
      if(!ok('p',0.035))return;
      const f=R(920,1080);
      osc({f0:f,f1:f*1.55,dur:.055,vol:.032,type:'sine'});
      osc({f0:f*2,f1:f*3.1,dur:.045,vol:.012,type:'triangle',delay:.012});
    },
    dash(){
      if(!ok('d',0.09))return;
      nz({dur:.22,vol:.085,f0:R(2400,3000),f1:R(320,460),q:.9});
      osc({f0:R(760,900),f1:150,dur:.22,vol:.045,type:'sawtooth',filter:'lowpass',ff0:2600,ff1:400});
      osc({f0:R(1500,1750),f1:400,dur:.14,vol:.018,type:'sine'});
    },
    hurt(){
      if(!ok('u',0.18))return;
      osc({f0:R(230,270),f1:52,dur:.36,vol:.20,type:'sawtooth',filter:'lowpass',ff0:1400,ff1:220});
      osc({f0:R(115,135),f1:40,dur:.40,vol:.12,type:'square',filter:'lowpass',ff0:700,ff1:160});
      nz({dur:.24,vol:.11,f0:600,f1:180,q:.7});
    },
    heal(){
      if(!ok('hl',0.18))return;
      [523.25,659.25,783.99].forEach((f,i)=>{
        osc({f0:f,dur:.20,vol:.075,type:'triangle',delay:i*0.055});
        osc({f0:f*2,dur:.16,vol:.022,type:'sine',delay:i*0.055+0.01});
      });
    },
    level(){
      if(!ok('l',0.14))return;
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
        osc({f0:f,dur:.18,vol:.080,type:'triangle',delay:i*0.05});
        osc({f0:f*1.5,dur:.14,vol:.024,type:'square',filter:'lowpass',ff0:3000,ff1:1200,delay:i*0.05});
      });
    },
    evo(){
      if(!ok('e',0.28))return;
      [392,523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{
        osc({f0:f,dur:.26,vol:.085,type:'square',filter:'lowpass',ff0:4200,ff1:1300,delay:i*0.062});
        osc({f0:f*2,dur:.20,vol:.028,type:'triangle',delay:i*0.062+0.02});
      });
      nz({dur:.5,vol:.05,f0:900,f1:5200,q:1.2});
    },
    bossIn(){
      if(!ok('bi',0.5))return;
      osc({f0:118,f1:54,dur:1.0,vol:.20,type:'sawtooth',filter:'lowpass',ff0:900,ff1:180});
      osc({f0:59,f1:27,dur:1.2,vol:.14,type:'square',filter:'lowpass',ff0:400,ff1:110});
      nz({dur:.8,vol:.10,f0:220,f1:70,q:.6});
      osc({f0:1400,f1:260,dur:.5,vol:.045,type:'triangle',delay:.05});
    },

const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
// v0.9.11：點到「射線段」的最短距離，給超級大 Boss 的雷射鎖定攻擊判定命中用。
// (x0,y0)=起點、ang=方向、len=長度上限，(px,py)=要測試的點（通常是玩家座標）。
function raySegDist(x0,y0,ang,len,px,py){
  const dx=Math.cos(ang), dy=Math.sin(ang);
  let t=(px-x0)*dx+(py-y0)*dy;
  t=clamp(t,0,len);
  const cx=x0+dx*t, cy=y0+dy*t;
  return Math.hypot(px-cx,py-cy);
}

function moveJoy(x,y){
  IN.x=x; IN.y=y;
  const now=performance.now();
  IN.hist.push({x:IN.x,y:IN.y,t:now});
  while(IN.hist.length>2 && now-IN.hist[0].t>110) IN.hist.shift();
  // 虛擬搖桿：以起點為圓心，最大半徑 R
  const R=62; let dx=IN.x-IN.ox, dy=IN.y-IN.oy;
  const d=Math.hypot(dx,dy);
  if(d>R){ // 拖太遠時錨點跟著走，手感更順
    IN.ox+=dx*(1-R/d); IN.oy+=dy*(1-R/d);
    dx=IN.x-IN.ox; dy=IN.y-IN.oy;
  }
  const m=Math.hypot(dx,dy);
  IN.mag=clamp(m/R,0,1);
  if(m>0.001){ IN.dx=dx/m; IN.dy=dy/m; }

// 手指在動但角色不動。改成每次事件都直接從 e.touches 重新挑一根「不在按鈕上」的手指當搖桿，
// 完全無狀態，漏事件也能自己恢復。
// ⚠ TouchList 一律用索引存取：iOS Safari 與部分 Android WebView 沒有 Symbol.iterator。
// ⚠ v0.9.4 修正「手機上無法移動」的真正成因：

// （390px 寬的手機上是 60.8px，但只畫出 46.8px），右手拇指自然放的位置正好在裡面 →
// 拇指停在該區內時搖桿永遠不啟動，mag 恆為 0，拖再多都不會動。
// 已用 CDP 真實觸控重現：區內小幅繞圈 60 次 touchmove，mag 六次取樣全是 0。
// 新規則：優先挑不在按鈕上的手指；如果所有手指都在按鈕上，還是拿第一根來當搖桿。
// 死區徹底消失，而且維持無狀態 —— 不會回到「漏一個 touchend 就永久卡死」的老問題。
function pickJoyTouch(tl){
  if(!tl||!tl.length) return null;
  for(let i=0;i<tl.length;i++){
    const t=tl[i];
    if(inBtn(t.clientX,t.clientY)||inMute(t.clientX,t.clientY)) continue;
    return t;
  }
  return tl[0];                                  // 後援：寧可誤判成搖桿，也不要不能動

function syncJoy(e,allowChanged){
  let t=pickJoyTouch(e.touches);
  if(!t && allowChanged && e.changedTouches && e.changedTouches.length) t=pickJoyTouch(e.changedTouches);
  if(!t){ if(IN.active) endJoy(); return; }
  if(!IN.active) startJoy(t.identifier,t.clientX,t.clientY);
  else moveJoy(t.clientX,t.clientY);
}

// v0.9.17：把玩家在商店買的永久強化套用到這一局的起始狀態。
// 刻意做成獨立函式而不是塞進 newGame() 的物件字面量裡——這樣「關卡本身給的
// 起始值」跟「玩家自己累積的強化」在程式碼上是分開的兩層，之後要調整任何一邊
// 都不會不小心動到另一邊。兩者是相加關係，不互相取代。
function applyMeta(G){
  const P=G.P;
  const h=metaLv('hearts');
  if(h){ P.maxHearts+=h; P.hearts+=h; }
  P.dmg     *= 1 + metaLv('dmg')*0.10;
  P.atkSpd  *= 1 + metaLv('aspd')*0.08;
  P.pickup  += metaLv('pickup')*45;
  P.dashCDmax = Math.max(1.0, P.dashCDmax - metaLv('dash')*0.35);
  P.metaRange = metaLv('range')*90;         // 在 update() 裡加進 P.atkRange
  P.metaXP    = 1 + metaLv('xp')*0.12;      // 在 killEnemy() 裡乘進晶核經驗
  const w=metaLv('wep');
  if(w) P.wep.bubble=Math.min(5,P.wep.bubble+w);
}

//====================== 果凍地形（核心差異化）======================
// 敵人死亡留下果凍窪；玩家踩過加速，敵人踩過減速；爆炸可引爆連鎖
const GOO_MAX=64, GOO_LIFE=7.5, GOO_RMAX=54;
function addGoo(x,y,r,hue){
  // 就近合併，避免無限增長
  for(let i=0;i<G.GOO.length;i++){
    const g=G.GOO[i];
    if(dist2(x,y,g.x,g.y) < (g.r*0.8)**2){
      g.r=Math.min(g.r+r*0.22, GOO_RMAX); g.life=Math.max(g.life,GOO_LIFE*.8); return;
    }
  }
  if(G.GOO.length>=GOO_MAX) G.GOO.shift();
  G.GOO.push({x,y,r:Math.min(r,GOO_RMAX),hue,life:GOO_LIFE,max:GOO_LIFE,burn:0,wob:rnd(0,6.28)});
}
function igniteGoo(x,y,rad,depth){
  if(depth>3)return;
  // v0.9.13 修正：跟 damageArea() 同一類問題的邊角案例——這裡呼叫的 damageArea()
  // 打死怪物時經過 killEnemy() 會呼叫 addGoo()，如果 G.GOO 這時候剛好滿了
  // （GOO_MAX=64 顆果凍同時存在），addGoo() 會 shift() 掉最舊的一顆，一樣是
  // 邊迭代邊刪同一個陣列。雖然要「果凍剛好疊到 64 顆」才會踩到，比較少見，
  // 但既然是同一種模式就一起改成倒著跑的索引迴圈，不留這個地雷。
  for(let i=G.GOO.length-1;i>=0;i--){
    const g=G.GOO[i]; if(!g) continue;
    if(g.burn>0) continue;
    if(dist2(x,y,g.x,g.y) < (rad+g.r)**2){
      g.burn=.55;
      damageArea(g.x,g.y,g.r*1.15, 14*G.P.dmgEff, false);
      burst(g.x,g.y,10,g.hue,3);
      setTimeout(()=>{ if(G&&G.running) igniteGoo(g.x,g.y,g.r*1.1,depth+1); },70);
    }
  }
}

// v0.9.5：4 種怪全部改成能發射遠程攻擊（原本只有無人機會）。
// cdMin/cdMax 是「兩次開火間隔」的秒數範圍，數字越大＝打越慢。
// 軟泥（初階怪）刻意設成全遊戲最慢：同一個等級層級（tier）下，
// 軟泥的 cdMin 都比其他三種的 cdMin 大，乘上共用的 atkSlow／tier 倍率後順序不會變。
// kite=true 才會在近距離後退保持距離（目前只有無人機維持原本的風箏打法）；
// 其餘三種維持原本「衝向玩家」的路徑，只是路上會順便打一發。
// rangedFromTier：這隻怪從第幾個 tier 開始會射擊（0=一開始就會）。
// ⚠ 踩過兩次同一種坑，記錄一下：
//  1) 一開始設 tier=1（第3關）：笨bot 直接陣亡掉滿心。第3-4關「上手層」的兔子
//     敘述只提速度，完全沒提子彈 —— 這層是刻意留白的純速度測試。
//  2) 改成 tier=2（第5關）想說對齊無人機原本的登場點，結果 3 次測試全滅（0/5）。
//     問題是第5關本來就是「無人機第一次登場、單獨教你閃子彈」的關卡
//    （docs 原話：「無人機登場：會從遠處射擊，學會用加速鍵的無敵幀穿過子彈」），
//     這次改動讓軟泥+兔子在同一關一起加入開火，等於三種怪同時射擊，
//     直接打穿「一次只教一個新機制」的鋸齒設計原則。
//  現在改成 tier=3（第7關，挑戰層）：這一層原始設計本來就是「不再引入新機制，
//  純粹考驗操作」（第8關敘述：「四種敵人全開，沒有新東西了」），疊加更多遠程
//  壓力跟這層的設計意圖一致，不會踩到中段任何一個刻意留白的教學關卡。
// 軟泥（初階怪）在射擊解鎖後仍是全遊戲最慢的射手（見下方 cdMin 排序）。
const ETYPE={
  slime  :{r:15,hp:11 ,spd:62 ,dmg:8 ,hue:140,xp:1,
           ranged:true,rangedFromTier:3,kite:false,cdMin:3.4,cdMax:4.4,shootRange:360},
  bunny  :{r:14,hp:20 ,spd:124,dmg:10,hue:330,xp:2,
           ranged:true,rangedFromTier:3,kite:false,cdMin:2.4,cdMax:3.2,shootRange:400},
  drone  :{r:15,hp:28 ,spd:78 ,dmg:9 ,hue:195,xp:3,
           ranged:true,rangedFromTier:0,kite:true, cdMin:1.9,cdMax:3.0,shootRange:520},
  bomber :{r:19,hp:38 ,spd:96 ,dmg:22,hue:30 ,xp:4,boom:true,
           ranged:true,rangedFromTier:0,kite:false,cdMin:2.6,cdMax:3.6,shootRange:340}
};
// 怪物等級（tier）：對應現有 5 個難度層級（新手/上手/熟練/挑戰/地獄，每層 2 關）。
// 血量/攻速隨 tier 提高；移速也會提高，但在 spawnEnemy 裡硬性夾在「主角速度 60%」以內。
const TIER_HP =[1.00,1.18,1.38,1.62,1.90];
const TIER_SPD=[1.00,1.06,1.12,1.18,1.24];
const TIER_CD =[1.00,0.90,0.82,0.75,0.68];   // 越小＝攻速越快
function enemyTier(){ return Math.min(4, Math.floor((G.lvIdx||0)/2)); }
function spawnEnemy(type,mult){
  // ⚠ v0.9.19：這個區域變數原本叫 T，但多語系新增了全域翻譯函式 T()，同名會把
  // 全域的 T 在整個函式內遮蔽掉。目前剛好沒壞（這個函式沒有要翻譯的字串），
  // 但那是顆地雷——之後只要有人在這裡加一行 T('...') 就會噴「T is not a function」。
  // 改名成 ET（enemy type）徹底消除遮蔽，讀起來也更清楚。
  const ET=ETYPE[type];
  const a=rnd(0,6.283), d=rnd(330,430);
  const P=G.P;
  const tier=enemyTier();
  const hpT=TIER_HP[tier], spT=TIER_SPD[tier], cdT=TIER_CD[tier];
  const rawSpd=ET.spd*rnd(.9,1.12)*CUR().espd*spT;
  const spd=Math.min(rawSpd, P.spd*0.6);      // 移速上限：主角速度的 60%
  const cdMin=ET.cdMin*cdT, cdMax=ET.cdMax*cdT;
  const ranged = !!ET.ranged && tier>=(ET.rangedFromTier||0);
  G.E.push({x:P.x+Math.cos(a)*d, y:P.y+Math.sin(a)*d, vx:0,vy:0,
    r:ET.r, hp:ET.hp*mult*hpT, maxhp:ET.hp*mult*hpT, spd,
    dmg:ET.dmg, hue:ET.hue, xp:ET.xp, type, flash:0, kb:0,kbx:0,kby:0,
    shootCD:rnd(cdMin,cdMax), wob:rnd(0,6.28), boom:!!ET.boom,
    ranged, kite:!!ET.kite, cdMin, cdMax, shootRange:ET.shootRange,
    tier, boss:false});
}
function spawnBoss(cfg){
  const P=G.P; const a=rnd(0,6.283);

    r:cfg.r,hp:cfg.hp,maxhp:cfg.hp,spd:cfg.spd,dmg:cfg.dmg,hue:cfg.hue,xp:cfg.superBoss?90:40,
    type:'boss',flash:0,kb:0,kbx:0,kby:0,shootCD:2,wob:0,boss:true,name:cfg.name,
    atk:cfg.atk, atkT:1.4, atkMax:cfg.atkT, bspd:cfg.bspd, spin:0, kind:cfg.kind,
    superBoss:!!cfg.superBoss,
    // v0.9.11：雷射鎖定攻擊計時器，只有超級大 Boss 會真的用到（見 update() 內判斷）
    laserCD:rnd(2.6,3.6), laserWarnT:0, laserFireT:0, laserAng:0};
  G.E.push(b); G.boss=b;
  if(cfg.superBoss){
    toast(T('tSuperBossIn',cfg.name),'#ff2a6b'); shake(14); hitstop(.12);
  }else{

// 目標選擇：Boss 的「有效距離」打 0.4 折，所以只要 Boss 在合理範圍內就優先集火，
// 但貼臉的雜兵仍然會被打掉。原規格的「最近優先」在 Boss 戰會讓輸出全部餵給雜兵。
// 攻擊距離限制：只能鎖定畫面上實際看得到的敵人（用攝影機座標換算螢幕座標），
// maxd 仍保留當作距離上限的安全閥（例如超寬螢幕時不要打到太遠）。
function onScreen(x,y,margin){
  margin=margin||0;
  const sx=x-G.cam.x+W/2, sy=y-G.cam.y+H/2;
  return sx>-margin && sx<W+margin && sy>-margin && sy<H+margin;
}
function nearest(x,y,maxd){
  let best=null,bd=maxd*maxd;
  const SCREEN_MARGIN=44;              // 讓貼在邊緣、還露出一部分的敵人也能被鎖定，不要卡在像素邊界
  for(const e of G.E){
    if(!onScreen(e.x,e.y,SCREEN_MARGIN)) continue;
    let d=dist2(x,y,e.x,e.y);
    if(e.boss) d*=0.16;                 // 距離平方 → 0.4² = 0.16
    if(d<bd){bd=d;best=e;}
  }
  return best;
}
function shoot(x,y,a,sp,dmg,r,hue,o){
  o=o||{};
  G.B.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dmg,r,hue,
    life:o.life||1.25, pierce:o.pierce||0, goo:!!o.goo, hit:new Set(),
    boomerang:!!o.boomerang, age:0, ox:x, oy:y});
}
// 敵彈一律紅色菱形，不隨敵人變色 —— 顏色與形狀都要能單獨辨識出「這會傷到我」
function shootE(x,y,a,sp,dmg,r){
  G.EB.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dmg,r,life:4.2,rot:a,spin:rnd(3,6)});
}

//====================== 效果 ======================
function burst(x,y,n,hue,spd){
  spd=spd||1;
  for(let i=0;i<n;i++){
    const a=rnd(0,6.283), s=rnd(60,290)*spd;
    G.PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(2,6.5),
      hue:hue+rnd(-22,22),life:rnd(.25,.7),max:.7});
  }
  if(G.PT.length>340) G.PT.splice(0,G.PT.length-340);   // 400+ 粒子肉眼分辨不出來，但吃掉不少軟體渲染時間
}
function toast(txt,color){ G.TXT.push({txt,color:color||'#fff',t:0,life:1.5,big:true}); }
function pop(x,y,txt,color,sz){
  G.TXT.push({x,y,txt,color:color||'#fff',t:0,life:.65,vy:-56,sz:sz||16});
}
// 舊版是每一幀重新取隨機位移 → 高頻抖動，長時間看很傷眼。
// 改成：一次衝擊給一個固定方向 + 阻尼正弦，讀起來是「撞了一下」而不是「畫面在震」。
// v0.9.8：拿掉「畫面晃動：關/低/標準」的使用者選項（使用者要求），固定用原本
// 「低」的強度當統一基準，維持舒適一致。但 Boss 在場時額外加成，加強戰鬥的刺激感。
const SHAKE=0.5;                     // 固定值，不再讓玩家調整
function shake(v,ang){
  if(SHAKE<=0){ G.cam.shake=0; return; }
  const c=G.cam;
  const bossMul = (G.boss ? 1.4 : 1);      // Boss 戰時晃動加強 40%
  const amp=v*SHAKE*0.55*bossMul;
  if(amp<=c.shake*0.6) return;       // 已經在震且更強時不打斷，避免疊加成亂流
  c.shake=Math.min(c.shake+amp, (9*SHAKE+1)*bossMul);
  c.shAng= ang!==undefined?ang:rnd(0,6.283);
  c.shPhase=0;
}
function hitstop(v){ G.hitstop=Math.max(G.hitstop,v); }

// v0.9.13 修正：原本用 for(const e of G.E)，但 hurtEnemy() 打死怪物時會呼叫
// killEnemy() 對 G.E 做 splice()，邊迭代邊刪除同一個陣列會讓「剛好排在被刪除
// 那格後面」的敵人整個被跳過（陣列往前遞補一格，for...of 的內部游標會直接
// 錯過它）。實測過：10 隻怪疊在一起，一次 AoE 打過去，只有 5 隻真的受傷/死亡，
// 另外 5 隻完全沒事——影響到自爆怪的爆炸、進化版泡泡槍的果凍暴雨、連鎖引爆。
// 改成從陣列尾端往前跑的索引迴圈：splice 只會影響「更前面」的索引，不會讓
// 迴圈游標跳過任何一個還沒檢查的元素。
function damageArea(x,y,r,dmg,doKb){
  for(let i=G.E.length-1;i>=0;i--){
    const e=G.E[i]; if(!e) continue;
    if(dist2(x,y,e.x,e.y)<(r+e.r)**2){
      hurtEnemy(e,dmg);
      if(doKb){ const a=Math.atan2(e.y-y,e.x-x); e.kb=.18; e.kbx=Math.cos(a)*380; e.kby=Math.sin(a)*380; }
    }
  }
}
function hurtEnemy(e,dmg,fromBullet){
  const P=G.P;
  const crit=Math.random()<P.crit;
  const d=crit?dmg*2:dmg;
  e.hp-=d; e.flash=.09;
  if(fromBullet&&P.sticky){                    // 黏性糖漿
    e.slowT=Math.max(e.slowT||0, P.sticky>=2?3.5:2.0);
    if(P.sticky>=2){                            // 二階：傳染給旁邊的敵人
      for(const o of G.E) if(o!==e&&!o.boss&&dist2(o.x,o.y,e.x,e.y)<70*70)
        o.slowT=Math.max(o.slowT||0,2.0);
    }
  }
  const pan=clamp((e.x-P.x)/420,-1,1);
  if(crit){ pop(e.x,e.y-e.r,Math.round(d),'#ffd84f',20); hitstop(.045); SFX.crit(pan); }
  else SFX.hit(pan);
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  const i=G.E.indexOf(e); if(i<0)return;
  const P=G.P;
  G.E.splice(i,1); G.kills++;
  burst(e.x,e.y,e.boss?60:9,e.hue,e.boss?2.4:1);
  addGoo(e.x,e.y,e.boss?70:e.r*1.5,e.hue);
  // v0.9.16：後期關卡的晶核給更多經驗（L.xpMul）。原因是玩家每一關都從 Lv.1
  // 重新開始，但敵人強度一路上修——如果經驗給的量不變，後期關卡玩家還沒升到
  // 夠強的 build 就已經被淹死了（實測：第50關笨bot 7秒陣亡、只升到 Lv.1）。
  // 讓後期關卡的升級速度變快，玩家才有機會在關卡內把戰力拉到跟得上敵人的程度。
  const gxp=Math.round(((e.boss?4:e.xp)+(P.greed|0)) * (CUR().xpMul||1) * (P.metaXP||1));
  for(let k=0;k<(e.boss?18:1);k++)
    G.GEM.push({x:e.x+rnd(-14,14),y:e.y+rnd(-14,14),vx:rnd(-70,70),vy:rnd(-70,70),
                xp:gxp,hue:e.hue,r:5,wob:rnd(0,6.28)});
  if(!e.boss){
    if(P.chain && Math.random()<(P.chain>=2?0.6:0.3))    // 連鎖引爆
      igniteGoo(e.x,e.y,P.chain>=2?58:40,0);
    if(P.split && Math.random()<(P.split>=2?0.5:0.25)){  // 分裂軟糖
      const n=P.split>=2?5:3;
      for(let k=0;k<n;k++)
        shoot(e.x,e.y,k*6.283/n+rnd(0,1),380,10*P.dmgEff,5,300,{life:.5});
    }
    if(P.frenzy){                                        // 暴走糖
      P.frenzyKills++;
      const need=P.frenzy>=2?15:25;
      if(P.frenzyKills>=need){ P.frenzyKills=0;
        P.frenzyT=P.frenzy>=2?5:4; toast(T('tFrenzy'),'#ff9ad5'); SFX.evo(); }
    }
  }
  if(e.boom){ igniteGoo(e.x,e.y,72,0); damageArea(e.x,e.y,78,26*P.dmgEff,true); shake(4); }
  SFX.kill(clamp((e.x-P.x)/420,-1,1));
  if(e.boss){
    shake(12); hitstop(.3); SFX.bossDie();
    if(!G.E.some(o=>o.boss&&o!==e)) SFX.musicIntensity(0);
    if(G.boss===e) G.boss=G.E.find(o=>o.boss)||null;   // 仍有其他 Boss 就接手血條
    if(e.kind==='final'){ G.win=true; endGame(true); }
    else{                                   // 中期 Boss：補一顆愛心 + 直接送一張卡（節奏喘息點）
      if(G.P.hearts<G.P.maxHearts) G.P.hearts++;
      toast(T('tMidBoss'),'#ffd84f');
      // v0.9.13：改走跟 gainXP() 一樣的 pendingCards 佇列，而不是直接呼叫
      // showCards()——如果這時候玩家剛好也因為撿晶核同時跨等級、已經有卡片
      // 視窗開著，直接呼叫會把正在選的那組蓋掉，害玩家漏選一張。排進佇列
      // 就不會互相蓋掉，最多就是「多欠一張」，選完前面的自然會接著跳出來。
      setTimeout(()=>{
        if(!G||!G.running) return;
        G.pendingCards=(G.pendingCards||0)+1;
        if(cardsEl.classList.contains('hide')) showCards();
      },420);
    }
  }
}

//====================== 閃避 ======================
function tryDash(dx,dy){
  const P=G.P;
  if(P.dashCD>0||P.dashT>0||!G.running||G.paused) return;
  const m=Math.hypot(dx,dy)||1;
  P.dashDX=dx/m; P.dashDY=dy/m;
  P.dashT=.32; P.iframe=.42; P.dashCD=P.dashCDmax;
  burst(P.x,P.y,16,180,1.4); SFX.dash();
  IN.hist.length=0;
}

// 三心制：任何一次受擊都是扣一顆，靠慈悲無敵時間與衝刺來閃，而不是靠血厚
function hurtPlayer(){
  const P=G.P;
  if(P.iframe>0||!G.running) return false;
  if(P.shieldN>0){                              // 甜甜圈護盾先擋
    P.shieldN--; P.iframe=0.9; P.flash=.25; G.hurt=.55;
    shake(4); burst(P.x,P.y,18,195,1.3);
    pop(P.x,P.y-30,T('tShield'),'#8fd8ff',18); SFX.dash();
    return false;
  }
  P.hearts--; P.iframe=P.panic?2.1:1.45; P.flash=.3; G.hurt=1;
  if(P.panic) P.panicT=3.0;
  shake(8); hitstop(.07); SFX.hurt();
  burst(P.x,P.y,20,350,1.5);
  pop(P.x,P.y-30,'-♥','#ff5b7f',24);
  if(P.hearts<=0){
    P.hearts=0;
    // v0.9.17：重生蠟燭（永久強化）——愛心歸零時原地復活，每關限用買到的次數。
    // 這是局外成長最直接的「跨過打不過的關卡」手段：玩家卡關時，可以選擇去
    // 刷幣買復活，而不是只能一直撞牆。復活給滿血與較長的無敵時間，避免復活
    // 完馬上又被同一波彈幕打死（那樣等於白買）。
    if(G.revives>0){
      G.revives--;
      P.hearts=P.maxHearts; P.iframe=3.2; G.hurt=1;
      // 清掉場上所有敵彈，給玩家喘息的空間
      const n=G.EB.length; G.EB.length=0;
      for(let i=0;i<3;i++) G.SHOCK.push({x:P.x,y:P.y,r:10+i*26,spd:520-i*80,life:0.75,max:0.75,hue:[45,330,190][i]});
      burst(P.x,P.y,70,45,2.4); shake(16); hitstop(.18);
      toast(T('tRevive',G.revives),'#ffd84f'); SFX.evo();
      return false;
    }
    endGame(false); return true;
  }
  return false;
}

function rollCards(){
  const P=G.P, pool=[];
  for(const u of UPGRADES){
    if(u.w){
      const lv=P.wep[u.w];
      // 3 分鐘的局長度下，Lv.5 才能進化太慢 → Lv.4 就開放進化卡
      if(lv>=4 && !P.evo[u.w])
        pool.push({...u,evo:true,ic:EVOS[u.w].ic,n:EVOS[u.w].name,d:EVOS[u.w].desc});
      if(lv<5) pool.push({...u, lvl:lv});
    }else{
      const st=P[u.id]|0;                       // 目前層數
      if(st>=(u.max||1)) continue;              // 疊滿就不再出現
      pool.push({...u, stack:st, d: st>0&&u.d2 ? u.d2 : u.d});
    }
  }
  const out=[]; const cp=pool.slice();
  while(out.length<3&&cp.length){ out.push(cp.splice(Math.floor(Math.random()*cp.length),1)[0]); }
  return out;
}
const cardsEl=document.getElementById('cards');
// v0.9.16 修正：升級卡全部拿滿之後 rollCards() 會回傳空陣列，原本的程式碼還是
// 照樣把 G.paused 設成 true、把卡片視窗打開，但視窗裡一張卡都沒有 → 玩家永遠
// 點不到任何東西 → G.paused 永遠回不去 false → 整個遊戲永久凍結，只能強制關掉
// App，整局進度全部作廢。實測重現過：把所有升級疊滿後呼叫 gainXP(999)，
// 「卡片數 0 / 視窗開著 / G.paused=true / 2秒後 G.t 仍然是 0（完全停止）」。
// 有兩個獨立的觸發點都會走到這裡（gainXP() 的升級、以及中期 Boss 死亡送的獎勵卡），
// 所以防呆做在 showCards() 這個共同入口，兩條路徑一次修掉。
// 補償設計：已經無卡可選代表玩家已經全滿，這時候把欠的卡轉成愛心（沒滿才補）
// 與晶核，讓「升級」這件事不會變成完全沒有回饋。
function showCards(){
  const list=rollCards();
  if(!list.length){
    // 卡池已空：把還欠的卡清掉、關閉視窗、恢復遊戲，絕對不能停在暫停狀態
    const owed=Math.max(1,G.pendingCards|0);
    G.pendingCards=0;
    cardsEl.classList.add('hide');
    G.paused=false;
    const P=G.P;
    if(P.hearts<P.maxHearts){ P.hearts++; toast(T('tAllMaxHeart'),'#ff7aa2'); SFX.heal(); }
    else { gemBurst(P.x,P.y,12*owed); toast(T('tAllMaxGem'),'#ffd84f'); SFX.pickup(); }
    return;
  }
  G.paused=true;   // btnPause/btnNuke 的顯示都跟著 G.paused 走（見 drawHUD()），這裡不用另外管
  cardsEl.innerHTML='<div class="lvtitle">'+T('cardTitle',G.P.lv)+'</div>';
  for(const u of list){
    const el=document.createElement('div');
    el.className='card'+(u.evo?' evo':'');
    const lvTag = u.w ? (u.evo?'<div class="lv">'+T('evolve')+'</div>'
                        :'<div class="lv">'+(G.P.wep[u.w]===0?T('newWeapon'):T('lvTag',G.P.wep[u.w]+1))+'</div>')
                      : (u.stack>0?'<div class="lv">'+T('upgradeTag')+'</div>':'');
    el.innerHTML='<div class="ic">'+u.ic+'</div><div class="nm">'+u.n+'</div>'+lvTag+
                 '<div class="ds">'+u.d+'</div>';
    el.onclick=()=>applyCard(u);
    cardsEl.appendChild(el);
  }
  cardsEl.classList.remove('hide');
}
// v0.9.13 修正：原本選完一張卡就直接 G.paused=false 恢復遊戲，但 gainXP() 一次
// 跨好幾級的時候（例如一口氣撿到很多晶核、或磁力吸過來一堆），會在同一幀內連續
// 呼叫好幾次 showCards()，後面呼叫的每次都會整個蓋掉前一次的卡片內容——實測過：
// gainXP(500) 從 Lv.1 衝到 Lv.10（跨9級），showCards() 真的被呼叫了9次，但畫面
// 上永遠只看得到最後一次、只能選1張卡，前面8次的升級選擇整個消失，玩家完全
// 沒感覺到自己其實錯過了8張卡。改成用 G.pendingCards 記錄「還欠幾張卡」，選完
// 一張之後如果還有欠，馬上接著跳下一組選項，直到選滿為止才真的恢復遊戲。
function applyCard(u){
  const P=G.P;
  if(u.evo){ P.evo[u.w]=true; toast(u.n+'！','#ffd84f'); SFX.evo(); }
  else if(u.w){ P.wep[u.w]=Math.min(5,P.wep[u.w]+1); SFX.level(); }
  else { u.f(P); SFX.level(); }
  if(G.pendingCards>0) G.pendingCards--;
  if(G.pendingCards>0) showCards();               // 還欠卡：直接接著跳下一組，不恢復遊戲
  else { cardsEl.classList.add('hide'); G.paused=false; }
}
function gainXP(n){
  const P=G.P; P.xp+=n;
  let leveled=false;
  while(P.xp>=P.xpNext){
    P.xp-=P.xpNext; P.lv++;
    P.xpNext=Math.round(6+P.lv*5.5+P.lv*P.lv*0.5);   // 放慢升級速度（原本 3 分鐘會衝到 Lv.20+）
    G.pendingCards=(G.pendingCards||0)+1;
    leveled=true;
  }
  // gainXP() 常常在同一幀被連續呼叫很多次（一顆晶核一次），所以不能在 while 迴圈
  // 裡面就直接開卡片視窗——只有「目前沒有卡片視窗開著」時才觸發一次，實際要選
  // 幾張卡完全交給 G.pendingCards／applyCard() 那條鏈路自己跑完。
  if(leveled && cardsEl.classList.contains('hide')) showCards();
}

function loadSave(){
  try{
    const raw=localStorage.getItem(PROG_KEY);
    if(raw){
      const o=JSON.parse(raw);
      PROGRESS=+o.progress||1; COINS=Math.max(0,+o.coins||0); META=o.meta||{};
      if(o.lang && L10N[o.lang]) LANG=o.lang;              // 玩家選過的語言優先
      else LANG=detectLang();
    }else{
      // 從舊版（純數字）存檔遷移：保留破關進度，糖果幣從 0 開始
      const old=localStorage.getItem(OLD_PROG_KEY);
      if(old){ PROGRESS=+old||1; COINS=0; META={}; LANG=detectLang(); saveGame(); }
      else LANG=detectLang();
    }
    localStorage.removeItem('gooblaster_progress');   // 清掉更早的殘留
  }catch(e){}
}
function clampProgress(){ PROGRESS=Math.max(1,Math.min(Math.round(PROGRESS)||1,LEVELS.length+1)); }

// 一局結束能拿多少糖果幣。刻意設計成「死掉也給」——roguelite 的留存迴圈就是
// 每一次失敗都要有進度，不然難關就變成一堵完全的牆。通關有額外獎勵，關卡越
// 後面基礎值越高（否則玩家會發現刷第 1 關最有效率，那會毀掉整個進程設計）。
function runCoins(win, lvIdx, kills, tSurvived, dur){
  // ⚠ 擊殺數對糖果幣一定要「次線性」（開 0.62 次方），不能線性。第一版用
  // kills*0.55 線性計算，實測第50關通關一場就給 7376 幣——佔買滿全部強化
  // 總成本（8930）的 83%，等於玩家一旦打得動後期關卡，商店就瞬間全滿、
  // 整個進程設計直接崩掉。後期關卡的擊殺數本來就是前期的幾十倍，線性換算
  // 必然爆炸。再加一個每局上限 520，確保單場收益不會失控。
  const lvBonus = 1 + lvIdx*0.025;                   // 關卡越後面給越多，但幅度要小
  const base = Math.pow(Math.max(0,kills),0.62)*2.4 + (tSurvived/Math.max(1,dur))*55;
  const winMul = win ? 1.55 : 1.0;                   // 通關有獎勵，但死掉也一定有收穫
  const meta = 1 + metaLv('coin')*0.15;              // 糖幣獵人
  return Math.max(3, Math.min(520, Math.round(base*lvBonus*winMul*meta)));
}

// 依關卡縮放出波次表：時間軸按關卡長度壓縮，敵種只留該關解鎖的
function buildWaves(L){
  const k=L.dur/180;
  return WAVES.map(w=>{
    const mix={}; let sum=0;
    for(const t in w.mix) if(L.types.includes(t)){ mix[t]=w.mix[t]; sum+=w.mix[t]; }
    if(sum<=0){ mix[L.types[0]]=1; sum=1; }
    for(const t in mix) mix[t]/=sum;
    // 敵種少的關卡，後段容易變成清一色某一種怪 → 保留一定比例的軟泥當底
    if(L.types.length<=2 && L.types.includes('slime')){
      for(const t in mix) mix[t]*=0.7;
      mix.slime=(mix.slime||0)+0.3;
    }
    return {t:Math.round(w.t*k), mix, rate:w.rate*L.rate, mult:w.mult*L.hp};
  });
}

function buildBosses(L){
  const at = L.nboss===1?[0.62] : L.nboss===2?[0.40,0.80] : [0.22,0.53,0.84];
  const bosses = at.map((f,i)=>{
    const b=BOSS_POOL[L.nboss===1?0:i];
    return {...b,
      t: Math.round(L.dur*f),
      hp: Math.round(b.hp*L.bossHp),
      spd: b.spd*L.espd,
      bspd: b.bspd*L.bspd,
      atkT: b.atkT*L.atkSlow,
      kind: (!L.superBoss && i===at.length-1) ? 'final' : ('b'+(i+1))
    };
  });
  if(L.superBoss){
    const b=BOSS_CHAPTER[L.bossChapter||0];
    bosses.push({...b,
      t: Math.round(L.dur*0.93),
      hp: Math.round(b.hp*L.bossHp*1.6),
      spd: b.spd*L.espd,
      bspd: b.bspd*L.bspd,
      atkT: b.atkT*L.atkSlow,
      kind:'final', superBoss:true
    });
  }
  return bosses;
}

// ── v0.9.14：第 11~100 關產生器 ─────────────────────────────────────────
// 前 10 關（第 1 章）維持手動調校、跑過大量笨bot測試的數值不動。第 2~10 章
// （第 11~100 關，共 90 關）改用公式生成：90 關全部手打數字風險太高（容易
// 手滑打錯、難度曲線不連續），改成以「第10關」的數值當基準往上疊倍率。
// 章節內採用跟原本 10 關版一樣的鋸齒節奏：章節開頭比上一章頂點回落 7%，
// 章節內線性爬升到章節末（第10/20/.../100關）的大 Boss 關，粒度從
// docs/02 原設計的「2關一層」放大成「10關一章」，精神不變。
// espd（敵人移動速度）跟 bspd（子彈速度）刻意設上限：速度只要能閃、後面
// 再快也只是變成「看不到、躲不掉」，不是有意義的難度；真正的難度加壓
// 交給 hp／bossHp（打更久、Boss 更肉）跟 rate／dur（出怪更密、關卡更長）、
// atkSlow（Boss攻擊冷卻更短）。
// ── v0.9.16 重做難度曲線 ────────────────────────────────────────────────
// v0.9.14 的公式是 peakMul(c)=1+c*0.30+c*c*0.028，第100關的倍率會衝到 5.97，
// 換算成「敵人壓力」（血量倍率 × 出怪率）是第1關的 570 倍。但玩家的戰力成長
// 上限（從 Lv.1 練到滿等滿裝）大概只有 20~30 倍，而且每一關都從 Lv.1 重來——
// 兩邊差了一個數量級，所以第10關之後實質上打不過（實測：滿等滿裝在第100關
// 只撐 9 秒、笨bot在第50關只撐 7 秒且升不到 Lv.2）。
// 這次的修正是三管齊下，缺一不可：
//   ① 敵人成長大幅放緩：peakMul 改成線性 1+c*0.17（第100關倍率 2.53，壓力約 100 倍）
//   ② 起始裝備隨章節提升（startWep）：後期關卡不再從一把 Lv.1 水槍開始
//   ③ 經驗值倍率隨章節提升（xpMul）：關卡內的升級速度跟得上敵人的成長
// 第 1~10 關完全不受影響（這個函式只生成第 11 關之後的關卡）。
(function genExtraLevels(){
  const base=LEVELS[9];              // 第10關（chapter 0 頂點）當基準
  const peakMul=c=>1+c*0.17;         // 章節 c 結尾（大Boss關）的倍率頂點（v0.9.16 放緩）
  // 各章節的起始武器配置：越後面的章節，開局就有越完整的武器組合。
  //
  // ⚠ v0.9.20 重要修正：主武器（bubble）的等級一律壓在 2，不再隨章節往上加。
  // 原因：永久強化「愛用武器」是加在 bubble 上、最多 +3 級，而武器等級上限是 5。
  // 舊表在後期章節直接把 bubble 給到 4~5，等於**把永久強化的額度事先吃光**——
  // 實測第 91~100 關買滿「愛用武器」（總價 1070 糖果幣）獲得的等級是 +0，
  // 100 關裡約 40 關的購買價值被吃掉。玩家花了代價卻沒有對等回饋，
  // 而糖果幣系統正是未來付費解鎖的載體，這種「買了沒用」會直接毀掉信任感。
  //
  // 現在 bubble 固定 2，永遠留給永久強化完整的 3 級空間（2+3=5 正好滿級）。
  // 開局戰力的差額改用副武器（graffiti/yoyo）補回來——它們不受這項永久強化影響，
  // 所以不會再有互相吃額度的問題，而且開局就有多把武器，手感也更豐富。
  // 各章節的武器總等級刻意維持跟舊表幾乎相同（見下方註記），避免動到難度曲線。
  const START_WEP=[
    null,                                    // c=0：第1~10關，維持原本的 {bubble:1}
    {bubble:2},                              // c=1：第11~20關   總計 2（舊 2）
    {bubble:2,graffiti:1},                   // c=2              總計 3（舊 3）
    {bubble:2,graffiti:2},                   // c=3              總計 4（舊 4）
    {bubble:2,graffiti:2,yoyo:2},            // c=4              總計 6（舊 6）
    {bubble:2,graffiti:3,yoyo:2},            // c=5              總計 7（舊 7）
    {bubble:2,graffiti:4,yoyo:3},            // c=6              總計 9（舊 9）
    {bubble:2,graffiti:4,yoyo:4},            // c=7              總計 10（舊 10）
    {bubble:2,graffiti:5,yoyo:4},            // c=8              總計 11（舊 11）
    {bubble:2,graffiti:5,yoyo:5}             // c=9：第91~100關  總計 12（舊 13，差 1）
  ];
  for(let c=1;c<=9;c++){
    const pk=peakMul(c), st=peakMul(c-1)*0.93;   // st：本章開頭＝上一章頂點回落7%
    for(let p=0;p<10;p++){
      const lvlNum=c*10+p+1;         // 第幾關（1-based）
      const f=p/9;                   // 章節內進度 0~1，線性內插 st→pk
      const mul=st+(pk-st)*f;
      const isBoss=p===9, isOpener=p===0;
      LEVELS.push({
        tier: 4+c,                      // 第2~10章對應 tier 5~13
        n:'',                            // 顯示名稱由 applyLanguage() 依語言填入
        idxInCh: p+1,                    // 章節內第幾關（產生名稱用）
        dur: Math.min(323, Math.round(215+Math.log2(lvlNum/10)*42)),
        hearts:3,
        rate: Math.min(6.0, +(base.rate*mul).toFixed(3)),
        hp: +(base.hp*mul).toFixed(3),
        espd: Math.min(1.85, +(base.espd*mul).toFixed(3)),
        bossHp: +(base.bossHp*mul).toFixed(3),
        nboss: 3,
        types: ['slime','bunny','drone','bomber'],
        bspd: Math.min(2.3, +(base.bspd*mul).toFixed(3)),
        // v0.9.16：atkSlow 乘在「每一隻普通敵人」的開火冷卻上（見約 1968 行
        // e.shootCD=rnd(cdMin,cdMax)*CUR().atkSlow），不是只影響 Boss。
        // v0.9.14 用 base.atkSlow/mul 讓它一路掉到下限 0.35，等於每隻怪的開火
        // 速度變成第10關的 2.3 倍——再乘上敵人數量也翻倍，彈幕密度是「相乘」的，
        // 這才是後期關卡真正的殺手（實測滿等滿裝在第100關也只撐 16.6%）。
        // 改成隨章節「微幅」加快即可，密度的成長交給敵人數量與血量去做。
        atkSlow: +Math.max(0.62, base.atkSlow-c*0.02).toFixed(3),
        chest: Math.min(32, 17+Math.floor((lvlNum-10)/3)),
        // v0.9.16：上限從 260 砍到 150。260 隻怪在 390px 寬的手機螢幕上本來就
        // 擠成一團看不清楚，而且同時是 O(n²) 敵人分離迴圈的效能引爆點
        // （實測第100關塞滿 260 隻時，中階手機只剩 12fps）。砍到 150 同時
        // 解決「彈幕太密打不過」與「後期會掉幀」兩個問題。
        maxE: Math.min(150, 130+Math.floor((lvlNum-10)*0.42)),
        startWep: START_WEP[c],
        xpMul: +(1+c*0.55).toFixed(2),   // 第11關起 1.55 倍，第100關 5.95 倍
        d:'', kind: isBoss?'boss':(isOpener?'opener':'mid'), ch:c,   // 描述同樣交給 applyLanguage()
        superBoss: isBoss,
        ...(isBoss?{bossChapter:c}:{})
      });
    }
  }
})();

// ⚠ 一定要等 genExtraLevels() 跑完才能讀存檔：loadSave() 遷移舊存檔時會呼叫
// saveGame() → clampProgress()，而 clampProgress() 是用 LEVELS.length 當上限。
// 如果在關卡生成之前讀檔，LEVELS 還只有 10 筆，破關到第 50 關的玩家會被夾成 11。
// v0.9.19：把目前語言的文字「就地寫回」所有資料表與 HTML。
// 之所以用就地改寫而不是到處包 T()，是因為顯示這些欄位的程式碼散落在幾十個地方
// （卡片、HUD、商店、戰報、銀河圖…），逐一改動風險高；改寫來源欄位則只有這一個進入點。
function applyLanguage(code){
  if(code) LANG=code;
  // 武器與進化
  const wk={bubble:'w_bubble',graffiti:'w_graffiti',yoyo:'w_yoyo'};
  for(const k in wk) WEAPONS[k].name=T(wk[k]+'_n');
  const ek={bubble:'e_bubble',graffiti:'e_graffiti',yoyo:'e_yoyo'};
  for(const k in ek){ EVOS[k].name=T(ek[k]+'_n'); EVOS[k].desc=T(ek[k]+'_d'); }
  // 升級卡
  for(const u of UPGRADES){
    if(u.w){ u.n=WEAPONS[u.w].name; u.d=WEAPONS[u.w].desc(Math.max(1,(G&&G.P?G.P.wep[u.w]:1))); continue; }
    u.n=T('u_'+u.id+'_n'); u.d=T('u_'+u.id+'_d');
    const k2='u_'+u.id+'_d2';
    if(L10N.en[k2]!==undefined) u.d2=T(k2);
  }
  // 永久強化（描述是「下一級會變成什麼」的函式，數字照算、只換文字）
  const MD={hearts:n=>[n+1,3+n+1], dmg:n=>[(n+1)*10], aspd:n=>[(n+1)*8], wep:n=>[n+1],
            range:n=>[(n+1)*90], xp:n=>[(n+1)*12], pickup:n=>[(n+1)*45],
            dash:n=>[((n+1)*0.35).toFixed(2)], revive:n=>[n+1], coin:n=>[(n+1)*15]};
  for(const m of META_UPGRADES){
    m.n=T('m_'+m.id+'_n');
    const f=MD[m.id];
    m.d=(n)=>T.apply(null,['m_'+m.id+'_d'].concat(f(n)));
  }
  // Boss
  BOSS_POOL.forEach((b,i)=>{ b.name=T('b'+(i+1)); });
  BOSS_CHAPTER.forEach((b,i)=>{ b.name=T('sb'+i); });
  // 寶箱
  for(const c of CHEST_TYPES) c.n=T('c_'+c.id+'_n');
  // 關卡：前 10 關是手寫的，第 11 關之後用樣板組出來
  LEVELS.forEach((L,i)=>{
    if(i<10){ L.n=T('lv'+(i+1)+'n'); L.d=T('lv'+(i+1)+'d'); return; }
    const chName=T('tier'+L.tier);
    if(L.kind==='boss'){
      L.n=T('genBossName',chName,BOSS_CHAPTER[L.bossChapter||0].name);
      L.d=T('genDescBoss',L.ch+1,BOSS_CHAPTER[L.bossChapter||0].name);
    }else{
      L.n=T('genName',chName,L.idxInCh);
      L.d=(L.kind==='opener')?T('genDescOpener',chName):T('genDescMid',chName);
    }
  });
  // HTML 靜態文字
  const setTxt=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};
  setTxt('btnShopBack',T('back')); setTxt('btnResetCancel',T('cancel'));
  setTxt('btnResetConfirm',T('resetOk')); setTxt('btnReset',T('resetBtn'));
  setTxt('btnResume',T('resume')); setTxt('btnQuitToMenu',T('toMenu'));
  setTxt('btnNext',T('next')); setTxt('btnAgain',T('again'));
  setTxt('btnSave',T('saveShot')); setTxt('btnMenu',T('toMenu'));
  const q=(sel,v)=>{const e=document.querySelector(sel); if(e) e.textContent=v;};
  q('#confirmBox .msg',T('resetQ')); q('#confirmBox .sub2',T('resetSub'));
  q('#pauseOverlay .msg',T('pauseMsg'));
  q('#shop h1',T('shopTitle')); q('#shopHint',T('shopHint'));
  q('#cards .lvtitle',T('cardTitle',1));
  const bs=document.getElementById('btnShop');
  if(bs) bs.innerHTML='🍬 '+T('shop')+' <span id="coinTag">'+Math.round(COINS)+'</span>';
  document.documentElement.lang=LANG;
}

function updateSpawn(dt){
  const L=CUR();
  let w=G.waves[0];
  for(const x of G.waves) if(G.t>=x.t) w=x;
  // Boss 出場預告：出場前 5 秒開始閃紅倒數。每幀重算、不存狀態，
  // 跟搖桿判定一樣的無狀態哲學——漏一幀不會卡死，下一幀自己就對了。
  const prevWarnT=G.bossWarnT;
  G.bossWarnT=-1; G.bossWarnName='';
  for(let i=0;i<G.bosses.length;i++){
    if(G.bossDone[i]) continue;
    const rem=G.bosses[i].t-G.t;
    if(rem>0 && rem<=5){ G.bossWarnT=rem; G.bossWarnName=G.bosses[i].name; break; }
  }
  // v0.9.12：畫面上原本就有「⚠ BOSS即將出現」的倒數數字，但完全沒有配聲音。
  // 倒數視窗剛開始的那一幀響一聲警報，之後倒數數字每跳一次整數秒（5,4,3,2,1）
  // 補一聲短「嗶」，讓玩家不用一直盯著畫面看數字也能感覺到「快來了」。
  // bossWarnT 本身是無狀態、每幀重算的（見上），所以判斷「剛進入警示視窗」
  // 只能用「上一幀 vs 這一幀」的邊界比對，不能存一個「有沒有響過」的旗標，
  // 否則同一隻 Boss 的警示視窗結束後，旗標忘記重置的話下次就永遠不會再響。
  if(G.bossWarnT>=0 && prevWarnT<0){ SFX.bossWarn(); G._bwSec=Math.ceil(G.bossWarnT); }
  else if(G.bossWarnT>=0){
    const sec=Math.ceil(G.bossWarnT);
    if(sec<G._bwSec){ G._bwSec=sec; SFX.bossWarnTick(); }
  }
  for(let i=0;i<G.bosses.length;i++)
    if(!G.bossDone[i] && G.t>=G.bosses[i].t){ G.bossDone[i]=true; spawnBoss(G.bosses[i]); }
  const rate = G.boss ? w.rate*0.35 : w.rate;
  G.spawnAcc+=dt*rate;
  while(G.spawnAcc>=1){
    G.spawnAcc-=1;
    if(G.E.length>L.maxE) break;
    const r=Math.random(); let acc=0,t='slime';
    for(const k in w.mix){ acc+=w.mix[k]; if(r<=acc){t=k;break;} }
    spawnEnemy(t,w.mult);
  }
}


//====================== 可愛寶箱（鼓勵玩家跑動）======================
// 一定生成在距離玩家 420px 以外，並在螢幕邊緣顯示方向箭頭。
// 目的是把玩家從「原地繞小圈」拉出去，讓整張場地都被使用。
const CHEST_TYPES=[
  {id:'heart', ic:'💖', n:'愛心糖',  c:'#ff7aa2', hue:340,
   go(P){ if(P.hearts<P.maxHearts){ P.hearts++; return T('c_heart_go'); }
          gemBurst(P.x,P.y,22); return T('c_heart_full'); }},
  {id:'nuke',  ic:'🍬', n:'糖果雨',  c:'#8fe8ff', hue:195,
   go(P){ const n=G.EB.length; G.EB.length=0;
          // v0.9.13 修正：同一個「邊迭代邊刪除 G.E 會跳過元素」的問題，這個寶箱
          // 是最容易踩到的地方之一——140點傷害通常直接打死一票雜兵，改成倒著跑
          // 的索引迴圈，才能真的做到「所有非Boss敵人」都受傷，不會漏掉一半。
          for(let i=G.E.length-1;i>=0;i--){ const e=G.E[i]; if(e&&!e.boss) hurtEnemy(e,140*P.dmgEff,false); }
          burst(P.x,P.y,44,195,2.2); return T('c_nuke_go',n); }},
  {id:'speed', ic:'⚡', n:'閃電糖',  c:'#ffd23f', hue:50,
   go(P){ P.frenzyT=Math.max(P.frenzyT,9); return T('c_speed_go'); }},
  {id:'rain',  ic:'🌈', n:'彩虹糖',  c:'#b79dff', hue:280,
   go(P){ P.rainbowT=Math.max(P.rainbowT,7); return T('c_rain_go'); }},
  {id:'gold',  ic:'💰', n:'金幣糖',  c:'#ffc93f', hue:45,
   go(P){ gemBurst(P.x,P.y,34); return T('c_gold_go'); }},
  {id:'ice',   ic:'🧊', n:'冰晶糖',  c:'#9fe4ff', hue:200,
   go(P){ let n=0; for(const e of G.E) if(!e.boss){ e.frozen=4.0; e.slowT=4.0; n++; }
          burst(P.x,P.y,40,200,2); return T('c_ice_go',n); }},
  {id:'fire',  ic:'🔥', n:'火焰糖',  c:'#ff9a4f', hue:25,
   go(P){ let n=0; for(const g of G.GOO.slice()){ if(g.burn<=0){ igniteGoo(g.x,g.y,g.r,2); n++; } }
          return T('c_fire_go'); }},
  // v0.9.5 新增：寶箱內容改成偏向攻擊向輔助。維持「即時性效果、過了就沒了」的
  // 風格（使用者已確認），不做成永久數值加成，避免跟 17 張機制型升級卡的
  // 定位（docs/02 第一節：升級卡全部是機制型、不是純數值百分比）互相打架。
  {id:'power', ic:'💥', n:'猛攻糖',  c:'#ff5b6b', hue:355,
   go(P){ P.chestDmgT=Math.max(P.chestDmgT,8); return T('c_power_go'); }}
];
// 攻擊向的兩種（閃電糖=攻速、猛攻糖=攻擊力）在池子裡放比較多份，讓寶箱整體
// 「以攻擊向輔助為主」，但仍保留其他效果、不要讓寶箱變成單一套路。
// v0.9.8：愛心糖權重調低（使用者反映出現太頻繁）。愛心上限已經固定在 3 顆，
// 補血的重要性比以前低，改成只放 1 份權重（原本跟其他效果一樣是 1 份，
// 但分母變大所以相對機率被稀釋），讓其他即時性效果的出現機會相對提高。
const CHEST_POOL=(()=>{
  const byId=id=>CHEST_TYPES.find(t=>t.id===id);
  return [
    byId('heart'),
    byId('nuke'), byId('nuke'),
    byId('rain'), byId('rain'),
    byId('gold'), byId('gold'),
    byId('ice'),  byId('ice'),
    byId('fire'), byId('fire'),
    byId('speed'), byId('speed'), byId('speed'),
    byId('power'), byId('power'), byId('power')
  ];
})();
function gemBurst(x,y,n){
  for(let i=0;i<n;i++){ const a=rnd(0,6.283),d=rnd(20,90);
    G.GEM.push({x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,vx:Math.cos(a)*120,vy:Math.sin(a)*120,
                xp:Math.round((2+(G.P.greed|0))*(CUR().xpMul||1)*(G.P.metaXP||1)),hue:45,r:5,wob:rnd(0,6.28)}); }
}
function spawnChest(){
  const P=G.P;
  for(let k=0;k<24;k++){
    const a=rnd(0,6.283), d=rnd(430,700);
    const x=P.x+Math.cos(a)*d, y=P.y+Math.sin(a)*d;
    if(Math.hypot(x,y)>ARENA-100) continue;
    G.CHEST.push({x,y,life:18,max:18,wob:rnd(0,6.28),pop:0,type:pick(CHEST_POOL)});
    toast(T('tChest'),'#ffd84f'); SFX.heal();
    return true;
  }
  return false;
}
function updateChests(dt){
  const P=G.P;
  G.chestT-=dt;
  if(G.chestT<=0 && G.CHEST.length<2){
    // v0.9.5：出現頻率降低（原本 rnd(0.85,1.25) 倍間隔，改成再乘 1.4 拉長間隔），
    // 使用者要求「注意平衡、不要一次加太多讓遊戲變太簡單」
    G.chestT = G.L.chest*1.4*rnd(0.85,1.25);
    spawnChest();
  }
  for(let i=G.CHEST.length-1;i>=0;i--){
    const c=G.CHEST[i]; c.life-=dt; c.wob+=dt*3;
    if(c.life<=0){ G.CHEST.splice(i,1); continue; }
    if(dist2(c.x,c.y,P.x,P.y) < 40*40){
      const msg=c.type.go(P);
      G.CHEST.splice(i,1); G.chests++;
      toast(c.type.n+' · '+msg, c.type.c);
      pop(P.x,P.y-46,c.type.ic,'#fff',34);
      burst(c.x,c.y,34,c.type.hue,1.8);
      shake(4); SFX.evo();
    }
  }
}
// v0.9.10：核彈補給——整關限定出現一次，撿到之前不會過期（不像寶箱會消失），
// 撿到後不會立刻生效，收進「庫存」讓玩家自己選時機按左下角圖示引爆。
function updateNuke(dt){
  const P=G.P;
  if(!G.nukeSpawned && G.t>=G.nukeSpawnAt){
    G.nukeSpawned=true;
    for(let k=0;k<24;k++){
      const a=rnd(0,6.283), d=rnd(380,650);
      const x=P.x+Math.cos(a)*d, y=P.y+Math.sin(a)*d;
      if(Math.hypot(x,y)>ARENA-100) continue;
      G.NUKE={x,y,wob:rnd(0,6.28)};
      toast(T('tNukeDrop'),'#ff9a4f'); SFX.heal();
      break;
    }
  }
  if(G.NUKE){
    G.NUKE.wob+=dt*3;
    if(dist2(G.NUKE.x,G.NUKE.y,P.x,P.y) < 40*40){
      P.nukeHeld=true; G.NUKE=null;
      toast(T('tNukeGet'),'#ff9a4f');
      pop(P.x,P.y-46,'☢️','#fff',34);
      burst(P.x,P.y,34,25,1.8);
      shake(4); SFX.evo();
    }
  }
}
function drawChests(){
  for(const c of G.CHEST){
    const bob=Math.sin(c.wob)*4, s=26, x=c.x, y=c.y+bob;
    const blink = c.life<4 ? (0.35+0.65*Math.abs(Math.sin(c.life*9))) : 1;
    ctx.globalAlpha=blink;
    // 光暈
    ctx.fillStyle='hsla('+c.type.hue+',95%,60%,.20)';
    ctx.beginPath(); ctx.arc(x,y,s*1.9+Math.sin(c.wob*1.7)*3,0,6.283); ctx.fill();
    // 箱身（圓角）
    ctx.fillStyle=c.type.c;
    roundRect(x-s*0.78,y-s*0.34,s*1.56,s*0.98,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=2.5; ctx.stroke();
    // 蓋子
    ctx.fillStyle='hsl('+c.type.hue+',85%,72%)';
    roundRect(x-s*0.88,y-s*0.72,s*1.76,s*0.44,6); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2.2; ctx.stroke();
    // 蝴蝶結
    ctx.fillStyle='#fff6d6';
    ctx.beginPath(); ctx.arc(x-s*0.20,y-s*0.80,s*0.20,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(x+s*0.20,y-s*0.80,s*0.20,0,6.283); ctx.fill();
    ctx.fillStyle='#ffd23f';
    ctx.fillRect(x-s*0.10,y-s*0.74,s*0.20,s*1.36);
    ctx.beginPath(); ctx.arc(x,y-s*0.80,s*0.11,0,6.283); ctx.fill();
    // 圖示
    ctx.font='900 '+Math.round(s*0.8)+'px system-ui'; ctx.textAlign='center';
    ctx.fillText(c.type.ic,x,y+s*0.42);
    // 剩餘時間環
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x,y,s*1.35,-1.5708,-1.5708+6.283*(c.life/c.max)); ctx.stroke();
    ctx.globalAlpha=1;
  }
}
// 寶箱在畫面外時，邊緣顯示可愛箭頭 —— 這是「叫玩家跑過去」的主要提示
function drawChestArrows(){
  for(const c of G.CHEST){
    const sx=c.x-G.cam.x+W/2, sy=c.y-G.cam.y+H/2, m=52;
    if(sx>m&&sx<W-m&&sy>m&&sy<H-m) continue;
    const ax=clamp(sx,m,W-m), ay=clamp(sy,m,H-m);
    const a=Math.atan2(sy-H/2,sx-W/2);
    const pulse=0.6+0.4*Math.sin(G.t*5);
    ctx.save(); ctx.translate(ax,ay);
    ctx.fillStyle='hsla('+c.type.hue+',95%,62%,'+(0.55+pulse*0.35)+')';
    ctx.beginPath(); ctx.arc(0,0,20,0,6.283); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    ctx.font='900 17px system-ui'; ctx.textAlign='center'; ctx.fillStyle='#fff';
    ctx.fillText(c.type.ic,0,6);
    ctx.rotate(a);
    ctx.fillStyle='hsla('+c.type.hue+',95%,70%,'+(0.6+pulse*0.4)+')';
    ctx.beginPath(); ctx.moveTo(30,0); ctx.lineTo(19,8); ctx.lineTo(19,-8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
