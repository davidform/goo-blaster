//====================== 更新 ======================
let lastT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min((now-lastT)/1000,.05); lastT=now;
  if(G&&G.hurt>0) G.hurt=Math.max(0,G.hurt-dt*6.5);   // 受擊紅閃：約 0.15 秒衰減完，用真實時間不受慢動作影響
  if(G&&G.nukeFlash>0) G.nukeFlash=Math.max(0,G.nukeFlash-dt*3.3);  // 核彈全螢幕閃光：約 0.3 秒衰減完
  if(BTNPRESS>0) BTNPRESS-=dt;
  if(G&&G.running&&!G.paused){
    if(G.hitstop>0){ G.hitstop-=dt; }
    else{
      const scale = G.slowmo>0 ? .32 : 1;
      if(G.slowmo>0) G.slowmo-=dt;
      update(dt*scale, dt);
    }
  }
  if(G) updateFW(dt);
  if(G) draw();
}
// 等級越高，整場模擬跑得越快（關卡時鐘仍走真實時間，倒數不會作弊）
function speedScale(){ return 1+Math.min(.60,(G.P.lv-1)*.035); }
// 果凍覆蓋率 = 果凍實際面積佔一個螢幕的比例，並轉成傷害加成（最多 +30%）
function gooPct(){ return Math.round(clamp(G.gooArea/(W*H),0,1)*100); }
function gooBonus(){ return 1+gooPct()/100*0.30; }

function update(dt,rawdt){
  const P=G.P;
  G.t+=rawdt;                       // 關卡時鐘 = 真實時間
  dt*=speedScale();                 // 遊戲節奏隨等級加快
  // 有效傷害＝基礎 × 果凍覆蓋加成 × 滿心怒氣 × 寶箱猛攻糖（暫時性，不是永久數值卡）
  P.dmgEff = P.dmg * gooBonus() * (P.rage&&P.hearts>=P.maxHearts ? 1.45 : 1) * (P.chestDmgT>0?1.4:1);
  if(P.chestDmgT>0) P.chestDmgT-=dt;

  //--- 玩家移動
  if(P.dashT>0){
    const wasDashing=true;
    P.dashT-=dt;
    P.x+=P.dashDX*(P.cd>=2?880:760)*dt; P.y+=P.dashDY*(P.cd>=2?880:760)*dt;
    if(Math.random()<.6) G.PT.push({x:P.x,y:P.y,vx:0,vy:0,r:11,hue:175,life:.3,max:.3});
    if(wasDashing&&P.dashT<=0&&P.freeze){        // 冰糖翻滾：衝刺結束凍結周圍
      let n=0;
      for(const e of G.E) if(!e.boss&&dist2(e.x,e.y,P.x,P.y)<150*150){ e.frozen=1.6; e.slowT=1.6; n++; }
      if(n){ burst(P.x,P.y,26,195,1.6); shake(3); toast('冰凍！','#8fe8ff'); SFX.heal(); }
    }
  }else{
    // 觸控搖桿 或 鍵盤
    let mx=0,my=0,mag=0;
    if(IN.active&&IN.mag>0.06){ mx=IN.dx; my=IN.dy; mag=IN.mag; }
    else{ const kx=KDX(),ky=KDY(),km=Math.hypot(kx,ky);
          if(km>0){ mx=kx/km; my=ky/km; mag=1; } }
    P.onGoo=0; P.mvx=mx; P.mvy=my; P.moving=mag;
    if(mag>0){
      let sp=P.spd*mag;
      if(P.panicT>0) sp*=1.75;                     // 急救棒棒糖：受傷後的逃命窗口
      for(const g of G.GOO) if(dist2(P.x,P.y,g.x,g.y)<g.r*g.r){ sp*=1.45; P.onGoo=g.hue; break; }
      P.x+=mx*sp*dt; P.y+=my*sp*dt; G.hasMoved=true;
      // 移動拖尾：讓「我正在移動」這件事被看見
      if(Math.random()<(P.onGoo!==0?.55:.32))
        G.PT.push({x:P.x-mx*12,y:P.y-my*12,vx:-mx*70,vy:-my*70,
                   r:rnd(3,P.onGoo!==0?7:5),hue:P.onGoo!==0?P.onGoo:175,life:.3,max:.3});
    }
  }
  const pd=Math.hypot(P.x,P.y);
  if(pd>ARENA){ P.x=P.x/pd*ARENA; P.y=P.y/pd*ARENA; }
  if(P.dashCD>0)P.dashCD-=dt;
  if(P.iframe>0)P.iframe-=dt;
  if(P.flash>0)P.flash-=dt;
  if(P.regen>0){                                  // 軟糖再生：定時補一顆愛心
    P.regenT+=dt;
    const iv=P.regen>=2?25:40;
    if(P.regenT>=iv){ P.regenT=0;
      if(P.hearts<P.maxHearts){ P.hearts++; pop(P.x,P.y-34,'+♥','#7ef7c0',24); SFX.heal(); } }
  }
  if(P.shield>0){                                 // 甜甜圈護盾
    const cap=P.shield>=2?2:1, iv=P.shield>=2?10:18;
    P.shieldT+=dt;
    if(P.shieldT>=iv){ P.shieldT=0;
      if(P.shieldN<cap){ P.shieldN++; pop(P.x,P.y-34,'護盾','#8fd8ff',18); SFX.heal(); } }
  }
  if(P.rainbowT>0){ P.rainbowT-=dt; P.iframe=Math.max(P.iframe,0.25); }   // 彩虹糖無敵
  if(P.frenzyT>0) P.frenzyT-=dt;                  // 暴走糖
  if(P.panicT>0) P.panicT-=dt;                    // 急救棒棒糖

  //--- 開火
  for(const k in P.wep){
    const lv=P.wep[k]; if(lv<=0)continue;
    const Wp=WEAPONS[k];
    P._cd=P._cd||{}; P._cd[k]=(P._cd[k]||0)-dt;
    if(P._cd[k]<=0){
      const fren=P.frenzyT>0?2:1;
      P._cd[k]=Math.max(.05,Wp.cd(lv)/(P.atkSpd*fren));
      Wp.fire(P,lv);
      const tg=nearest(P.x,P.y,900);
      SFX.shoot(k, tg?clamp((tg.x-P.x)/420,-1,1):0);
      if(P.evo[k]) evoFire(k,lv);
    }
  }

  updateSpawn(dt);
  updateChests(dt);
  updateNuke(dt);

  //--- 敵人
  for(let i=G.E.length-1;i>=0;i--){
    const e=G.E[i];
    // 迴圈中途可能有範圍傷害（damageArea，例如自爆怪死亡的爆炸）連續 splice 掉
    // 好幾隻怪，讓陣列在這個迴圈跑到一半就變短，此時 i 可能已經超出新長度 → e 是 undefined。
    // 這是實測跑出來的真實當機（PAGEERROR: Cannot read properties of undefined (reading 'flash')），
    // 不是猜測。防呆：這種情況直接跳過，不影響其他敵人的處理。
    if(!e) continue;
    if(e.flash>0)e.flash-=dt;
    e.wob+=dt*7;
    let ang=Math.atan2(P.y-e.y,P.x-e.x);
    let sp=e.spd;
    if(e.slowT>0){ e.slowT-=dt; sp*=(e.frozen?0:0.5); }
    if(e.frozen>0){ e.frozen-=dt; if(e.frozen<=0)e.frozen=0; }
    let onGoo=false;
    for(const g of G.GOO) if(dist2(e.x,e.y,g.x,g.y)<g.r*g.r){ sp*=0.55; onGoo=true; break; }
    if(onGoo&&P.mine){                            // 腐蝕果凍：站在果凍上持續掉血
      hurtEnemy(e,(P.mine>=2?26:13)*P.dmgEff*dt,false);
      if(e.hp<=0) continue;
    }
    if(e.frozen>0) sp=0;
    if(e.ranged){
      const d=Math.hypot(P.x-e.x,P.y-e.y);
      if(e.kite && d<330) sp*=-0.55;             // 只有無人機保持距離風箏；其他三種照樣衝過來
      e.shootCD-=dt;
      if(e.shootCD<=0&&d<e.shootRange){
        e.shootCD=rnd(e.cdMin,e.cdMax)*CUR().atkSlow;
        shootE(e.x,e.y,ang,215*CUR().bspd,e.dmg,6);
      }
    }
    if(e.boss){
      // 半血進入第二階段；時間耗盡後最終 Boss 直接狂暴，避免無限拖
      const rage = e.hp/e.maxhp < .5 || (e.kind==='final' && G.t>G.winT);
      e.atkT-=dt; e.spin+=dt*1.5;
      if(e.atkT<=0){
        e.atkT = e.atkMax * (rage?0.62:1);
        const bs = e.bspd * (rage?1.18:1);
        if(e.atk==='cross'){                   // 打叉彈幕：兩組交錯十字
          const n = rage?12:8;
          for(let k=0;k<n;k++) shootE(e.x,e.y,ang+k*6.283/n,bs,e.dmg,8);
        }else if(e.atk==='spiral'){            // 螺旋：連續旋轉噴流
          const arms = rage?4:3;
          for(let k=0;k<arms;k++) shootE(e.x,e.y,e.spin+k*6.283/arms,bs,e.dmg,8);
          for(let k=-1;k<=1;k++) shootE(e.x,e.y,ang+k*.26,bs*1.3,e.dmg,7);
        }else{                                 // 環形 + 追蹤散彈
          const n = rage?20:14;
          for(let k=0;k<n;k++) shootE(e.x,e.y,k*6.283/n+e.spin,bs,e.dmg,9);
          for(let k=-2;k<=2;k++) shootE(e.x,e.y,ang+k*.20,bs*1.4,e.dmg,7);
        }
        shake(rage?3:2);
      }
      // v0.9.11：超級大 Boss 專屬第二種攻擊——雷射鎖定直線光束。
      // 取材自使用者提供的參考遊戲影片：先鎖定玩家「當下」位置畫出警示細線，
      // 短暫延遲後才沿線打出直線光束。跟既有的 cross/spiral/ring 這類「從中心
      // 往外放射」的彈幕完全不同性質——逼玩家「離開一條線」而不是「離開一個點」，
      // 是全新的閃避技巧，所以只給超級大 Boss（第6、10關）用，不影響其餘8關
      // 一般 Boss 戰既有的難度曲線與教學節奏。
      if(e.superBoss){
        if(e.laserFireT>0){
          e.laserFireT-=dt;
          const dHit=raySegDist(e.x,e.y,e.laserAng,1000,P.x,P.y);
          if(dHit<24+P.r && P.iframe<=0) hurtPlayer();
          if(e.laserFireT<=0) e.laserCD=rnd(3.0,4.2)*(rage?0.7:1);
        }else if(e.laserWarnT>0){
          e.laserWarnT-=dt;
          if(e.laserWarnT<=0){ e.laserFireT=0.35; shake(6); SFX.laserFire(); }
        }else{
          e.laserCD-=dt;
          if(e.laserCD<=0){
            e.laserAng=ang;              // 鎖定當下角度，警示期間不再更新，玩家能靠移動閃開
            e.laserWarnT=0.68;
            SFX.laserWarn();
          }
        }
      }
    }
    if(e.kb>0){ e.kb-=dt; e.x+=e.kbx*dt; e.y+=e.kby*dt; }
    else{ e.x+=Math.cos(ang)*sp*dt; e.y+=Math.sin(ang)*sp*dt; }

    // 遠離玩家的落單怪回收再利用（避免尾巴堆積拖垮節奏與效能）
    if(!e.boss && dist2(e.x,e.y,P.x,P.y)>780*780){
      const a2=rnd(0,6.283), d2=rnd(340,420);
      e.x=P.x+Math.cos(a2)*d2; e.y=P.y+Math.sin(a2)*d2;
    }

    // 敵人互斥（避免疊在一起）
    if((i&3)===(Math.floor(G.t*60)&3)){
      for(let j=0;j<G.E.length;j+=2){
        const o=G.E[j]; if(o===e||o.boss)continue;
        const dd=dist2(e.x,e.y,o.x,o.y), mr=(e.r+o.r)*0.86;
        if(dd<mr*mr&&dd>0.01){ const d=Math.sqrt(dd),px=(e.x-o.x)/d,py=(e.y-o.y)/d;
          const push=(mr-d)*.5; e.x+=px*push; e.y+=py*push; }
      }
    }
    // 碰玩家
    if(P.iframe<=0 && dist2(e.x,e.y,P.x,P.y)<(e.r+P.r)**2){
      const dead=hurtPlayer();
      if(e.boom) killEnemy(e);
      if(dead) return;
    }
  }

  //--- 玩家子彈
  for(let i=G.B.length-1;i>=0;i--){
    const b=G.B[i]; b.age+=dt; b.life-=dt;
    if(b.boomerang){
      const k=b.age/1.5;
      b.vx*=(1-dt*1.6); b.vy*=(1-dt*1.6);
      const ax=(P.x-b.x), ay=(P.y-b.y), m=Math.hypot(ax,ay)||1;
      b.vx+=ax/m*900*dt*k; b.vy+=ay/m*900*dt*k;
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.life<=0){ if(b.goo) addGoo(b.x,b.y,17,b.hue); G.B.splice(i,1); continue; }
    // v0.9.13 修正：跟 damageArea() 同一個問題——這裡原本是 for(const e of G.E)，
    // hurtEnemy() 打死怪物會 splice(G.E)，邊迭代邊刪同一個陣列會跳過元素。
    // 對貫穿子彈（pierce>=1，例如溜溜球武器）影響最明顯：打穿一群怪的時候，
    // 偶爾會有一隻完全沒中彈判定，卻沒有視覺上的理由。改成倒著跑的索引迴圈。
    for(let ei=G.E.length-1;ei>=0;ei--){
      const e=G.E[ei]; if(!e) continue;
      if(b.hit.has(e))continue;
      if(dist2(b.x,b.y,e.x,e.y)<(b.r+e.r)**2){
        hurtEnemy(e,b.dmg,true);
        const a=Math.atan2(e.y-b.y,e.x-b.x);
        if(!e.boss){ e.kb=.1; e.kbx=Math.cos(a)*150; e.kby=Math.sin(a)*150; }
        burst(b.x,b.y,3,b.hue,.6);
        if(b.goo) addGoo(b.x,b.y,15,b.hue);
        b.hit.add(e);
        if(b.pierce<=0){ const ix=G.B.indexOf(b); if(ix>=0)G.B.splice(ix,1); break; }
        b.pierce--;
      }
    }
  }
  //--- 敵彈
  for(let i=G.EB.length-1;i>=0;i--){
    const b=G.EB[i]; b.life-=dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=b.spin*dt;
    if(b.life<=0){ G.EB.splice(i,1); continue; }
    if(dist2(b.x,b.y,P.x,P.y)<(b.r+P.r)**2){
      const dead = P.iframe<=0 ? hurtPlayer() : false;
      G.EB.splice(i,1);
      if(dead) return;
    }
  }
  //--- 閃避穿彈幕 → 子彈時間
  if(P.dashT>0){
    for(const b of G.EB){
      if(!b.grazed && dist2(b.x,b.y,P.x,P.y)<(b.r+P.r+16)**2){
        b.grazed=true; G.slowmo=Math.max(G.slowmo,.85);
        pop(P.x,P.y-40,'PERFECT!','#7ef7c0',22);
        break;
      }
    }
  }
  //--- 晶核
  for(let i=G.GEM.length-1;i>=0;i--){
    const g=G.GEM[i]; g.wob+=dt*8;
    const d2=dist2(g.x,g.y,P.x,P.y);
    const range = P.magnet ? 1e9 : P.pickup*P.pickup;   // 吸塵果凍狗：全場吸引
    if(d2<range){
      const d=Math.sqrt(d2)||1, s=Math.max(230,700-d*1.6);
      g.x+=(P.x-g.x)/d*s*dt; g.y+=(P.y-g.y)/d*s*dt;
      if(d<24){ gainXP(g.xp); SFX.pickup(); G.GEM.splice(i,1); continue; }
    }else{ g.x+=g.vx*dt; g.y+=g.vy*dt; g.vx*=(1-dt*3); g.vy*=(1-dt*3); }
  }
  //--- 果凍
  G.gooArea=0;
  for(let i=G.GOO.length-1;i>=0;i--){
    const g=G.GOO[i]; g.life-=dt*.55; g.wob+=dt*2.2;
    if(g.burn>0){ g.burn-=dt; g.life-=dt*2.2; }
    G.gooArea+=Math.PI*g.r*g.r;
    if(g.life<=0) G.GOO.splice(i,1);
  }
  //--- 粒子 / 文字
  for(let i=G.PT.length-1;i>=0;i--){
    const p=G.PT[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=(1-dt*3.2); p.vy*=(1-dt*3.2);
    if(p.life<=0) G.PT.splice(i,1);
  }
  for(let i=G.TXT.length-1;i>=0;i--){
    const t=G.TXT[i]; t.t+=dt;
    if(t.vy){ t.y+=t.vy*dt; t.vy*=(1-dt*2.4); }
    if(t.t>t.life) G.TXT.splice(i,1);
  }
  //--- 衝擊波環（v0.9.12：核彈爆炸用，半徑持續擴大、越擴越淡）
  for(let i=G.SHOCK.length-1;i>=0;i--){
    const s=G.SHOCK[i]; s.r+=s.spd*dt; s.life-=dt;
    if(s.life<=0) G.SHOCK.splice(i,1);
  }
  //--- 相機
  // 相機刻意落後 + 前瞻偏移：角色會在畫面上實際位移，而不是永遠釘在正中央
  const LEAD=52;
  P.leadX=(P.leadX||0)+(((P.mvx||0)*(P.moving||0)*LEAD)-(P.leadX||0))*Math.min(1,rawdt*3.0);
  P.leadY=(P.leadY||0)+(((P.mvy||0)*(P.moving||0)*LEAD)-(P.leadY||0))*Math.min(1,rawdt*3.0);
  G.cam.x+=((P.x+P.leadX)-G.cam.x)*Math.min(1,dt*5.5);
  G.cam.y+=((P.y+P.leadY)-G.cam.y)*Math.min(1,dt*5.5);
  if(G.cam.shake>0){ G.cam.shPhase+=rawdt*16; G.cam.shake=Math.max(0,G.cam.shake-rawdt*13); }

  // 撐過 3 分鐘且最終 Boss 已倒下 → 勝利（正常情況是打死 Boss 當下就結算）
  if(G.t>=G.winT && G.bossDone[G.bosses.length-1] && !G.E.some(e=>e.kind==='final')) endGame(true);
}

function evoFire(k,lv){
  const P=G.P;
  if(k==='bubble'){                      // 霓虹果凍暴雨
    for(let i=0;i<2;i++){
      const a=rnd(0,6.283), d=rnd(90,420);
      const x=P.x+Math.cos(a)*d, y=P.y+Math.sin(a)*d;
      damageArea(x,y,52,(10+lv*5)*P.dmgEff,false); addGoo(x,y,26,rnd(160,220));
      burst(x,y,5,190,.8);
    }
  }else if(k==='graffiti'){              // 彩虹地毯：延燒
    if(Math.random()<.5&&G.GOO.length) { const g=pick(G.GOO); igniteGoo(g.x,g.y,g.r,2); }
  }else if(k==='yoyo'){                  // 黑洞
    for(const e of G.E){ if(e.boss)continue;
      const d=Math.hypot(P.x-e.x,P.y-e.y);
      if(d<340&&d>1){ e.x+=(P.x-e.x)/d*150*.016*8; e.y+=(P.y-e.y)/d*150*.016*8; } }
    for(const g of G.GEM){ const d=Math.hypot(P.x-g.x,P.y-g.y)||1;
      g.x+=(P.x-g.x)/d*260*.016*4; g.y+=(P.y-g.y)/d*260*.016*4; }
  }
}

//====================== 繪圖 ======================
function draw(){
  const P=G.P, cam=G.cam;
  let sx=0,sy=0;
  if(cam.shake>0.12){
    const w=Math.sin(cam.shPhase*6.283)*Math.exp(-cam.shPhase*2.2);
    sx=Math.cos(cam.shAng)*cam.shake*w;
    sy=Math.sin(cam.shAng)*cam.shake*w;
  }
  const cx=W/2-cam.x+sx, cy=H/2-cam.y+sy;

  ctx.fillStyle='#0b0720'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(cx,cy);

  // 場地
  ctx.save();
  const gr=ctx.createRadialGradient(0,0,60,0,0,ARENA);
  gr.addColorStop(0,'#1a1140'); gr.addColorStop(.7,'#130c2e'); gr.addColorStop(1,'#0a0620');
  ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(0,0,ARENA,0,6.283); ctx.fill();
  ctx.strokeStyle='rgba(120,90,220,.5)'; ctx.lineWidth=5; ctx.stroke();
  ctx.restore();
  // 地板格線（明顯的移動參考物 — 太淡會讓玩家以為角色沒在動）
  const L=cam.x-W/2, R2=cam.x+W/2, T=cam.y-H/2, B=cam.y+H/2;
  const gs=88, x0=Math.floor(L/gs)*gs, y0=Math.floor(T/gs)*gs;
  ctx.strokeStyle='rgba(150,120,255,.15)'; ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=x0;x<R2+gs;x+=gs){ ctx.moveTo(x,T); ctx.lineTo(x,B); }
  for(let y=y0;y<B+gs;y+=gs){ ctx.moveTo(L,y); ctx.lineTo(R2,y); }
  ctx.stroke();
  // 主格線（每 5 格一條，提供更大尺度的位移感）
  const GS=gs*5, X0=Math.floor(L/GS)*GS, Y0=Math.floor(T/GS)*GS;
  ctx.strokeStyle='rgba(170,140,255,.30)'; ctx.lineWidth=2;
  ctx.beginPath();
  for(let x=X0;x<R2+GS;x+=GS){ ctx.moveTo(x,T); ctx.lineTo(x,B); }
  for(let y=Y0;y<B+GS;y+=GS){ ctx.moveTo(L,y); ctx.lineTo(R2,y); }
  ctx.stroke();
  // 地板霓虹小點（每格決定性生成，無需儲存，滑過去時位移感最強）
  for(let gx=Math.floor(L/GS);gx<=Math.floor(R2/GS);gx++){
    for(let gy=Math.floor(T/GS);gy<=Math.floor(B/GS);gy++){
      const h=((gx*73856093)^(gy*19349663))>>>0;
      if((h&7)>4) continue;
      const px=gx*GS+(h%GS), py=gy*GS+((h>>>9)%GS);
      ctx.fillStyle='hsla('+(h%360)+',85%,65%,.22)';
      ctx.beginPath(); ctx.arc(px,py,3+((h>>>17)%5),0,6.283); ctx.fill();
    }
  }

  // 果凍地形（地板層：低亮度填色 + 亮邊，確保敵人/子彈仍然清楚）
  for(const g of G.GOO){
    const a=clamp(g.life/g.max,0,1);
    const rr=g.r*(1+Math.sin(g.wob)*.05);
    if(g.burn>0){
      ctx.fillStyle='hsla(28,100%,58%,'+(.34*a+.16)+')';
      ctx.beginPath(); ctx.arc(g.x,g.y,rr*1.14,0,6.283); ctx.fill();
    }
    ctx.fillStyle='hsla('+g.hue+',60%,26%,'+(0.62*a)+')';
    ctx.beginPath(); ctx.arc(g.x,g.y,rr,0,6.283); ctx.fill();
    ctx.strokeStyle='hsla('+g.hue+',90%,58%,'+(0.34*a)+')'; ctx.lineWidth=2;
    ctx.stroke();
  }

  // 結算畫面時世界已凍結，這些殘留物不再有意義 —— 跳過以把幀數留給花火
  const live=!G.over;
  // 晶核 —— 統一金色「六角寶石」，不隨敵人變色（撿的東西只有一種長相）
  for(const g of (live?G.GEM:[])){
    const s=5.4+Math.sin(g.wob)*1.1, rot=g.wob*0.35;
    ctx.fillStyle='rgba(255,205,60,.24)';
    ctx.beginPath(); ctx.arc(g.x,g.y,s*2.2,0,6.283); ctx.fill();
    ctx.beginPath();
    for(let k=0;k<6;k++){ const a=k*1.0472+rot, px=g.x+Math.cos(a)*s, py=g.y+Math.sin(a)*s;
      k?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath();
    ctx.fillStyle='#ffd23f'; ctx.fill();
    ctx.strokeStyle='#fff6d6'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.arc(g.x-s*.25,g.y-s*.3,s*.26,0,6.283); ctx.fill();
  }

  drawChests();
  drawNuke();
  // 敵人
  const eDetail=G.E.length<=55;
  for(const e of G.E) drawBlob(e,eDetail||e.boss);

  // 敵彈 —— 紅色尖角菱形 + 紅光暈 + 白描邊（顏色、形狀、旋轉三重辨識）
  const ebGlow=G.EB.length<=80;          // 彈幕爆量時省掉外光暈，維持 60fps
  for(const b of (live?G.EB:[])){
    const R=b.r*1.35;
    if(ebGlow){ ctx.fillStyle='rgba(255,40,60,.20)';
      ctx.beginPath(); ctx.arc(b.x,b.y,R*2.0,0,6.283); ctx.fill(); }
    const cs=Math.cos(b.rot), sn=Math.sin(b.rot);
    ctx.beginPath();
    ctx.moveTo(b.x+R*1.5*cs,        b.y+R*1.5*sn);
    ctx.lineTo(b.x-R*0.8*sn,        b.y+R*0.8*cs);
    ctx.lineTo(b.x-R*1.1*cs,        b.y-R*1.1*sn);
    ctx.lineTo(b.x+R*0.8*sn,        b.y-R*0.8*cs);
    ctx.closePath();
    ctx.fillStyle='#ff2a44'; ctx.fill();
    ctx.strokeStyle='#ffe9ec'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#fff8f8';
    ctx.beginPath(); ctx.arc(b.x,b.y,R*0.3,0,6.283); ctx.fill();
  }
  drawBossLaser();
  // 我方子彈 —— 一律青白發光圓形（不管哪把武器），與紅色敵彈徹底分流
  ctx.globalCompositeOperation='lighter';
  for(const b of (live?G.B:[])){
    ctx.fillStyle='rgba(90,230,255,.30)';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*1.9,0,6.283); ctx.fill();
    ctx.fillStyle='#5ce6ff';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.283); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*.5,0,6.283); ctx.fill();
  }
  // 粒子
  for(const p of (live?G.PT:[])){
    const a=clamp(p.life/p.max,0,1);
    ctx.fillStyle='hsla('+p.hue+',95%,65%,'+a+')';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*a,0,6.283); ctx.fill();
  }
  // 衝擊波環（v0.9.12：核彈爆炸——外圈亮線 + 內側柔光，隨半徑擴大逐漸淡出）
  for(const s of (live?G.SHOCK:[])){
    const a=clamp(s.life/s.max,0,1);
    ctx.strokeStyle='hsla('+s.hue+',95%,'+(60+a*20)+'%,'+(a*0.85)+')';
    ctx.lineWidth=6*a+1.5;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.stroke();
    ctx.strokeStyle='hsla('+s.hue+',90%,75%,'+(a*0.28)+')';
    ctx.lineWidth=22*a+2;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';

  // 玩家
  drawPlayer(P);

  // 飄字
  ctx.textAlign='center';
  for(const t of G.TXT){
    if(t.big)continue;
    const a=clamp(1-t.t/t.life,0,1);
    ctx.font='900 '+t.sz+'px system-ui';
    ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.55)';
    ctx.strokeText(t.txt,t.x,t.y); ctx.fillStyle=t.color;
    ctx.globalAlpha=a; ctx.fillText(t.txt,t.x,t.y); ctx.globalAlpha=1;
  }
  ctx.restore();

  drawFW();          // 花火畫在世界之上、HUD 之下（螢幕座標）
  drawHUD();
}

// v0.9.11：超級大 Boss 雷射鎖定攻擊的畫面——警示階段畫紅色虛線（讓玩家有時間反應、
// 走出這條線），開火階段換成又粗又亮的光束（紅→粉→白三層疊加，跟敵彈的紅色菱形
// 用同一套「危險=紅」語言，但形狀完全不同，才不會被誤認成普通彈幕）。
function drawBossLaser(){
  const e=G.boss;
  if(!e||!e.superBoss) return;
  const LEN=1000, ex=e.x, ey=e.y, ax=Math.cos(e.laserAng)*LEN, ay=Math.sin(e.laserAng)*LEN;
  if(e.laserWarnT>0){
    const k=clamp(1-e.laserWarnT/0.68,0,1);
    const flick=0.35+Math.abs(Math.sin(G.t*22))*0.45;
    ctx.save();
    ctx.strokeStyle='rgba(255,50,70,'+(flick*(0.35+k*0.5)).toFixed(3)+')';
    ctx.lineWidth=2.5+k*3;
    ctx.setLineDash([14,10]);
    ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ex+ax,ey+ay); ctx.stroke();
    ctx.restore();
  }else if(e.laserFireT>0){
    const k=clamp(e.laserFireT/0.35,0,1);
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle='rgba(255,70,90,'+(0.30*k+0.12).toFixed(3)+')'; ctx.lineWidth=48;
    ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ex+ax,ey+ay); ctx.stroke();
    ctx.strokeStyle='rgba(255,150,170,'+(0.55*k+0.25).toFixed(3)+')'; ctx.lineWidth=20;
    ctx.stroke();
    ctx.strokeStyle='rgba(255,248,249,'+(0.75*k+0.25).toFixed(3)+')'; ctx.lineWidth=7;
    ctx.stroke();
    ctx.restore();
  }
}
// 不使用 save()/restore()：那兩個呼叫在 80+ 敵人時是實測最大的單一開銷
function drawBlob(e,detail){
  const R=e.r*(1+Math.sin(e.wob)*.07);
  // 便宜的光暈（取代 shadowBlur）
  ctx.fillStyle='hsla('+e.hue+',90%,55%,.18)';
  ctx.beginPath(); ctx.arc(e.x,e.y,R*1.42,0,6.283); ctx.fill();
  if(e.boss){ ctx.shadowColor='hsl('+e.hue+',90%,55%)'; ctx.shadowBlur=26; }
  // 超級大 Boss：多一圈脈動的警戒圈，跟一般 Boss 拉開視覺辨識度
  if(e.superBoss){
    ctx.strokeStyle='rgba(255,40,100,'+(0.45+0.35*Math.sin(G.t*6))+')';
    ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(e.x,e.y,R*1.28,0,6.283); ctx.stroke();
  }
  ctx.fillStyle= e.flash>0 ? '#fff'
               : e.frozen>0 ? '#9fe4ff'
               : e.slowT>0  ? 'hsl('+e.hue+',45%,42%)'      // 被黏住：明顯變暗沉
               : 'hsl('+e.hue+',80%,'+(e.boss?46:56)+'%)';
  ctx.beginPath();
  // 果凍變形：橢圓 + 波動
  ctx.ellipse(e.x,e.y,R*(1+Math.sin(e.wob)*.09),R*(1-Math.sin(e.wob)*.09),0,0,6.283);
  ctx.fill();
  if(e.boss) ctx.shadowBlur=0;
  ctx.strokeStyle='hsla('+e.hue+',95%,78%,.9)'; ctx.lineWidth=2; ctx.stroke();
  if(detail){                       // 場上敵人太多時省略細節，肉眼看不出來
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(e.x-R*.3,e.y-R*.34,R*.2,0,6.283); ctx.fill();
    const es=e.boss?R*.15:R*.22;
    ctx.fillStyle='#12082a';
    ctx.beginPath(); ctx.arc(e.x-R*.3,e.y-R*.05,es,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(e.x+R*.3,e.y-R*.05,es,0,6.283); ctx.fill();
  }
  // 血條
  if(e.boss||e.hp<e.maxhp){
    const w=e.boss?0:e.r*2.1;
    if(!e.boss){
      ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(e.x-w/2,e.y-e.r-9,w,3.5);
      ctx.fillStyle='#ff5b7f'; ctx.fillRect(e.x-w/2,e.y-e.r-9,w*clamp(e.hp/e.maxhp,0,1),3.5);
    }
  }
  // 等級（tier）標示：白色細圈，數量＝tier，讓玩家看得出「這隻比較強化」
  if(!e.boss && e.tier>0 && detail){
    ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=1.4;
    for(let k=0;k<e.tier;k++){
      ctx.beginPath(); ctx.arc(e.x,e.y,R*1.22+k*3.4,0,6.283); ctx.stroke();
    }
  }
}
function drawPlayer(P){
  const R=P.r*(P.dashT>0?1.22:1);
  ctx.save();
  // 拾取範圍
  ctx.strokeStyle='rgba(126,247,192,.10)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(P.x,P.y,P.pickup,0,6.283); ctx.stroke();
  if(P.iframe>0){ ctx.strokeStyle='rgba(126,247,192,'+(.35+Math.sin(G.t*40)*.25)+')';
    ctx.lineWidth=3; ctx.beginPath(); ctx.arc(P.x,P.y,R+8,0,6.283); ctx.stroke(); }
  for(let s=0;s<P.shieldN;s++){          // 甜甜圈護盾
    const rr=R+15+s*7;
    ctx.strokeStyle='rgba(143,216,255,'+(.55+Math.sin(G.t*3+s)*.2)+')';
    ctx.lineWidth=3.5; ctx.setLineDash([9,7]); ctx.lineDashOffset=-G.t*26;
    ctx.beginPath(); ctx.arc(P.x,P.y,rr,0,6.283); ctx.stroke(); ctx.setLineDash([]);
  }
  if(P.frenzyT>0){
    ctx.strokeStyle='rgba(255,154,213,'+(.4+Math.sin(G.t*22)*.3)+')';
    ctx.lineWidth=4; ctx.beginPath(); ctx.arc(P.x,P.y,R+12,0,6.283); ctx.stroke();
  }
  // 依移動方向拉伸（果凍該有的擠壓感，也讓「正在移動」一眼可辨）
  const mv=P.moving||0, ang=Math.atan2(P.mvy||0,P.mvx||0);
  const st=1+mv*0.28, sq=1-mv*0.18;
  ctx.translate(P.x,P.y); ctx.rotate(ang);
  ctx.shadowColor='#4ff0ff'; ctx.shadowBlur=20;
  ctx.fillStyle= P.flash>0 ? '#fff' : '#6ff0e0';
  ctx.beginPath(); ctx.ellipse(0,0,R*st,R*sq,0,0,6.283); ctx.fill(); ctx.shadowBlur=0;
  ctx.strokeStyle='#e8fffb'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.rotate(-ang);
  ctx.fillStyle='#0d2430';
  ctx.beginPath(); ctx.arc(-R*.32,-R*.1,R*.19,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc( R*.32,-R*.1,R*.19,0,6.283); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.arc(-R*.28,-R*.4,R*.19,0,6.283); ctx.fill();
  ctx.restore();
}

const pauseBtnEl=document.getElementById('btnPause'), nukeBtnEl=document.getElementById('btnNuke');
function drawHUD(){
  const P=G.P;
  const pad=14, top=SAFE_TOP;
  // v0.9.10：暫停鍵、核彈按鈕是不是要顯示，每幀在這裡統一判斷（唯一的判斷來源），
  // 不要在 start()/endGame()/showCards() 等一堆地方各自 toggle，容易漏掉某個路徑。
  pauseBtnEl.classList.toggle('hide', !(G.running && !G.paused));
  nukeBtnEl.classList.toggle('hide', !(G.running && !G.paused && P.nukeHeld));
  // 受擊全螢幕紅閃 + 邊緣暗角（比血條扣血更快被眼睛接收到）
  if(G.hurt>0){
    const a=G.hurt;
    ctx.fillStyle='rgba(255,45,70,'+(a*0.15)+')'; ctx.fillRect(0,0,W,H);
    const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.26,W/2,H/2,Math.max(W,H)*0.66);
    vg.addColorStop(0,'rgba(255,0,40,0)');
    vg.addColorStop(1,'rgba(255,10,45,'+(a*0.62)+')');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }
  // v0.9.12：核彈引爆瞬間的全螢幕白/橘閃光，跟受擊紅閃刻意做出色調區隔，
  // 加強「按下去真的發生了一件大事」的爽快感
  if(G.nukeFlash>0){
    const a=G.nukeFlash;
    ctx.fillStyle='rgba(255,240,200,'+(a*0.55)+')'; ctx.fillRect(0,0,W,H);
  }
  // Boss 出場預告：出場前 5 秒，畫面閃紅 + 倒數數字，跟受擊紅閃刻意做出區別
  // （受擊是短促單次衰減，這裡是持續 5 秒的脈動閃爍，讓玩家有時間反應而不是被嚇到）
  if(G.bossWarnT>=0){
    const pulse=0.5+0.5*Math.sin(G.t*11);
    ctx.fillStyle='rgba(255,20,40,'+(0.08+0.12*pulse)+')'; ctx.fillRect(0,0,W,H);
    const vg2=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.20,W/2,H/2,Math.max(W,H)*0.60);
    vg2.addColorStop(0,'rgba(255,0,30,0)');
    vg2.addColorStop(1,'rgba(255,10,40,'+(0.30+0.30*pulse)+')');
    ctx.fillStyle=vg2; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.6)';
    ctx.font='900 20px system-ui'; ctx.fillStyle='#ff6b78';
    const warnTxt='⚠ '+(G.bossWarnName||'BOSS')+' 即將出現';
    ctx.strokeText(warnTxt,W/2,H*0.30); ctx.fillText(warnTxt,W/2,H*0.30);
    const cdNum=Math.max(1,Math.ceil(G.bossWarnT));
    ctx.font='900 '+Math.round(58+pulse*8)+'px system-ui';
    ctx.strokeText(String(cdNum),W/2,H*0.30+56); ctx.fillText(String(cdNum),W/2,H*0.30+56);
  }
  // XP 條
  ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fillRect(0,top,W,7);
  ctx.fillStyle='#7ef7c0'; ctx.fillRect(0,top,W*clamp(P.xp/P.xpNext,0,1),7);
  // 時間（獨佔一行，避免與血條打架）
  ctx.textAlign='center'; ctx.font='900 24px system-ui';
  ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.5)';
  const rem=Math.max(0,G.winT-G.t);
  let tt, over0 = rem<=0 && G.E.some(e=>e.kind==='final');
  if(over0){ tt='擊倒 BOSS！'; ctx.fillStyle='hsl(0,100%,'+(62+Math.sin(G.t*7)*12)+'%)'; }
  else{ tt=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(Math.floor(rem%60)).padStart(2,'0');
        ctx.fillStyle='#fff'; }
  ctx.strokeText(tt,W/2,top+34); ctx.fillText(tt,W/2,top+34);
  // 愛心（三心制）
  const hy=top+48, hs=15, gapH=hs*2.5;
  for(let i=0;i<P.maxHearts;i++){
    const hx=pad+hs+i*gapH, full=i<P.hearts;
    // 剛失去的那一顆做一次放大破碎感
    const pulse = (!full && i===P.hearts && G.hurt>0) ? 1+G.hurt*0.5 : 1;
    ctx.save(); ctx.translate(hx,hy+hs*0.2); ctx.scale(pulse,pulse);
    heartPath(0,0,hs);
    if(full){
      ctx.fillStyle='#ff5b86'; ctx.fill();
      ctx.strokeStyle='#ffd9e4'; ctx.lineWidth=2.2; ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.65)';
      ctx.beginPath(); ctx.ellipse(-hs*.3,-hs*.32,hs*.19,hs*.13,-0.5,0,6.283); ctx.fill();
    }else{
      ctx.fillStyle='rgba(255,90,130,.14)'; ctx.fill();
      ctx.strokeStyle='rgba(255,150,180,.42)'; ctx.lineWidth=2; ctx.stroke();
    }
    ctx.restore();
  }
  // LV
  ctx.textAlign='left';
  ctx.font='900 13px system-ui'; ctx.fillStyle='#ffd84f';
  ctx.fillText('LV.'+P.lv, pad, hy+38);
  ctx.fillStyle='#8d7fb8'; ctx.font='700 11px system-ui';
  ctx.fillText('擊殺 '+G.kills, pad+46, hy+38);
  ctx.font='800 10.5px system-ui'; ctx.fillStyle=TIER_COLOR[G.L.tier];
  ctx.fillText('第 '+(G.lvIdx+1)+' 關 · '+G.L.n+'（'+G.L.tier+'）', pad, hy+54);
  // 加速鍵（左下拇指區，同時是冷卻指示器）
  const k=1-clamp(P.dashCD/P.dashCDmax,0,1), ready=k>=1;
  const br=BTN.r*(1+(BTNPRESS>0?0.08:0));
  ctx.beginPath(); ctx.arc(BTN.x,BTN.y,br,0,6.283);
  ctx.fillStyle='rgba(12,8,28,.55)'; ctx.fill();
  ctx.strokeStyle= ready?'rgba(126,247,192,.9)':'rgba(126,247,192,.28)';
  ctx.lineWidth=3; ctx.stroke();
  // 冷卻扇形
  ctx.beginPath(); ctx.moveTo(BTN.x,BTN.y);
  ctx.arc(BTN.x,BTN.y,br-3,-1.5708,-1.5708+6.283*k); ctx.closePath();
  ctx.fillStyle= ready?'rgba(126,247,192,.78)':'rgba(126,247,192,.30)'; ctx.fill();
  ctx.font='900 '+Math.round(br*0.78)+'px system-ui'; ctx.textAlign='center';
  ctx.fillStyle= ready?'#0d2430':'rgba(255,255,255,.55)';
  ctx.fillText('»',BTN.x,BTN.y+br*0.28);
  if(!ready){
    ctx.font='800 12px system-ui'; ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.fillText(P.dashCD.toFixed(1),BTN.x,BTN.y+br+16);
  }
  drawChestArrows();
  drawNukeArrow();
  // Boss 離開視野時的方向指示（血條在跳但看不到本體會很困惑）
  if(G.boss){
    const sx2=G.boss.x-G.cam.x+W/2, sy2=G.boss.y-G.cam.y+H/2, m=46;
    if(sx2<m||sx2>W-m||sy2<m||sy2>H-m){
      const ax=clamp(sx2,m,W-m), ay=clamp(sy2,m,H-m);
      const a2=Math.atan2(sy2-H/2,sx2-W/2);
      ctx.save(); ctx.translate(ax,ay); ctx.rotate(a2);
      ctx.fillStyle='hsla('+G.boss.hue+',90%,60%,'+(0.55+Math.sin(G.t*8)*0.3)+')';
      ctx.beginPath(); ctx.moveTo(17,0); ctx.lineTo(-11,11); ctx.lineTo(-11,-11); ctx.closePath();
      ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
      ctx.restore();
    }
  }
  // Boss 血條
  if(G.boss){
    const bw=Math.min(W-56,420), bx=(W-bw)/2, by=BTN.y-BTN.r-36;
    ctx.fillStyle='rgba(0,0,0,.55)'; roundRect(bx,by,bw,17,8); ctx.fill();
    ctx.fillStyle=G.boss.superBoss?'#ff2a6b':'#ff5b3f';
    roundRect(bx,by,bw*clamp(G.boss.hp/G.boss.maxhp,0,1),17,8); ctx.fill();
    ctx.font='900 12px system-ui'; ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.fillText((G.boss.superBoss?'⚠️ 超級大 BOSS · ':'')+G.boss.name, W/2, by-7);
  }
  // 搖桿
  if(IN.active){
    ctx.strokeStyle='rgba(255,255,255,.30)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(IN.ox,IN.oy,62,0,6.283); ctx.stroke();
    ctx.fillStyle='rgba(126,247,192,.22)';
    ctx.beginPath(); ctx.arc(IN.ox,IN.oy,62,0,6.283); ctx.fill();
    ctx.fillStyle='rgba(126,247,192,.75)';
    ctx.beginPath(); ctx.arc(IN.ox+IN.dx*IN.mag*62,IN.oy+IN.dy*IN.mag*62,25,0,6.283); ctx.fill();
    ctx.strokeStyle='#eafff7'; ctx.lineWidth=2; ctx.stroke();
  }
  // 開場操作提示：玩家還沒真正移動過就一直顯示
  if(!G.hasMoved && G.t<22){
    const a=0.55+Math.sin(G.t*3.4)*0.25;
    ctx.textAlign='center';
    ctx.font='900 17px system-ui'; ctx.fillStyle='rgba(255,255,255,'+a+')';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,.6)';
    const msg='按住螢幕任意處，然後拖曳手指來移動';
    ctx.strokeText(msg,W/2,H*0.62); ctx.fillText(msg,W/2,H*0.62);
    ctx.font='700 13px system-ui'; ctx.fillStyle='rgba(126,247,192,'+a+')';
    const msg2='左下 » 鍵 = 點一下往移動方向加速（無敵幀）';
    ctx.strokeText(msg2,W/2,H*0.62+26); ctx.fillText(msg2,W/2,H*0.62+26);
    const msg3='愛心用完就結束 — 靠閃避活下來';
    ctx.fillStyle='rgba(255,140,170,'+a+')';
    ctx.strokeText(msg3,W/2,H*0.62+48); ctx.fillText(msg3,W/2,H*0.62+48);
    const msg4='看到箭頭就往那邊跑，那裡有寶箱';
    ctx.fillStyle='rgba(255,210,63,'+a+')';
    ctx.strokeText(msg4,W/2,H*0.62+70); ctx.fillText(msg4,W/2,H*0.62+70);
  }
  // 大字
  for(const t of G.TXT){
    if(!t.big)continue;
    const a=clamp(1-t.t/t.life,0,1);
    ctx.textAlign='center'; ctx.font='900 26px system-ui';
    ctx.globalAlpha=a; ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,.6)';
    ctx.strokeText(t.txt,W/2,H*.26); ctx.fillStyle=t.color;
    ctx.fillText(t.txt,W/2,H*.26); ctx.globalAlpha=1;
  }
  // 觸控診斷（真機除錯用 —— 確認能動之後就可以整段刪掉）
  {
    const noInput = DIAG.touch===0 && DIAG.pointer===0 && DIAG.mouse===0 && G.t>2.5;
    ctx.textAlign='right'; ctx.font='700 10px system-ui';   // 靠右：左下角現在是加速鍵
    ctx.lineWidth=3; ctx.strokeStyle='rgba(10,6,24,.9)';
    const line='觸控 '+DIAG.touch+'/'+DIAG.tmove+'/'+DIAG.tend+
               '  指標 '+DIAG.pointer+'/'+DIAG.pmove+
               '  搖桿 '+(IN.active?'ON':'off')+' '+IN.mag.toFixed(2)+
               '  座標 '+Math.round(P.x)+','+Math.round(P.y);
    const dy2=H-10-SAFE_BOT;
    const dx2=W-pad;
    ctx.strokeText(line,dx2,dy2); ctx.fillStyle=noInput?'#ff6b8a':'rgba(160,145,200,.75)';
    ctx.fillText(line,dx2,dy2);
    if(DIAG.err){ ctx.strokeText('錯誤 '+DIAG.err.slice(0,60),dx2,dy2-13);
                  ctx.fillStyle='#ff5b7f'; ctx.fillText('錯誤 '+DIAG.err.slice(0,60),dx2,dy2-13); }
    if(noInput){
      ctx.textAlign='center'; ctx.font='900 15px system-ui'; ctx.fillStyle='#ff6b8a';
      ctx.strokeText('⚠ 偵測不到任何觸控事件',W/2,H*0.44);
      ctx.fillText('⚠ 偵測不到任何觸控事件',W/2,H*0.44);
      ctx.textAlign='left';
    }
  }
  // 果凍覆蓋率（差異化指標）
  const gp=gooPct();
  ctx.textAlign='right'; ctx.font='800 11px system-ui';
  ctx.lineWidth=4; ctx.strokeStyle='rgba(10,6,24,.9)';
  const gt='果凍 '+gp+'%  傷害 +'+Math.round(gp*0.30)+'%';
  ctx.strokeText(gt, W-pad, top+34);
  ctx.fillStyle= gp>55?'#ffd23f':'#a294cc';
  ctx.fillText(gt, W-pad, top+34);
  const sc=speedScale();
  if(sc>1.02){
    ctx.font='800 11px system-ui';
    const st2='速度 ×'+sc.toFixed(2);
    ctx.strokeText(st2, W-pad, top+52);
    ctx.fillStyle='#7ef7c0'; ctx.fillText(st2, W-pad, top+52);
  }
  // 靜音鍵
  ctx.beginPath(); ctx.arc(MUTE.x,MUTE.y,MUTE.r,0,6.283);
  ctx.fillStyle='rgba(12,8,28,.5)'; ctx.fill();
  ctx.strokeStyle='rgba(180,160,230,.45)'; ctx.lineWidth=1.5; ctx.stroke();
  // 用向量畫音符，不用 emoji（不同裝置的 emoji 字型差異很大）
  ctx.textAlign='center';
  ctx.fillStyle=SFX.isMuted()?'rgba(160,145,195,.5)':'#c9bdea';
  ctx.font='900 16px system-ui';
  ctx.fillText('♪',MUTE.x,MUTE.y+6);
  if(SFX.isMuted()){
    ctx.strokeStyle='#ff6b8a'; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(MUTE.x-9,MUTE.y+9); ctx.lineTo(MUTE.x+9,MUTE.y-9); ctx.stroke();
  }
  // 護盾指示
  if(P.shieldN>0){
    ctx.textAlign='left'; ctx.font='800 11px system-ui'; ctx.fillStyle='#8fd8ff';
    ctx.fillText('護盾 ×'+P.shieldN, pad, hy+56);
  }
  if(P.frenzyT>0){
    ctx.textAlign='left'; ctx.font='900 12px system-ui'; ctx.fillStyle='#ff9ad5';
    ctx.fillText('暴走中！', pad, hy+(P.shieldN>0?74:56));
  }
}
function heartPath(x,y,s){
  ctx.beginPath();
  ctx.moveTo(x, y+s*0.78);
  ctx.bezierCurveTo(x-s*1.15, y-s*0.10, x-s*0.58, y-s*1.05, x, y-s*0.32);
  ctx.bezierCurveTo(x+s*0.58, y-s*1.05, x+s*1.15, y-s*0.10, x, y+s*0.78);
  ctx.closePath();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

//====================== 戰報拍立得 ======================
function makePolaroid(win){
  const w=560,h=740,c=document.createElement('canvas');
  c.width=w; c.height=h; const x=c.getContext('2d');
  x.fillStyle='#fbf7ee'; x.fillRect(0,0,w,h);
  // 照片區
  const px=34,py=34,pw=w-68,ph=430;
  const g=x.createLinearGradient(px,py,px+pw,py+ph);
  g.addColorStop(0,'#2a1055'); g.addColorStop(.5,'#141033'); g.addColorStop(1,'#3d1245');
  x.fillStyle=g; x.fillRect(px,py,pw,ph);
  for(let i=0;i<130;i++){
    const hue=rnd(0,360);
    x.fillStyle='hsla('+hue+',90%,62%,'+rnd(.15,.7)+')';
    x.beginPath(); x.arc(rnd(px,px+pw),rnd(py,py+ph),rnd(3,34),0,6.283); x.fill();
  }
  x.fillStyle='#6ff0e0'; x.shadowColor='#4ff0ff'; x.shadowBlur=30;
  x.beginPath(); x.arc(px+pw/2,py+ph/2,42,0,6.283); x.fill(); x.shadowBlur=0;
  x.textAlign='center';
  x.font='900 54px system-ui'; x.fillStyle=win?'#7ef7c0':'#ff5b7f';
  x.lineWidth=8; x.strokeStyle='rgba(0,0,0,.55)';
  const title=win?'CLEAR!':'GAME OVER';
  x.strokeText(title,w/2,py+ph-38); x.fillText(title,w/2,py+ph-38);
  // 數據
  x.fillStyle='#241a3d'; x.font='900 30px system-ui';
  x.fillText('GOO BLASTER',w/2,py+ph+62);
  x.font='800 19px system-ui'; x.fillStyle='#6b5f8a';
  x.fillText('第 '+(G.lvIdx+1)+' 關 · '+G.L.n+'（'+G.L.tier+'）',w/2,py+ph+30);
  x.font='700 21px system-ui'; x.fillStyle='#5d5178';
  const mm=Math.floor(G.t/60), ss=Math.floor(G.t%60);
  x.fillText('存活 '+mm+':'+String(ss).padStart(2,'0')+'   ·   LV.'+G.P.lv+'   ·   擊殺 '+G.kills, w/2, py+ph+100);
  x.font='700 17px system-ui'; x.fillStyle='#8b7fa6';
  x.fillText('果凍覆蓋率 '+gooPct()+'%', w/2, py+ph+132);
  x.font='700 14px system-ui'; x.fillStyle='#b3a8c9';
  x.fillText('#GooBlaster', w/2, h-30);
  return c.toDataURL('image/png');
}

//====================== 流程 ======================
const menuEl=document.getElementById('menu'), overEl=document.getElementById('over');
const shotEl=document.getElementById('shot'), overTitle=document.getElementById('overTitle');
const nextEl=document.getElementById('btnNext');


// SEL_IDX：銀河路線上「目前預覽/準備開始」的關卡，跟 PROGRESS（實際解鎖進度）分開。
// 玩家可以點已解鎖的節點回頭預覽/重玩前面的關卡，不會影響解鎖進度本身。
let SEL_IDX=0;
function renderStage(){
  const frontier=Math.min(PROGRESS-1,LEVELS.length-1);
  const cleared = PROGRESS>LEVELS.length;
  const i=Math.min(Math.max(SEL_IDX,0),LEVELS.length-1);
  const L=LEVELS[i], c=TIER_COLOR[L.tier];
  const showCleared = cleared && i===LEVELS.length-1;
  document.getElementById('stageInfo').innerHTML =
    '<div class="st" style="color:'+c+'">'+(showCleared?'全部通關':'第 '+(i+1)+' 關 / '+LEVELS.length+'　·　'+L.tier)+'</div>'+
    '<div class="nm">'+(showCleared?'恭喜全破！':L.n)+'</div>'+
    '<div class="ds">'+(showCleared?('你已經打穿全部 '+LEVELS.length+' 關。再玩一次挑戰更快的紀錄。'):L.d)+'</div>'+
    '<div class="mt">'+Math.floor(L.dur/60)+':'+String(L.dur%60).padStart(2,'0')+
      '　·　♥'+L.hearts+'　·　Boss ×'+L.nboss+'</div>';
  buildGalaxy(frontier,cleared);
  document.getElementById('btnPlay').textContent =
    i<frontier ? '重玩 · 第 '+(i+1)+' 關' :
    (PROGRESS>1 ? (showCleared?'再玩最後一關':'第 '+(i+1)+' 關') : '開始遊戲');
  document.getElementById('btnReset').classList.toggle('hide',PROGRESS<=1);
}
// 銀河挑戰路線：10 個關卡節點沿一條蜿蜒路徑排列，玩得越遠、路線往下延伸越多。
// 節點狀態：done=已通關（可回頭重玩）、cur=目前解鎖到的最前線（可玩）、locked=還沒解鎖。
function buildGalaxy(frontier,cleared){
  const wrap=document.getElementById('galaxyWrap'), inner=document.getElementById('galaxyInner');
  const W=300, padY=42, stepY=68;
  const n=LEVELS.length;
  const H=padY*2+(n-1)*stepY;
  const pts=[];
  for(let k=0;k<n;k++){
    const x=W/2+Math.sin(k*1.05)*(W/2-42);
    const y=padY+k*stepY;
    pts.push({x,y});
  }
  let svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<polyline points="'+pts.map(p=>p.x+','+p.y).join(' ')+'" fill="none" '+
    'stroke="#5a3fa0" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.75"/></svg>';
  let stars='';
  for(let s=0;s<26;s++){
    stars+='<div class="star" style="left:'+rnd(0,W)+'px;top:'+rnd(0,H)+'px;'+
      'width:'+rnd(1,2.6).toFixed(1)+'px;height:'+rnd(1,2.6).toFixed(1)+'px;opacity:'+rnd(.15,.6).toFixed(2)+'"></div>';
  }
  let nodes='';
  LEVELS.forEach((L2,k)=>{
    const p=pts[k];
    const unlocked = k<=frontier || cleared;
    const isDone = k<frontier || (cleared && k<n-1) ;
    const isCur = k===frontier && !cleared;
    const isFinalCleared = cleared && k===n-1;
    // v0.9.14：大 Boss 關（每 10 關一次）在銀河圖上用 BOSS_CHAPTER 的表情符號
    // 取代數字，越後面的章節圖示越誇張，讓玩家一眼就能看出「這關有大魔王」。
    // 最後一關（第100關）額外加 mega class，CSS 給它紅色脈動光暈，代表全遊戲最恐怖。
    const isBossLv = !!L2.superBoss;
    const isMega = isBossLv && k===n-1;
    const cls=['gnode'];
    if(isDone||isFinalCleared) cls.push('done');
    if(isCur) cls.push('cur');
    if(!unlocked) cls.push('locked');
    if(k===SEL_IDX && unlocked) cls.push('sel');
    if(isBossLv && unlocked && !(isDone||isFinalCleared)) cls.push('boss');
    if(isMega && unlocked && !(isDone||isFinalCleared)) cls.push('mega');
    const bg = unlocked ? TIER_COLOR[L2.tier] : '';
    let inner;
    if(!unlocked) inner='<div class="gnum">🔒</div>';
    else if(isDone||isFinalCleared) inner='<div class="gnum">✓</div>';
    else if(isBossLv) inner='<div class="gic">'+(BOSS_CHAPTER[L2.bossChapter||0].icon)+'</div>';
    else inner='<div class="gnum">'+(k+1)+'</div>';
    // left/top 用百分比（相對 #galaxyInner，寬度基準是上面算 pts 用的 W=300），
    // 這樣手機實際渲染寬度跟 300px 設計稿不同時，節點位置還是會跟著 SVG 路徑對齊
    nodes+='<div class="'+cls.join(' ')+'" data-k="'+k+'" style="left:'+(p.x/W*100)+'%;top:'+p.y+'px;'+
      (unlocked?'background:'+bg+';':'')+'">'+inner+'</div>';
  });
  inner.style.height=H+'px';
  inner.innerHTML=svg+stars+nodes;
  inner.querySelectorAll('.gnode:not(.locked)').forEach(el=>{
    el.onclick=()=>{ SEL_IDX=+el.dataset.k; renderStage();
      el.scrollIntoView({block:'center',behavior:'smooth'}); };
  });
  // 開選單時自動捲到目前選取的節點，不用手動找
  requestAnimationFrame(()=>{
    const cur=inner.querySelector('.gnode[data-k="'+SEL_IDX+'"]');
    if(cur) wrap.scrollTop = Math.max(0, cur.offsetTop - wrap.clientHeight/2);
  });
}
function updateDiag(){
  const el=document.getElementById('diag'); if(!el)return;
  el.innerHTML=BUILD+'　·　觸控 '+DIAG.touch+' · 指標 '+DIAG.pointer+' · 滑鼠 '+DIAG.mouse+
    ' · 音訊 '+SFX.status()+
    '<br>'+(location.protocol==='file:'?'⚠ 目前是 file:// 開啟，建議改用網址開啟':location.host||'') +
    (DIAG.err?'<br><b>錯誤：'+DIAG.err+'</b>':'');
}
setInterval(updateDiag,700);
function showMenu(){
  clampProgress();
  SEL_IDX=Math.min(PROGRESS-1,LEVELS.length-1);   // 每次回選單，預設選到目前最前線的關卡
  renderStage();
  overEl.classList.add('hide'); cardsEl.classList.add('hide');
  menuEl.classList.remove('hide');
  document.getElementById('confirmBox').classList.add('hide');   // 保險：不要帶著上次沒關掉的確認彈窗回來
  SFX.unlock(); SFX.musicStart();   // v0.9.10：回選單改成播放首頁音樂（可愛版），不再是靜音
}
function start(){
  G=newGame(); G.running=true;
  SFX.unlock(); SFX.musicStart();
  menuEl.classList.add('hide'); overEl.classList.add('hide'); cardsEl.classList.add('hide');
  document.getElementById('pauseOverlay').classList.add('hide');   // btnPause本身跟著G.running自動顯示，見drawHUD()
  lastT=performance.now();
}

//====================== 過關花火 ======================
function spawnFirework(big){
  const x=rnd(W*0.10,W*0.90), y=rnd(H*0.08,H*0.58);
  const hue=rnd(0,360), hue2=hue+rnd(90,220);
  const n=big?rndi(56,72):rndi(34,46), sp=big?rnd(230,400):rnd(170,320);
  const shape=Math.random();
  for(let i=0;i<n;i++){
    let a,s;
    if(shape<0.34){ a=i/n*6.283; s=sp*rnd(.92,1.08); }
    else if(shape<0.67){ a=i/n*6.283; s=sp*(0.5+0.5*Math.abs(Math.sin(a*3))); }
    else { a=rnd(0,6.283); s=rnd(sp*0.3,sp); }
    G.FW.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      hue:(i%3===0?hue2:hue)+rnd(-24,24),
      life:rnd(1.3,2.4),max:2.4,r:rnd(3,6.5),
      trail:[],twinkle:Math.random()<0.42});
  }
  G.FW.push({x,y,flash:1,hue,life:0.3,max:0.3,r:0,vx:0,vy:0,trail:[]});
  SFX.fw();
  if(G.FW.length>560) G.FW.splice(0,G.FW.length-560);
}
function updateFW(dt){
  if(!G.FW.length&&!G.fw) return;
  if(G.fw){ G.fwT-=dt; if(G.fwT<=0){ G.fwT=rnd(0.34,0.62); spawnFirework(Math.random()<0.28); } }
  for(let i=G.FW.length-1;i>=0;i--){
    const p=G.FW[i]; p.life-=dt;
    if(p.life<=0){ G.FW.splice(i,1); continue; }
    if(p.flash) continue;
    p.trail.push(p.x,p.y); if(p.trail.length>12) p.trail.splice(0,2);
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vy+=115*dt;
    p.vx*=(1-dt*0.85); p.vy*=(1-dt*0.55);
  }
}
function drawFW(){
  if(!G.FW.length) return;
  const drawTrails=G.FW.length<420, cores=G.FW.length<300;
  ctx.globalCompositeOperation='lighter';
  for(const p of G.FW){
    const a=clamp(p.life/p.max,0,1);
    if(p.flash){
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,150*(1-a+0.25));
      g.addColorStop(0,'hsla('+p.hue+',100%,88%,'+(a*0.95)+')');
      g.addColorStop(1,'hsla('+p.hue+',100%,60%,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,150,0,6.283); ctx.fill();
      continue;
    }
    if(drawTrails&&p.trail.length>=4){
      ctx.strokeStyle='hsla('+p.hue+',100%,68%,'+(a*0.55)+')';
      ctx.lineWidth=p.r*1.05; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(p.trail[0],p.trail[1]);
      for(let k=2;k<p.trail.length;k+=2) ctx.lineTo(p.trail[k],p.trail[k+1]);
      ctx.lineTo(p.x,p.y); ctx.stroke();
    }
    const tw=p.twinkle?(0.45+0.55*Math.abs(Math.sin(p.life*26))):1;
    ctx.fillStyle='hsla('+p.hue+',100%,72%,'+(a*tw)+')';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(0.4+a*0.6),0,6.283); ctx.fill();
    if(cores){ ctx.fillStyle='rgba(255,255,255,'+(a*tw*0.8)+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.35,0,6.283); ctx.fill(); }
  }
  ctx.globalCompositeOperation='source-over';
}

function endGame(win){
  if(G.over) return;                    // 同一局只能結算一次（否則進度會被重複推進）
  G.running=false; G.over=true; G.win=win;
  shake(8);
  SFX.musicStop();
  document.getElementById('pauseOverlay').classList.add('hide');
  if(win){
    G.fw=true; G.fwT=0; SFX.win();
    for(let i=0;i<7;i++) setTimeout(()=>{ if(G&&G.fw) spawnFirework(i%3===0); }, i*120);
    // 解鎖下一關
    if(G.lvIdx+2>PROGRESS){ PROGRESS=G.lvIdx+2; saveProgress(); }   // 只能往前推一關
  } else SFX.lose();
  const hasNext = win && G.lvIdx+1<LEVELS.length;
  nextEl.classList.toggle('hide',!hasNext);
  overTitle.textContent = win?'CLEAR!':'GAME OVER';
  overTitle.style.background = win
    ? 'linear-gradient(95deg,#7ef7c0,#4ff0ff)' : 'linear-gradient(95deg,#ff4f7d,#ffb84f)';
  overTitle.style.webkitBackgroundClip='text'; overTitle.style.backgroundClip='text';
  shotEl.src=makePolaroid(win);
  overEl.classList.toggle('win',!!win);
  setTimeout(()=>overEl.classList.remove('hide'), win?1600:320);
}

document.getElementById('btnPlay').onclick=()=>{ LV_IDX=Math.min(SEL_IDX,LEVELS.length-1); start(); };
// v0.9.9：「從第 1 關重來」是不可逆的操作（會清掉破關進度），改成先跳二次確認彈窗，
// 點「確定重來」才真的執行，點「取消」或誤觸都不會動到 PROGRESS。
const confirmBoxEl=document.getElementById('confirmBox');
document.getElementById('btnReset').onclick=()=>{ confirmBoxEl.classList.remove('hide'); };
document.getElementById('btnResetCancel').onclick=()=>{ confirmBoxEl.classList.add('hide'); };
document.getElementById('btnResetConfirm').onclick=()=>{
  confirmBoxEl.classList.add('hide');
  PROGRESS=1; SEL_IDX=0; saveProgress(); renderStage();
};
document.getElementById('btnAgain').onclick=()=>start();
document.getElementById('btnMenu').onclick=showMenu;
nextEl.onclick=()=>{ if(LV_IDX+1<LEVELS.length){ LV_IDX++; } start(); };
document.getElementById('btnSave').onclick=()=>{
  const a=document.createElement('a'); a.href=shotEl.src;
  a.download='goo-blaster-L'+(LV_IDX+1)+'.png'; a.click();
};
// v0.9.10：遊戲中的暫停鍵。跟升級卡選擇共用 G.paused；btnPause/btnNuke 兩顆按鈕
// 本身要不要顯示，統一在 drawHUD() 裡每幀跟著 G.running/G.paused 判斷，這裡只管
// pauseOverlay 這個彈窗本身的開關，不用重複管按鈕的顯示/隱藏。
const pauseOverlayEl=document.getElementById('pauseOverlay');
pauseBtnEl.onclick=()=>{
  if(!G||!G.running||G.paused)return;
  G.paused=true; pauseOverlayEl.classList.remove('hide');
};
document.getElementById('btnResume').onclick=()=>{
  if(!G)return;
  G.paused=false; pauseOverlayEl.classList.add('hide');
};
document.getElementById('btnQuitToMenu').onclick=()=>{
  if(G){ G.running=false; G.paused=false; }
  pauseOverlayEl.classList.add('hide');
  showMenu();
};
// v0.9.10：核彈按鈕——場上所有非 Boss 敵人（「低級的怪物」）直接死亡，Boss 不受影響。
// 用 killEnemy() 而不是扣血，確保是「一定死」，不是「傷害夠不夠」。
nukeBtnEl.onclick=()=>{
  if(!G||!G.running||G.paused||!G.P.nukeHeld) return;
  G.P.nukeHeld=false;
  const targets=G.E.filter(e=>!e.boss);
  const n=targets.length;
  for(const e of targets) killEnemy(e);
  G.EB.length=0;                          // 順便清空敵方彈幕，畫面乾淨清爽
  toast('☢️ 核彈引爆！清空 '+n+' 隻小怪','#ff9a4f');
  // v0.9.12：畫面效果加強——原本只有一層粒子噴發，現在疊三層擴散衝擊波
  // （由內而外：白核心 → 橘中層 → 暗紅外環，時間差 0.05 秒讓層次感更明顯）
  // + 全螢幕閃光 + 更大量的粒子噴發，搭配專屬爆炸音效（不再借用 Boss 死亡音）
  shake(20); hitstop(.22);
  G.nukeFlash=1;
  G.SHOCK.push({x:G.P.x,y:G.P.y,r:10,spd:620,life:.55,max:.55,hue:48});
  G.SHOCK.push({x:G.P.x,y:G.P.y,r:6, spd:520,life:.60,max:.60,hue:28});
  G.SHOCK.push({x:G.P.x,y:G.P.y,r:2, spd:430,life:.68,max:.68,hue:355});
  burst(G.P.x,G.P.y,90,25,3.2);
  SFX.nukeBlast();
};
renderStage();

G=newGame(); G.running=false;
requestAnimationFrame(loop);
</script>
